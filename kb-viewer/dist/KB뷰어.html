-365 | [[쇼츠-업로드-전략]] |\n| 드래프트를 1080p로 올리면 더 깨져 보임 | 원인 불명, 못 느꼈다는 사람도 있음 | L5962-5971 | [[드리미나]] |\n| 드리미나의 시댄스와 다른 곳의 시댄스는 다른가? | 공식 홈과 남의 툴이라 특징이 다름 | L6158-6160 | [[시댄스]] |\n| 효과음은 어디서? | 직접 만들어 모아 두기, 유튜브 모음 찾기 | L2990, L3603 | [[음악-만들기]] |\n","lines":["질문 · 방 안 답 · 줄 · 더 보기","--- · --- · --- · ---","완전 초보는 뭐부터? · GPT에 익숙해진 뒤 Flow 무료로 연습, 고가 강의는 비추천 · L3557-3673 · 초보-시작-가이드","월 10만 원이면 얼마나? · 시댄스 기준 약 2분 30초~3분 · L5442-5523 · 크레딧-비용-절약","어떤 플랫폼? · 모델 먼저, 플랫폼은 그다음 · L5530 · 영상-모델-비교","애니는 어디서? · 힉스필드의 시댄스 추천. 드리미나는 시댄스만 있음 · L5443-5445 · 힉스필드","GPT와 클로드 중 뭐가 나음? · 이미지·사용량은 GPT, 스토리·코드는 클로드 · L5011-5044 · GPT-코덱스, 클로드","GPT와 Codex는 한도를 같이 씀? · 따로. 이미지 결과는 같음 · L1148-1149, L5082-5104 · 사용량-관리","Flow 영상을 상업적으로 써도 됨? · 됨. 단 워터마크 있음 · L3235-3244 · Flow","힉스필드 MCP는 결제해야 함? · 연결은 무료, 생성은 크레딧 · L5057-5059 · 클로드-MCP-활용","'힉스 Pro' 메일이 왔다 · 홈페이지에 없는 요금제, 사기 의심 · L5978-5981 · 힉스필드","건물·풍경 카메라 무빙은? · 어느 모델이든 비슷함. Blender 프리비즈가 최선 · L5093-5096 · 미니맥스-H3","캐릭터 시트를 인체 비율이 안 깨지게 하려면? · 요소를 중복하지 않기, 참고 영상 보기 · L5421-5439 · 캐릭터-시트","캡컷으로 내보내면 울렁거린다 · 24fps로 내보내기 · L302-306 · 편집-툴","한글 글자가 나오나? · 복불복 · L26-38 · 미니맥스-H3","로컬 LLM과 영상 중 VRAM을 더 먹는 것? · LLM · L5-7 · 로컬-영상-생성","맥스튜디오와 일반 PC의 차이? · 영상은 엔비디아가 빠름 · L819-850 · 로컬-영상-생성","유튜브 멤버십 버튼이 없다 · 수익창출 뒤 1~2일, 별도 심사 · L353-365 · 쇼츠-업로드-전략","드래프트를 1080p로 올리면 더 깨져 보임 · 원인 불명, 못 느꼈다는 사람도 있음 · L5962-5971 · 드리미나","드리미나의 시댄스와 다른 곳의 시댄스는 다른가? · 공식 홈과 남의 툴이라 특징이 다름 · L6158-6160 · 시댄스","효과음은 어디서? · 직접 만들어 모아 두기, 유튜브 모음 찾기 · L2990, L3603 · 음악-만들기"]},"초보-시작-가이드":{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방","tags":"가이드 초보","text":"초보 시작 가이드 (방 안 답변 종합)\n# 초보 시작 가이드 (방 안 답변 종합)\n\nAI 영상을 처음 시작하는 사람에게 방에서 실제로 해 준 조언을 순서대로 묶었습니다.\n\n## 1단계: LLM과 친해지기\n- **GPT 무료판**부터 써 봅니다. 이미지를 그릴 수 있고 사용량이 넉넉해서 초보에게 권합니다 (L3563-3602, L3808-3813). → [[GPT-코덱스]]\n- **코딩은 몰라도 됩니다.** \"그냥 대화하면 된다\"는 답이었습니다 (L3668-3673).\n\n## 2단계: 무료로 연습하기\n- [[Flow]]의 매일 무료 크레딧으로 짧은 영상을 만들어 봅니다 (L3230-3244).\n- 편집은 [[편집-툴|캡컷]]으로 시작합니다 (L3601).\n\n## 3단계: 모델과 예산 정하기\n- [[영상-모델-비교]]를 보고 모델을 먼저 정한 뒤 플랫폼을 고릅니다.\n- **예: 월 10만 원**이면 [[시댄스]] 기준 약 2분 30초~3분입니다 (대학 과제 상담, 11월, L5442-5523).\n- 저화질로 여러 모델을 시험해 본 뒤 고릅니다 → [[크레딧-비용-절약]]\n\n## 하지 말 것\n- **고가 유료 강의 (300만 원 등):** 대부분 말렸고, 방에서는 문의도 금지입니다. 대신 다음을 권했습니다 (L2503-2743).\n  - 구독료로 직접 해 보기\n  - 방장 영상\n  - 지자체 무료 교육\n- **외주로 비싸게 사기:** 광고 영상을 외주로 50만 원에 산 사례에는 비싸다는 반응이 많았습니다 (L3557-3676).\n\n## 다음에 볼 것\n- [[캐릭터-시트]]\n- [[대사와-목소리]]\n- [[로컬-영상-생성]]\n- [[자주-나온-질문]]\n","lines":["AI 영상을 처음 시작하는 사람에게 방에서 실제로 해 준 조언을 순서대로 묶었습니다.","GPT 무료판부터 써 봅니다. 이미지를 그릴 수 있고 사용량이 넉넉해서 초보에게 권합니다 (L3563-3602, L3808-3813). → GPT-코덱스","코딩은 몰라도 됩니다. \"그냥 대화하면 된다\"는 답이었습니다 (L3668-3673).","Flow의 매일 무료 크레딧으로 짧은 영상을 만들어 봅니다 (L3230-3244).","편집은 캡컷으로 시작합니다 (L3601).","영상-모델-비교를 보고 모델을 먼저 정한 뒤 플랫폼을 고릅니다.","예: 월 10만 원이면 시댄스 기준 약 2분 30초~3분입니다 (대학 과제 상담, 11월, L5442-5523).","저화질로 여러 모델을 시험해 본 뒤 고릅니다 → 크레딧-비용-절약","고가 유료 강의 (300만 원 등): 대부분 말렸고, 방에서는 문의도 금지입니다. 대신 다음을 권했습니다 (L2503-2743).","구독료로 직접 해 보기","방장 영상","지자체 무료 교육","외주로 비싸게 사기: 광고 영상을 외주로 50만 원에 산 사례에는 비싸다는 반응이 많았습니다 (L3557-3676).","캐릭터-시트","대사와-목소리","로컬-영상-생성","자주-나온-질문"]},"AI영상방-규칙":{"name":"AI영상방-규칙","title":"AI영상방 규칙과 운영 기록","folder":"AI영상방","tags":"규칙 운영","text":"AI영상방 규칙과 운영 기록\n# AI영상방 규칙과 운영 기록\n\n## 규칙\n| 규칙 | 근거 |\n|---|---|\n| 닉네임은 \"닉네임/지역\" 형식 (방장 공지를 보고 바꾸는 회원들) | L2714, L3717 |\n| **고액 유료 강의는 추천도 문의도 금지** (방장, 9/21) | L2690 |\n| 외부 투표·추천 홍보는 방장 허락을 받은 뒤 링크만 공유. 좋아요는 자유 | L2866-2880 |\n| 자기 작품 링크(외부 플랫폼)는 방장에게 먼저 확인 | L4879-4882 |\n| 남이 공유한 이미지를 쓸 때는 출처를 밝힘 (\"공유방이니 자유롭게, 출처는 말해 달라\") | L680-690 |\n| 연락처 같은 개인정보가 노출되면 지움 | L3631-3632 |\n| 노출이 있거나 선정적인 이미지는 올리지 않음 | L5196-5240 |\n\n## 운영 기록 (중립적으로 정리)\n- **9/21 고가 강의 문의:** 약 300만 원짜리 강의를 들어도 되는지 묻는 질문에 대부분 말렸습니다. 이후 방장이 고액 강의 금지를 공지했습니다 (L2503-2743).\n- **9/23 오후 말다툼:** 참여자 사이에 언쟁이 있었습니다 (L4500-4545).\n  - 관리자가 메시지 여러 건을 가렸고, 한 참여자가 내보내졌습니다.\n  - 이후 사과가 오가며 분위기가 진정됐습니다.\n- **11월 카카오 이용 정지 사례:** 한 회원이 직접 그린 그림 때문에 카카오에서 1주일 이용 정지를 받았다고 말했습니다 (L5196-5217).\n  - 예전에도 비슷한 정지 사례가 있었다고 합니다 (L5202, L5239).\n  - 방 안 결론은 \"사진·영상은 안전한 것만 올리자\"였습니다.\n- **가려진 메시지:** 기간 중 \"관리자가 메시지를 가렸습니다\"가 여러 번 나옵니다. 사유는 기록에 없습니다.\n\n관련: [[AI영상방]]\n","lines":["규칙 · 근거","--- · ---","닉네임은 \"닉네임/지역\" 형식 (방장 공지를 보고 바꾸는 회원들) · L2714, L3717","고액 유료 강의는 추천도 문의도 금지 (방장, 9/21) · L2690","외부 투표·추천 홍보는 방장 허락을 받은 뒤 링크만 공유. 좋아요는 자유 · L2866-2880","자기 작품 링크(외부 플랫폼)는 방장에게 먼저 확인 · L4879-4882","남이 공유한 이미지를 쓸 때는 출처를 밝힘 (\"공유방이니 자유롭게, 출처는 말해 달라\") · L680-690","연락처 같은 개인정보가 노출되면 지움 · L3631-3632","노출이 있거나 선정적인 이미지는 올리지 않음 · L5196-5240","9/21 고가 강의 문의: 약 300만 원짜리 강의를 들어도 되는지 묻는 질문에 대부분 말렸습니다. 이후 방장이 고액 강의 금지를 공지했습니다 (L2503-2743).","9/23 오후 말다툼: 참여자 사이에 언쟁이 있었습니다 (L4500-4545).","관리자가 메시지 여러 건을 가렸고, 한 참여자가 내보내졌습니다.","이후 사과가 오가며 분위기가 진정됐습니다.","11월 카카오 이용 정지 사례: 한 회원이 직접 그린 그림 때문에 카카오에서 1주일 이용 정지를 받았다고 말했습니다 (L5196-5217).","예전에도 비슷한 정지 사례가 있었다고 합니다 (L5202, L5239).","방 안 결론은 \"사진·영상은 안전한 것만 올리자\"였습니다.","가려진 메시지: 기간 중 \"관리자가 메시지를 가렸습니다\"가 여러 번 나옵니다. 사유는 기록에 없습니다.","관련: AI영상방"]},"대사와-목소리":{"name":"대사와-목소리","title":"대사와 목소리","folder":"AI영상방","tags":"영상 음성","text":"대사와 목소리\n# 대사와 목소리\n\n## 대사 발음 개선 ([[시댄스]], 방장, 11월, L5145-5149)\n- 시댄스는 대사에 한계가 있습니다.\n- **여러 번 뽑거나 duration을 넉넉히** 줍니다.\n- 대사는 **소리 나는 대로** 적습니다. 예: \"C급\" → \"씨끕\"\n\n## 잘못 나온 대사만 고치기: Runa의 스킬 (11월)\n- 영상은 그대로 두고, 이상한 대사 음성만 골라 바꾸는 **클로드 로컬 스킬**입니다 (L5159-5178).\n  - 로컬에서 돌아가 비용이 들지 않습니다.\n  - 시댄스 억양도 잡습니다.\n- 11/5 밤에 구글 드라이브로 배포했습니다 (L6005).\n  - 압축을 풀고 안의 TXT 안내대로 진행합니다.\n  - **한국어만** 지원합니다.\n- RunningHub 워크플로로 만든 립싱크 도구도 있습니다 (L4843-4860).\n- **주의:** 회원이 올린 파일이므로 실행하기 전에 내용을 확인하세요.\n\n## 목소리 지정 (Mr.HAN)\n- **처음 만들 때** 음성 레퍼런스를 넣는 것이 가장 효율적입니다. 나중에 바꾸려면 해당 구간을 잘라 립싱크를 다시 해야 합니다 (8월, L422-426).\n- 원하는 말투를 내려면 음성을 레퍼런스로 넣어 음색과 말투를 따르게 합니다 (9월, L4372).\n- **보이스 클로닝 도구:** Supertone Play, Vrew, ElevenLabs (판도라고 정리, L4399-4435)\n- **Typecast:** 성우 \"필재\"가 언급됐습니다 (L5542).\n- **튜니:** 무료 버전은 립싱크가 맞지 않습니다 (L1120-1121).\n\n## 슬로우 효과 (ai공부중1, 11월)\n- 음성을 분리한 뒤 영상에만 슬로우를 겁니다.\n- 입모양이 보이는 구간은 음성도 함께 늦춰야 합니다 (L5397, L5402).\n","lines":["시댄스는 대사에 한계가 있습니다.","여러 번 뽑거나 duration을 넉넉히 줍니다.","대사는 소리 나는 대로 적습니다. 예: \"C급\" → \"씨끕\"","영상은 그대로 두고, 이상한 대사 음성만 골라 바꾸는 클로드 로컬 스킬입니다 (L5159-5178).","로컬에서 돌아가 비용이 들지 않습니다.","시댄스 억양도 잡습니다.","11/5 밤에 구글 드라이브로 배포했습니다 (L6005).","압축을 풀고 안의 TXT 안내대로 진행합니다.","한국어만 지원합니다.","RunningHub 워크플로로 만든 립싱크 도구도 있습니다 (L4843-4860).","주의: 회원이 올린 파일이므로 실행하기 전에 내용을 확인하세요.","처음 만들 때 음성 레퍼런스를 넣는 것이 가장 효율적입니다. 나중에 바꾸려면 해당 구간을 잘라 립싱크를 다시 해야 합니다 (8월, L422-426).","원하는 말투를 내려면 음성을 레퍼런스로 넣어 음색과 말투를 따르게 합니다 (9월, L4372).","보이스 클로닝 도구: Supertone Play, Vrew, ElevenLabs (판도라고 정리, L4399-4435)","Typecast: 성우 \"필재\"가 언급됐습니다 (L5542).","튜니: 무료 버전은 립싱크가 맞지 않습니다 (L1120-1121).","음성을 분리한 뒤 영상에만 슬로우를 겁니다.","입모양이 보이는 구간은 음성도 함께 늦춰야 합니다 (L5397, L5402)."]},"로컬-영상-생성":{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","folder":"AI영상방","tags":"로컬 하드웨어 워크플로","text":"로컬 영상 생성 (내 PC로 만들기)\n# 로컬 영상 생성 (내 PC로 만들기)\n\nComfyUI 같은 도구로 오픈 모델([[미니맥스-H3]], [[Wan]] 등)을 내 그래픽카드에서 돌리는 방법입니다.\n- **장점:** 크레딧이 들지 않습니다.\n- **단점:** 하드웨어와 시간이 듭니다.\n\n## 하드웨어 (방 안 의견)\n- **VRAM:** 16GB면 무난합니다. 5070 Ti 16GB와 3060 12GB도 돌아갑니다 (L9-17, L843-846).\n  - 가속 LoRA를 쓰면 8GB(3060 Ti)도 됩니다 (L1347-1348).\n- **엔비디아 vs 맥:** 영상 생성은 엔비디아(CUDA)가 맥보다 빠릅니다. 이미지는 비슷합니다 (L819-850).\n- **사양을 넘기면:** 스텝 수 등을 PC 성능 이상으로 올리면 GPU 대신 CPU로 넘어가 몇 시간씩 걸립니다 (L127-138).\n- **LLM과 비교:** 로컬 LLM이 영상 생성보다 VRAM을 더 씁니다 (L5-7).\n\n## 생성 시간 예시\n| 사양·설정 | 결과 | 줄 |\n|---|---|---|\n| 5070 Ti 16GB, 0.9MP | 8초 영상 14~20분 | L9-17 |\n| 3060 12GB, 데노 워크플로 | 10초 영상 약 700초 | L395, L846 |\n| 0.2MP + 업스케일 | 8초 영상 약 5분, 15초도 5분 | L576, L623, L704 |\n| 뉴디스 설정 (4스텝 + 8스텝 LoRA, 레이턴트 업스케일, RTX 업스케일, 프레임 보간) | 15초 영상 309초 | L699-740 |\n| 뜰의 측정 | 이미지 1장 25초, 4초 영상 98초 | L5334-5336 |\n\n## 속도 높이는 요령\n- **데노 워크플로 (저해상도 생성 후 업스케일):** 20스텝 대부분을 약 0.15MP로 돌리고 마지막 3스텝만 고해상도로 돌립니다 (Mr.HAN, L395-402).\n  - **r2v 전용**이라 i2v에서는 결과가 나쁩니다 (L407).\n  - sol 노드 에러가 나면 노드를 지우고 새 버전으로 다시 연결합니다 (L420).\n- **빠른 동작이나 작은 얼굴:** 레이턴트 업스케일을 끄고 1MP로 돌립니다. 시간은 2배쯤 걸립니다 (뉴디스, L699-740).\n- **어텐션:** Sol, Sage, Kitchen 어텐션을 씁니다. 검증이 많이 된 **Sage가 충돌이 적습니다**. 라데온은 따로 확인해야 합니다 (L377-391).\n- **얼굴 뭉개짐:** ComfyUI에 **FaceDetailer** 노드를 추가합니다 (두따, L2477).\n- **설치:** 노드 설치와 워크플로 생성은 코덱스나 클로드에게 맡기면 편합니다 (L392-418).\n\n## PC가 약하면: GPU 빌리기\n- **RunPod**(https://www.runpod.io/)에서 시간당 요금으로 GPU를 빌려 ComfyUI나 Wan2GP를 돌립니다 (로킹, L3134-3166).\n- wan2gp.com은 다른 사이트이니 주의하세요 (L3139-3143).\n\n## 회원 파이프라인\n- **두따 (RAM 64GB, RTX 5080):** [[YuE2]]로 작곡 → Krea2로 캐릭터 시트 → 로컬 미니맥스 H3(ref2v)로 영상 → 프리미어로 편집 → AE로 자막 (L4049-4050)\n- **Mr.HAN:** [[드리미나]] 스토리 스튜디오로 대본과 에셋 → [[뮤즈-AI|뮤즈]]로 미니맥스용 프롬프트 → RunningHub API로 영상 (L6193-6194)\n","lines":["ComfyUI 같은 도구로 오픈 모델(미니맥스-H3, Wan 등)을 내 그래픽카드에서 돌리는 방법입니다.","장점: 크레딧이 들지 않습니다.","단점: 하드웨어와 시간이 듭니다.","VRAM: 16GB면 무난합니다. 5070 Ti 16GB와 3060 12GB도 돌아갑니다 (L9-17, L843-846).","가속 LoRA를 쓰면 8GB(3060 Ti)도 됩니다 (L1347-1348).","엔비디아 vs 맥: 영상 생성은 엔비디아(CUDA)가 맥보다 빠릅니다. 이미지는 비슷합니다 (L819-850).","사양을 넘기면: 스텝 수 등을 PC 성능 이상으로 올리면 GPU 대신 CPU로 넘어가 몇 시간씩 걸립니다 (L127-138).","LLM과 비교: 로컬 LLM이 영상 생성보다 VRAM을 더 씁니다 (L5-7).","사양·설정 · 결과 · 줄","--- · --- · ---","5070 Ti 16GB, 0.9MP · 8초 영상 14~20분 · L9-17","3060 12GB, 데노 워크플로 · 10초 영상 약 700초 · L395, L846","0.2MP + 업스케일 · 8초 영상 약 5분, 15초도 5분 · L576, L623, L704","뉴디스 설정 (4스텝 + 8스텝 LoRA, 레이턴트 업스케일, RTX 업스케일, 프레임 보간) · 15초 영상 309초 · L699-740","뜰의 측정 · 이미지 1장 25초, 4초 영상 98초 · L5334-5336","데노 워크플로 (저해상도 생성 후 업스케일): 20스텝 대부분을 약 0.15MP로 돌리고 마지막 3스텝만 고해상도로 돌립니다 (Mr.HAN, L395-402).","r2v 전용이라 i2v에서는 결과가 나쁩니다 (L407).","sol 노드 에러가 나면 노드를 지우고 새 버전으로 다시 연결합니다 (L420).","빠른 동작이나 작은 얼굴: 레이턴트 업스케일을 끄고 1MP로 돌립니다. 시간은 2배쯤 걸립니다 (뉴디스, L699-740).","어텐션: Sol, Sage, Kitchen 어텐션을 씁니다. 검증이 많이 된 Sage가 충돌이 적습니다. 라데온은 따로 확인해야 합니다 (L377-391).","얼굴 뭉개짐: ComfyUI에 FaceDetailer 노드를 추가합니다 (두따, L2477).","설치: 노드 설치와 워크플로 생성은 코덱스나 클로드에게 맡기면 편합니다 (L392-418).","RunPod(https://www.runpod.io/)에서 시간당 요금으로 GPU를 빌려 ComfyUI나 Wan2GP를 돌립니다 (로킹, L3134-3166).","wan2gp.com은 다른 사이트이니 주의하세요 (L3139-3143).","두따 (RAM 64GB, RTX 5080): YuE2로 작곡 → Krea2로 캐릭터 시트 → 로컬 미니맥스 H3(ref2v)로 영상 → 프리미어로 편집 → AE로 자막 (L4049-4050)","Mr.HAN: 드리미나 스토리 스튜디오로 대본과 에셋 → 뮤즈로 미니맥스용 프롬프트 → RunningHub API로 영상 (L6193-6194)"]},"사용량-관리":{"name":"사용량-관리","title":"사용량 관리 (LLM 한도)","folder":"AI영상방","tags":"LLM 사용량","text":"사용량 관리 (LLM 한도)\n# 사용량 관리 (LLM 한도)\n\n## 요령\n- **리셋 직후에는 \"사용량 증가(부스트)\" 옵션을 끕니다.** 켜 둔 채로 한도를 넘기면 코인이 빠집니다 (ai공부중1, L3687-3688).\n- **모델을 확인합니다.** 모델이 자동으로 바뀌는 경우가 있습니다. 예: 5.6 Sol이 중단되고 6으로 넘어갔습니다 (L4116-4126).\n- **한도가 따로인 곳을 나눠 씁니다.** Codex와 일반 채팅은 한도가 따로입니다 → [[GPT-코덱스]]\n- **무거운 작업을 피합니다.** 3D 모델링처럼 무거운 작업은 사용량을 크게 씁니다 (L3742-3777).\n- **클로드:** 5시간마다 초기화되고 Pro는 한도가 작습니다 (L534-535). Opus는 빨리 닳습니다 (L5126-5131).\n\n## 사건: 9월 코덱스 사용량 리셋 소동 (9/21~23)\n| 시점 | 일 | 줄 |\n|---|---|---|\n| 9/21~22 | OpenAI 관계자가 9/22 19시에 리셋한다고 예고한 것으로 받아들여짐. 회원들이 리셋 전에 사용량을 다 쓰려고 함 | L2812-2849, L3249-3255 |\n| 9/22 밤 | 리셋이 늦어져 불만이 커짐 | L3680-3989 |\n| 9/23 아침 | GPT가 **\"초기화권\"**을 지급함. 같은 날 클로드도 지급함 | L4195-4224, L4295-4300 |\n\n**교훈 (위키 정리):** 예고된 리셋에 맞춰 사용량을 몰아 쓰면 손해를 볼 수 있습니다.\n","lines":["리셋 직후에는 \"사용량 증가(부스트)\" 옵션을 끕니다. 켜 둔 채로 한도를 넘기면 코인이 빠집니다 (ai공부중1, L3687-3688).","모델을 확인합니다. 모델이 자동으로 바뀌는 경우가 있습니다. 예: 5.6 Sol이 중단되고 6으로 넘어갔습니다 (L4116-4126).","한도가 따로인 곳을 나눠 씁니다. Codex와 일반 채팅은 한도가 따로입니다 → GPT-코덱스","무거운 작업을 피합니다. 3D 모델링처럼 무거운 작업은 사용량을 크게 씁니다 (L3742-3777).","클로드: 5시간마다 초기화되고 Pro는 한도가 작습니다 (L534-535). Opus는 빨리 닳습니다 (L5126-5131).","시점 · 일 · 줄","--- · --- · ---","9/21~22 · OpenAI 관계자가 9/22 19시에 리셋한다고 예고한 것으로 받아들여짐. 회원들이 리셋 전에 사용량을 다 쓰려고 함 · L2812-2849, L3249-3255","9/22 밤 · 리셋이 늦어져 불만이 커짐 · L3680-3989","9/23 아침 · GPT가 \"초기화권\"을 지급함. 같은 날 클로드도 지급함 · L4195-4224, L4295-4300","교훈 (위키 정리): 예고된 리셋에 맞춰 사용량을 몰아 쓰면 손해를 볼 수 있습니다."]},"쇼츠-업로드-전략":{"name":"쇼츠-업로드-전략","title":"쇼츠·채널 운영 전략","folder":"AI영상방","tags":"유튜브","text":"쇼츠·채널 운영 전략\n# 쇼츠·채널 운영 전략\n\n## 업로드 간격 (사카요리 윤, 9월, L2328-2350)\n- 새 영상을 올리면 앞 영상의 조회수가 떨어지는지가 화제였습니다.\n- 앞 영상의 **조회수 파동이 잦아들 때쯤** 다음 영상을 올립니다.\n- 재고를 쌓아 두고 **3~7일 간격**으로 올리면 무난하다는 의견입니다.\n\n## 주제 잡기\n- 유행하는 주제를 조사해서 따릅니다. 예: 팝송을 트로트로 바꾸고 15초 루프 영상과 합쳐 롱폼으로 만들기 (L2631-2652)\n- 잘 되는 채널을 Gemini로 분석한 뒤 클로드나 GPT에게 프롬프트를 받습니다 (L2689).\n- 음악 채널은 커버곡을 가끔 섞습니다 (L5943-5949).\n\n## 수익화\n- **유튜브 멤버십 버튼이 안 보이면:** 수익창출 승인 뒤 1~2일 기다립니다. 멤버십은 따로 심사가 있습니다 (8월, L353-365).\n- **네이버 애드포스트:** 글 30개, 방문자 30~50명이면 당월 승인됐다는 경험담입니다 (N블 마블링, L4035).\n\n## 썸네일\n- 유튜브 스튜디오의 썸네일 AI 생성 기능을 씁니다. 썸네일 > 추천받기 (L4094-4104).\n","lines":["새 영상을 올리면 앞 영상의 조회수가 떨어지는지가 화제였습니다.","앞 영상의 조회수 파동이 잦아들 때쯤 다음 영상을 올립니다.","재고를 쌓아 두고 3~7일 간격으로 올리면 무난하다는 의견입니다.","유행하는 주제를 조사해서 따릅니다. 예: 팝송을 트로트로 바꾸고 15초 루프 영상과 합쳐 롱폼으로 만들기 (L2631-2652)","잘 되는 채널을 Gemini로 분석한 뒤 클로드나 GPT에게 프롬프트를 받습니다 (L2689).","음악 채널은 커버곡을 가끔 섞습니다 (L5943-5949).","유튜브 멤버십 버튼이 안 보이면: 수익창출 승인 뒤 1~2일 기다립니다. 멤버십은 따로 심사가 있습니다 (8월, L353-365).","네이버 애드포스트: 글 30개, 방문자 30~50명이면 당월 승인됐다는 경험담입니다 (N블 마블링, L4035).","유튜브 스튜디오의 썸네일 AI 생성 기능을 씁니다. 썸네일 > 추천받기 (L4094-4104)."]},"실사-이미지-지침":{"name":"실사-이미지-지침","title":"실사 이미지 지침 (그리고 GIF·이모티콘)","folder":"AI영상방","tags":"이미지 프롬프트","text":"실사 이미지 지침 (그리고 GIF·이모티콘)\n# 실사 이미지 지침 (그리고 GIF·이모티콘)\n\n## GPT 실사 지침 7항목 (뜰·로킹, 11월, L5670-5690)\n1. 화이트밸런스 5000~5500K\n2. 50mm 렌즈, F1.8~2.8 느낌의 심도\n3. SNS용 삼분할 구도와 여백\n4. 채도, HDR, 샤프닝은 낮춤\n5. 피부 모공과 재질별 텍스처는 살림\n6. 주광원은 하나로 통일하고 접촉 그림자를 넣음\n7. 카메라를 의식하지 않은 순간 포착\n\n- **테스트 결과:** 그래도 손가락이나 손잡이가 늘어나는 오류가 있어 따로 고쳐야 합니다 (L5703-5728).\n- 질감만 다시 렌더링하는 영문 프롬프트도 공유됐습니다 (L5743-5752).\n\n## 자글거림 줄이기\n- \"8K, hyper realistic, ultra detailed, film grain, HDR\" 같은 단어를 **너무 많이 넣으면 오히려 자글거립니다** (지니쓰, 9월, L2855).\n\n## 인쇄용 실사 (현수막 등, 8월)\n- 재질 결함, 렌즈, 조명을 구체적으로 적습니다. 네거티브 프롬프트에 CGI·플라스틱을 넣습니다 (슬곰이·판도라고, L985-1083).\n- 피사체를 따로 만든 뒤 합성하는 방법도 있습니다 (L1089).\n- 인쇄물은 인쇄용 컬러 코드 기준으로 작업합니다 (L925).\n- 수정은 Gemini나 나노바나나가 좋다는 의견입니다 (L1032-1037).\n- **한계:** 크게 확대하면 AI 특유의 물결무늬와 질감은 남습니다 (L1222).\n\n## 미니어처\n- 미니어처 이미지는 나노(바나나)가 GPT보다 낫다는 의견입니다 (햄펠, L5886).\n\n## GIF·카톡 이모티콘 만들기 (AN0, 11월, L5566-5578)\n- [[GPT-코덱스|GPT]]에 레퍼런스 이미지 1장과 프롬프트를 주고, 동작 컷 수를 늘리라고 합니다.\n- 배경과 몸 위치는 고정하고 팔·얼굴·옷자락만 움직이게 하면 자연스럽습니다.\n- 이모티콘 24개를 한 번에 요청하면 ZIP으로 받지만 **매우 느립니다.**\n\n## 이미지 차이 찾기\n두 이미지를 LLM에 넣고 무엇이 다른지 물어봅니다 (로킹, 요약 문서 기준).\n","lines":["화이트밸런스 5000~5500K","50mm 렌즈, F1.8~2.8 느낌의 심도","SNS용 삼분할 구도와 여백","채도, HDR, 샤프닝은 낮춤","피부 모공과 재질별 텍스처는 살림","주광원은 하나로 통일하고 접촉 그림자를 넣음","카메라를 의식하지 않은 순간 포착","테스트 결과: 그래도 손가락이나 손잡이가 늘어나는 오류가 있어 따로 고쳐야 합니다 (L5703-5728).","질감만 다시 렌더링하는 영문 프롬프트도 공유됐습니다 (L5743-5752).","\"8K, hyper realistic, ultra detailed, film grain, HDR\" 같은 단어를 너무 많이 넣으면 오히려 자글거립니다 (지니쓰, 9월, L2855).","재질 결함, 렌즈, 조명을 구체적으로 적습니다. 네거티브 프롬프트에 CGI·플라스틱을 넣습니다 (슬곰이·판도라고, L985-1083).","피사체를 따로 만든 뒤 합성하는 방법도 있습니다 (L1089).","인쇄물은 인쇄용 컬러 코드 기준으로 작업합니다 (L925).","수정은 Gemini나 나노바나나가 좋다는 의견입니다 (L1032-1037).","한계: 크게 확대하면 AI 특유의 물결무늬와 질감은 남습니다 (L1222).","미니어처 이미지는 나노(바나나)가 GPT보다 낫다는 의견입니다 (햄펠, L5886).","GPT에 레퍼런스 이미지 1장과 프롬프트를 주고, 동작 컷 수를 늘리라고 합니다.","배경과 몸 위치는 고정하고 팔·얼굴·옷자락만 움직이게 하면 자연스럽습니다.","이모티콘 24개를 한 번에 요청하면 ZIP으로 받지만 매우 느립니다.","두 이미지를 LLM에 넣고 무엇이 다른지 물어봅니다 (로킹, 요약 문서 기준)."]},"음악-만들기":{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방","tags":"음악","text":"음악 만들기\n# 음악 만들기\n\n| 도구 | 한 줄 평 | 페이지 |\n|---|---|---|\n| 수노 | 품질 좋음. 다운로드·export 불안정, 저작권 필터 과함 | [[수노]] |\n| YuE2 | 오픈소스 대안, 편곡 좋음. 상업 이용 논란 | [[YuE2]] |\n| Flow 뮤직 | 악기 표현이 좋음 (L2884-2890) | [[Flow]] |\n| Mureka | 올드한 느낌 (L4263) | – |\n| Gemini | 음악 생성에 쓴 사례 (L5384) | – |\n\n## 요령\n- **분위기 따라 하기:** 참고곡을 LLM에 주고 수노용 스타일 프롬프트와 가사를 받습니다 (로킹, L2271-2273).\n- **Flow + 수노:** Flow로 악기 파트를 만든 뒤 수노에 레퍼런스로 올립니다 (라이또, 요약 문서 기준).\n- **MV 작업 (라이또, L5842-5843):**\n  1. 클로드 + 수노 MCP로 곡을 만듭니다.\n  2. 자작 프로그램으로 마스터링과 업스케일을 합니다.\n  3. RunningHub에서 [[미니맥스-H3|미니맥스 H3]]로 영상을 만듭니다.\n- **효과음:** 작업할 때마다 직접 만들어 보관합니다 (Runa, L2990). 유튜브나 구글에서 효과음 모음을 찾을 수도 있습니다 (L3603).\n- **유입:** 커버곡을 가끔 섞습니다 (L5943-5949). → [[쇼츠-업로드-전략]]\n- **저작권:** [[저작권과-라이선스]]를 확인하세요.\n","lines":["도구 · 한 줄 평 · 페이지","--- · --- · ---","수노 · 품질 좋음. 다운로드·export 불안정, 저작권 필터 과함 · 수노","YuE2 · 오픈소스 대안, 편곡 좋음. 상업 이용 논란 · YuE2","Flow 뮤직 · 악기 표현이 좋음 (L2884-2890) · Flow","Mureka · 올드한 느낌 (L4263) · –","Gemini · 음악 생성에 쓴 사례 (L5384) · –","분위기 따라 하기: 참고곡을 LLM에 주고 수노용 스타일 프롬프트와 가사를 받습니다 (로킹, L2271-2273).","Flow + 수노: Flow로 악기 파트를 만든 뒤 수노에 레퍼런스로 올립니다 (라이또, 요약 문서 기준).","MV 작업 (라이또, L5842-5843):","클로드 + 수노 MCP로 곡을 만듭니다.","자작 프로그램으로 마스터링과 업스케일을 합니다.","RunningHub에서 미니맥스 H3로 영상을 만듭니다.","효과음: 작업할 때마다 직접 만들어 보관합니다 (Runa, L2990). 유튜브나 구글에서 효과음 모음을 찾을 수도 있습니다 (L3603).","유입: 커버곡을 가끔 섞습니다 (L5943-5949). → 쇼츠-업로드-전략","저작권: 저작권과-라이선스를 확인하세요."]},"저작권과-라이선스":{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방","tags":"저작권","text":"저작권과 라이선스 (방 안 의견)\n# 저작권과 라이선스 (방 안 의견)\n\n> 아래는 회원들의 **개인 의견**입니다. 법률 자문이 아닙니다.\n\n## 스타일과 캐릭터\n- **그림체·작화 스타일**을 따라 하는 것은 국내에서 보호 대상이 아니라는 의견입니다.\n- **기존 캐릭터 IP를 생성**하는 것은 위험합니다 (사카요리 윤, 9월, L2324-2374).\n\n## 플랫폼 필터\n- [[시댄스]]와 [[드리미나]]는 저작권 캐릭터와 댄스를 막습니다 (L170-178, L2789-2793).\n- [[수노]]는 저작권 필터가 과하다는 불만이 있습니다 (L4260).\n\n## 상업 이용\n| 대상 | 방 안 정보 | 줄 |\n|---|---|---|\n| [[Flow]] 결과물 | 유료도 워터마크가 있고, 상업적 사용은 가능하다는 답 | L3235-3244 |\n| [[YuE2]] | 가중치는 CC BY-NC(비상업)라는 지적과, 개인 상업 이용이 허용됐다는 주장이 엇갈림 → **직접 확인** | L4211, L4359 |\n\n## 입력 데이터\n- 시댄스가 입력한 프롬프트와 소스를 학습에 쓴다는 주장이 있습니다. 확인되지 않았습니다 (L4185).\n- [[힉스필드]] Enterprise는 입력을 학습에 쓰지 않는다고 합니다 (L4186).\n- 무료 서비스에는 개인정보를 넣지 마세요 → [[뮤즈-AI]]\n\n## 방 안 매너\n- 남이 공유한 이미지를 쓸 때는 **출처를 밝힙니다** (L680-690). → [[AI영상방-규칙]]\n","lines":["아래는 회원들의 개인 의견입니다. 법률 자문이 아닙니다.","그림체·작화 스타일을 따라 하는 것은 국내에서 보호 대상이 아니라는 의견입니다.","기존 캐릭터 IP를 생성하는 것은 위험합니다 (사카요리 윤, 9월, L2324-2374).","시댄스와 드리미나는 저작권 캐릭터와 댄스를 막습니다 (L170-178, L2789-2793).","수노는 저작권 필터가 과하다는 불만이 있습니다 (L4260).","대상 · 방 안 정보 · 줄","--- · --- · ---","Flow 결과물 · 유료도 워터마크가 있고, 상업적 사용은 가능하다는 답 · L3235-3244","YuE2 · 가중치는 CC BY-NC(비상업)라는 지적과, 개인 상업 이용이 허용됐다는 주장이 엇갈림 → 직접 확인 · L4211, L4359","시댄스가 입력한 프롬프트와 소스를 학습에 쓴다는 주장이 있습니다. 확인되지 않았습니다 (L4185).","힉스필드 Enterprise는 입력을 학습에 쓰지 않는다고 합니다 (L4186).","무료 서비스에는 개인정보를 넣지 마세요 → 뮤즈-AI","남이 공유한 이미지를 쓸 때는 출처를 밝힙니다 (L680-690). → AI영상방-규칙"]},"캐릭터-시트":{"name":"캐릭터-시트","title":"캐릭터 시트","folder":"AI영상방","tags":"이미지 워크플로","text":"캐릭터 시트\n# 캐릭터 시트\n\n영상에서 같은 인물이 일관되게 나오게 하려고 미리 만들어 두는 인물 설정 이미지입니다.\n\n## 요령\n- **요소를 중복해서 넣지 않습니다.** 시트에 얼굴이 2개 있으면 영상에서 얼굴이 왔다 갔다 합니다 (ai공부중1, L5434-5435).\n- **3D나 회전이 필요하면:** 정면·측면·후면 삼면도를 먼저 만든 뒤 붙입니다 (ai공부중1, L3768).\n- **도구 분담:** 시트는 [[GPT-코덱스|GPT]], 배경은 [[미드저니]]나 [[뮤즈-AI|뮤즈]]로 만듭니다 (L6246-6248).\n  - 미드저니는 색감은 좋지만 시트를 잘 못 만듭니다 (L6266).\n- **뮤즈에 학습시키기:** 좋은 시트 예시를 몇 개 먼저 보여 주고 \"앞으로 이렇게\"라고 합니다 (Mr.HAN, L6269).\n- **배경 글자 고정:** 한글 간판 같은 배경 글자는 배경 시트로 고정합니다 (Mr.HAN, L5095).\n\n## 용어\n- **\"인삐\":** \"인체 삐꾸\"의 줄임말. 인체 비율이 어색하게 나온 상태를 말합니다 (L5424-5429).\n\n## 참고\n- 캐릭터 시트 만드는 법 영상: https://www.youtube.com/watch?v=mKTADGOSZnY (L5439)\n- 방장 영상을 참고하라는 답도 있었습니다 (L5425).\n- 더 많은 링크는 [[쓸만한-링크]]에 있습니다.\n","lines":["영상에서 같은 인물이 일관되게 나오게 하려고 미리 만들어 두는 인물 설정 이미지입니다.","요소를 중복해서 넣지 않습니다. 시트에 얼굴이 2개 있으면 영상에서 얼굴이 왔다 갔다 합니다 (ai공부중1, L5434-5435).","3D나 회전이 필요하면: 정면·측면·후면 삼면도를 먼저 만든 뒤 붙입니다 (ai공부중1, L3768).","도구 분담: 시트는 GPT, 배경은 미드저니나 뮤즈로 만듭니다 (L6246-6248).","미드저니는 색감은 좋지만 시트를 잘 못 만듭니다 (L6266).","뮤즈에 학습시키기: 좋은 시트 예시를 몇 개 먼저 보여 주고 \"앞으로 이렇게\"라고 합니다 (Mr.HAN, L6269).","배경 글자 고정: 한글 간판 같은 배경 글자는 배경 시트로 고정합니다 (Mr.HAN, L5095).","\"인삐\": \"인체 삐꾸\"의 줄임말. 인체 비율이 어색하게 나온 상태를 말합니다 (L5424-5429).","캐릭터 시트 만드는 법 영상: https://www.youtube.com/watch?v=mKTADGOSZnY (L5439)","방장 영상을 참고하라는 답도 있었습니다 (L5425).","더 많은 링크는 쓸만한-링크에 있습니다."]},"크레딧-비용-절약":{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","folder":"AI영상방","tags":"비용","text":"크레딧·비용 절약\n# 크레딧·비용 절약\n\n방 안에서 나온 **정당한** 절약 방법만 모았습니다. 여러 계정으로 무료나 할인을 반복해서 받는 방법은 약관 위반 소지가 있어 넣지 않았습니다.\n\n## 원칙\n- **모델을 먼저 정하고, 그 모델을 싸게 쓰는 플랫폼을 고릅니다** (Mr.HAN, L5530).\n- 크레딧 총량이 아니라 **생성 1회에 드는 크레딧**을 비교합니다 (Mr.HAN, L5119).\n- 비싼 [[시댄스]]는 **화려한 액션 컷에만** 씁니다 (빌런, L5481).\n\n## 방법\n| 방법 | 내용 | 줄 |\n|---|---|---|\n| 프롬프트는 밖에서 | 프롬프트 작업은 GPT, Gemini, Codex에서 하고 플랫폼에서는 생성만 함 | L458, L471 |\n| 저화질로 시험 | 480p로 시험한 뒤 720p로 뽑거나 업스케일 | L478 |\n| 조금씩 사서 비교 | [[힉스필드]]나 OpenArt에서 크레딧을 조금 사서 여러 모델을 저화질로 비교 | L5519 |\n| 해상도 무관 과금 | motionmux의 [[Wan]] 3.0은 해상도와 관계없이 초당 15크레딧이라 1080p로 뽑기 | L1254-1258 |\n| 무료 크레딧 | [[Flow]]는 계정마다 매일 50크레딧 (정상 사용 범위) | L2554 |\n| 로컬 | [[로컬-영상-생성]] | – |\n\n## 예산 감 잡기 (대화 시점 기준)\n- **월 10만 원:** 시댄스 기준으로 약 2분 30초~3분 (L5442-5523)\n- **시댄스로만 약 3분:** 약 9만~10만 원 (L5492-5493)\n- **월 500크레딧:** 시댄스 2.0 기준으로 약 8분 (8월, L476)\n- **캡컷 기본 구독:** 약 12초 분량 → [[드리미나]]\n","lines":["방 안에서 나온 정당한 절약 방법만 모았습니다. 여러 계정으로 무료나 할인을 반복해서 받는 방법은 약관 위반 소지가 있어 넣지 않았습니다.","모델을 먼저 정하고, 그 모델을 싸게 쓰는 플랫폼을 고릅니다 (Mr.HAN, L5530).","크레딧 총량이 아니라 생성 1회에 드는 크레딧을 비교합니다 (Mr.HAN, L5119).","비싼 시댄스는 화려한 액션 컷에만 씁니다 (빌런, L5481).","방법 · 내용 · 줄","--- · --- · ---","프롬프트는 밖에서 · 프롬프트 작업은 GPT, Gemini, Codex에서 하고 플랫폼에서는 생성만 함 · L458, L471","저화질로 시험 · 480p로 시험한 뒤 720p로 뽑거나 업스케일 · L478","조금씩 사서 비교 · 힉스필드나 OpenArt에서 크레딧을 조금 사서 여러 모델을 저화질로 비교 · L5519","해상도 무관 과금 · motionmux의 Wan 3.0은 해상도와 관계없이 초당 15크레딧이라 1080p로 뽑기 · L1254-1258","무료 크레딧 · Flow는 계정마다 매일 50크레딧 (정상 사용 범위) · L2554","로컬 · 로컬-영상-생성 · –","월 10만 원: 시댄스 기준으로 약 2분 30초~3분 (L5442-5523)","시댄스로만 약 3분: 약 9만~10만 원 (L5492-5493)","월 500크레딧: 시댄스 2.0 기준으로 약 8분 (8월, L476)","캡컷 기본 구독: 약 12초 분량 → 드리미나"]},"클로드-MCP-활용":{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","folder":"AI영상방","tags":"LLM MCP 자동화","text":"클로드 MCP 활용\n# 클로드 MCP 활용\n\n[[클로드]]에 외부 도구를 MCP로 연결해 이미지·영상·음악 작업을 시키는 방법입니다.\n\n## 연결 사례\n- **[[힉스필드]] MCP:** 연결은 무료이고 생성에는 크레딧이 듭니다 (L523-524, L5057-5059). 무제한 요금제는 MCP에 적용되지 않습니다 (L4280).\n- **[[수노]] MCP:** 곡을 만들게 하면 편합니다 (L4709-4734).\n- **원격 지휘:** PC에 클로드를 켜 두고 휴대폰으로 지시하면, 크롬 디버깅과 MCP로 그림·음악·영상까지 처리합니다 (ai공부중1, L6254-6259).\n\n## 토큰 절약 (카이로스, 8월, L536-568)\n1. 결과물을 **위젯이 아니라 링크로** 받습니다.\n2. 스킬 파일은 호출할 때마다 전문을 읽습니다. 그래서 시행착오는 **한 줄씩만** 별도 MD 파일에 적습니다.\n3. 핸드오프·레지스터 MD는 주기적으로 정리합니다.\n4. 스킬을 **코어·마스터·이미지·비디오로 나눠** 필요한 것만 읽게 합니다.\n\n## 대화 관리\n- 대화가 길어져 품질이 떨어지면 새 채팅으로 옮깁니다 (빌런, L5034).\n\n관련: [[사용량-관리]]\n","lines":["클로드에 외부 도구를 MCP로 연결해 이미지·영상·음악 작업을 시키는 방법입니다.","힉스필드 MCP: 연결은 무료이고 생성에는 크레딧이 듭니다 (L523-524, L5057-5059). 무제한 요금제는 MCP에 적용되지 않습니다 (L4280).","수노 MCP: 곡을 만들게 하면 편합니다 (L4709-4734).","원격 지휘: PC에 클로드를 켜 두고 휴대폰으로 지시하면, 크롬 디버깅과 MCP로 그림·음악·영상까지 처리합니다 (ai공부중1, L6254-6259).","결과물을 위젯이 아니라 링크로 받습니다.","스킬 파일은 호출할 때마다 전문을 읽습니다. 그래서 시행착오는 한 줄씩만 별도 MD 파일에 적습니다.","핸드오프·레지스터 MD는 주기적으로 정리합니다.","스킬을 코어·마스터·이미지·비디오로 나눠 필요한 것만 읽게 합니다.","대화가 길어져 품질이 떨어지면 새 채팅으로 옮깁니다 (빌런, L5034).","관련: 사용량-관리"]},"AI영상방":{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방","tags":"대화방","text":"AI영상방 (AI아스트라 AI영상 노하우 공유방)\n# AI영상방 (AI아스트라 AI영상 노하우 공유방)\n\n> 근거 자료: [[src-AI영상방-대화]] (원문), [[src-AI영상방-요약]] (사람이 만든 요약, 원문과 대조함)\n\nAI로 영상·이미지·음악을 만드는 사람들이 노하우를 나누는 카카오톡 오픈채팅방입니다.\n- **방장:** AI Astra. 유튜브에서 AI 영상 강의와 AI 드라마를 운영합니다.\n- **참여자:** 155명이 말했습니다.\n\n## 무엇을 얻을 수 있나\n| 분야 | 페이지 |\n|---|---|\n| 영상 모델 고르기 | [[영상-모델-비교]], [[시댄스]], [[클링]], [[Wan]], [[미니맥스-H3]], [[탑뷰-T1]], [[그록]] |\n| 어디서 쓰나 (플랫폼) | [[힉스필드]], [[드리미나]], [[런웨이]], [[Flow]] |\n| 내 PC로 만들기 | [[로컬-영상-생성]] |\n| 이미지 | [[실사-이미지-지침]], [[캐릭터-시트]], [[GPT-코덱스]], [[뮤즈-AI]] |\n| 대사·목소리·음악 | [[대사와-목소리]], [[음악-만들기]], [[수노]], [[YuE2]] |\n| LLM 활용 | [[GPT-코덱스]], [[클로드]], [[클로드-MCP-활용]], [[사용량-관리]] |\n| 편집 | [[편집-툴]] |\n| 돈 아끼기 | [[크레딧-비용-절약]] |\n| 유튜브 운영 | [[쇼츠-업로드-전략]] |\n| 저작권 | [[저작권과-라이선스]] |\n| 처음이라면 | [[초보-시작-가이드]], [[자주-나온-질문]], [[쓸만한-링크]] |\n\n## 방 규칙\n→ [[AI영상방-규칙]]\n\n## 주의\n- 노하우는 **회원들의 의견과 경험담**입니다. 위키를 만들면서 직접 검증하지 않았습니다.\n- 가격, 한도, 모델 버전은 자주 바뀝니다. 페이지마다 \"몇 월 대화 기준\"인지 함께 봐야 합니다.\n- 방 이름의 \"아스트라\"는 방장 닉네임입니다.\n  - 대화에서는 GPT 계열 최신 모델 이름으로도 쓰입니다 (L4610 근처, 불확실).\n","lines":["근거 자료: src-AI영상방-대화 (원문), src-AI영상방-요약 (사람이 만든 요약, 원문과 대조함)","AI로 영상·이미지·음악을 만드는 사람들이 노하우를 나누는 카카오톡 오픈채팅방입니다.","방장: AI Astra. 유튜브에서 AI 영상 강의와 AI 드라마를 운영합니다.","참여자: 155명이 말했습니다.","분야 · 페이지","--- · ---","영상 모델 고르기 · 영상-모델-비교, 시댄스, 클링, Wan, 미니맥스-H3, 탑뷰-T1, 그록","어디서 쓰나 (플랫폼) · 힉스필드, 드리미나, 런웨이, Flow","내 PC로 만들기 · 로컬-영상-생성","이미지 · 실사-이미지-지침, 캐릭터-시트, GPT-코덱스, 뮤즈-AI","대사·목소리·음악 · 대사와-목소리, 음악-만들기, 수노, YuE2","LLM 활용 · GPT-코덱스, 클로드, 클로드-MCP-활용, 사용량-관리","편집 · 편집-툴","돈 아끼기 · 크레딧-비용-절약","유튜브 운영 · 쇼츠-업로드-전략","저작권 · 저작권과-라이선스","처음이라면 · 초보-시작-가이드, 자주-나온-질문, 쓸만한-링크","→ AI영상방-규칙","노하우는 회원들의 의견과 경험담입니다. 위키를 만들면서 직접 검증하지 않았습니다.","가격, 한도, 모델 버전은 자주 바뀝니다. 페이지마다 \"몇 월 대화 기준\"인지 함께 봐야 합니다.","방 이름의 \"아스트라\"는 방장 닉네임입니다.","대화에서는 GPT 계열 최신 모델 이름으로도 쓰입니다 (L4610 근처, 불확실)."]},"Flow":{"name":"Flow","title":"Flow (구글)","folder":"AI영상방","tags":"도구 플랫폼 무료","text":"Flow (구글)\n# Flow (구글)\n\n구글의 영상 생성 서비스입니다. **무료로 연습하기 좋다**는 평입니다. 주소: https://flow.google.com/ (L3605)\n\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 9월 | 구글 계정마다 **매일 무료 50크레딧**, 저화질 영상 1개에 6~7크레딧 | L2554 |\n| 9월 | 무료 \"옴니 1.1\"도 쓸 만하고 립싱크가 괜찮음 | L2716-2721, L4485 |\n| 9월 | **유료여도 워터마크**가 있음. 상업적 사용은 가능하다는 답 | L3235-3244 |\n| 9월 | Flow 뮤직은 [[수노]]와 결이 다르고 악기 표현이 더 좋음 → [[음악-만들기]] | L2884-2890 |\n| 9월 | Ultra 전용 무크레딧 모델(Veo 3.1 lite)이 공지 없이 사라짐. 구글 클라우드에서 쓸 수 있고, 신규 가입 시 약 $300 크레딧 | L4302-4318 |\n\n## 워터마크 처리 (방 안 의견)\n- 화면을 확대해서 잘라내거나 채널 로고로 가립니다 (요약 문서 기준).\n\n관련: [[초보-시작-가이드]], [[크레딧-비용-절약]]\n","lines":["구글의 영상 생성 서비스입니다. 무료로 연습하기 좋다는 평입니다. 주소: https://flow.google.com/ (L3605)","대화 시점 · 내용 · 줄","--- · --- · ---","9월 · 구글 계정마다 매일 무료 50크레딧, 저화질 영상 1개에 6~7크레딧 · L2554","9월 · 무료 \"옴니 1.1\"도 쓸 만하고 립싱크가 괜찮음 · L2716-2721, L4485","9월 · 유료여도 워터마크가 있음. 상업적 사용은 가능하다는 답 · L3235-3244","9월 · Flow 뮤직은 수노와 결이 다르고 악기 표현이 더 좋음 → 음악-만들기 · L2884-2890","9월 · Ultra 전용 무크레딧 모델(Veo 3.1 lite)이 공지 없이 사라짐. 구글 클라우드에서 쓸 수 있고, 신규 가입 시 약 $300 크레딧 · L4302-4318","화면을 확대해서 잘라내거나 채널 로고로 가립니다 (요약 문서 기준).","관련: 초보-시작-가이드, 크레딧-비용-절약"]},"GPT-코덱스":{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","folder":"AI영상방","tags":"도구 LLM 이미지","text":"GPT · 코덱스 (ChatGPT, Codex)\n# GPT · 코덱스 (ChatGPT, Codex)\n\nOpenAI의 채팅 서비스(GPT)와 코딩 에이전트(Codex)입니다. 방에서는 **이미지 품질이 가장 좋다**는 평이 일관됩니다.\n\n## 잘하는 것\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | 이미지 품질은 지금 최고 | L502, L528, L1172 |\n| 11월 | 그리기와 그림 분석이 강함. 수정도 클로드보다 나음 | L5013, L5041 |\n| 11월 | 캐릭터 시트를 잘 만듦 → [[캐릭터-시트]] | L6264-6265 |\n| 11월 | GIF·프레임 애니메이션, 카톡 이모티콘 → [[실사-이미지-지침]] 아래 GIF 항목 | L5566-5610 |\n| 11월 | 움직임이 적은 영상은 어느 정도 고칠 수 있음 | L4979 |\n\n## 약한 것\n- 그림이 깨지는 경우가 많습니다. 손가락 같은 오류가 납니다 (L6264-6265).\n- 자막 작업 중 일부를 빠뜨립니다 (L6340).\n- \"고쳤다\"고 해 놓고 안 고친 경우가 있습니다 (L3765, L4482-4484).\n- Blender 3D 모델링을 시켰다가 사용량 70%를 쓰고 뭉개진 결과만 얻은 사례가 있습니다 (L3742-3777).\n\n## 요금·한도 (대화 시점 기준)\n| 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | Go 약 1.3만 원, Plus 약 2.9만 원. Plus는 3시간에 이미지 약 50장 | L1193-1198 |\n| 9월 | Pro는 x5($100, 약 15.9만 원)와 x20이 있음 | L3540-3553 |\n| 9월 | Plus의 5시간 한도가 몇 분 만에 소진된다는 보고 | L3519, L3524, L4472 |\n| 8월·11월 | **Codex와 일반 채팅은 한도가 따로**. 이미지 결과는 차이 없음 | L1149, L5082-5104 |\n| 11월 | GPT 요금제와 Codex 한도가 통합될까 우려 | L4994-5013 |\n\n- **모델 자동 교체 주의:** 5.6 Sol은 10/14에 중단되고 6으로 자동 전환된다는 말이 있었습니다. 쓸 때마다 모델을 확인하세요 (9월, L4116-4126).\n- **9월 사용량 리셋 소동:** [[사용량-관리]]에 있습니다.\n\n## 클로드와의 역할 분담\n- **이미지와 사용량은 GPT, 스토리와 코드는 [[클로드]]**라는 의견이 많습니다 (L5011-5044).\n- **초보에게는:** 이미지를 그릴 수 있고 사용량이 넉넉한 GPT를 권합니다 (L3808-3813).\n","lines":["OpenAI의 채팅 서비스(GPT)와 코딩 에이전트(Codex)입니다. 방에서는 이미지 품질이 가장 좋다는 평이 일관됩니다.","대화 시점 · 내용 · 줄","--- · --- · ---","8월 · 이미지 품질은 지금 최고 · L502, L528, L1172","11월 · 그리기와 그림 분석이 강함. 수정도 클로드보다 나음 · L5013, L5041","11월 · 캐릭터 시트를 잘 만듦 → 캐릭터-시트 · L6264-6265","11월 · GIF·프레임 애니메이션, 카톡 이모티콘 → 실사-이미지-지침 아래 GIF 항목 · L5566-5610","11월 · 움직임이 적은 영상은 어느 정도 고칠 수 있음 · L4979","그림이 깨지는 경우가 많습니다. 손가락 같은 오류가 납니다 (L6264-6265).","자막 작업 중 일부를 빠뜨립니다 (L6340).","\"고쳤다\"고 해 놓고 안 고친 경우가 있습니다 (L3765, L4482-4484).","Blender 3D 모델링을 시켰다가 사용량 70%를 쓰고 뭉개진 결과만 얻은 사례가 있습니다 (L3742-3777).","시점 · 내용 · 줄","--- · --- · ---","8월 · Go 약 1.3만 원, Plus 약 2.9만 원. Plus는 3시간에 이미지 약 50장 · L1193-1198","9월 · Pro는 x5($100, 약 15.9만 원)와 x20이 있음 · L3540-3553","9월 · Plus의 5시간 한도가 몇 분 만에 소진된다는 보고 · L3519, L3524, L4472","8월·11월 · Codex와 일반 채팅은 한도가 따로. 이미지 결과는 차이 없음 · L1149, L5082-5104","11월 · GPT 요금제와 Codex 한도가 통합될까 우려 · L4994-5013","모델 자동 교체 주의: 5.6 Sol은 10/14에 중단되고 6으로 자동 전환된다는 말이 있었습니다. 쓸 때마다 모델을 확인하세요 (9월, L4116-4126).","9월 사용량 리셋 소동: 사용량-관리에 있습니다.","이미지와 사용량은 GPT, 스토리와 코드는 클로드라는 의견이 많습니다 (L5011-5044).","초보에게는: 이미지를 그릴 수 있고 사용량이 넉넉한 GPT를 권합니다 (L3808-3813)."]},"Wan":{"name":"Wan","title":"Wan (완)","folder":"AI영상방","tags":"도구 영상모델","text":"Wan (완)\n# Wan (완)\n\n가성비가 좋은 영상 생성 모델입니다. 오픈 모델로 로컬에서도 돌아갑니다 → [[로컬-영상-생성]]\n\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | Wan 3.0은 [[시댄스]]보다 조금 부족하지만 가격 대비 쓸 만하고, **30초를 한 번에 생성**할 수 있음 | L1240 |\n| 8월 | motionmux.com에서 Wan 3.0 공모전용 모델을 제공. **해상도와 관계없이 초당 15크레딧**이라 1080p로 뽑는 게 이득. 승인까지 약 6시간 | L1247-1258 |\n| 9월 | Wan2GP(로컬 실행 도구)의 LTX2.5로 콘서트 영상을 만들었는데 뭉개짐이 있었음 | L4015-4018 |\n| 11월 | **애니메이션에 강함**. \"Wan 3.0 프라임\" 언급 | L5269-5270 |\n| 11월 | 시도했다가 실패한 사례 | L5342 |\n\n관련: [[영상-모델-비교]]\n","lines":["가성비가 좋은 영상 생성 모델입니다. 오픈 모델로 로컬에서도 돌아갑니다 → 로컬-영상-생성","대화 시점 · 내용 · 줄","--- · --- · ---","8월 · Wan 3.0은 시댄스보다 조금 부족하지만 가격 대비 쓸 만하고, 30초를 한 번에 생성할 수 있음 · L1240","8월 · motionmux.com에서 Wan 3.0 공모전용 모델을 제공. 해상도와 관계없이 초당 15크레딧이라 1080p로 뽑는 게 이득. 승인까지 약 6시간 · L1247-1258","9월 · Wan2GP(로컬 실행 도구)의 LTX2.5로 콘서트 영상을 만들었는데 뭉개짐이 있었음 · L4015-4018","11월 · 애니메이션에 강함. \"Wan 3.0 프라임\" 언급 · L5269-5270","11월 · 시도했다가 실패한 사례 · L5342","관련: 영상-모델-비교"]},"YuE2":{"name":"YuE2","title":"YuE2","folder":"AI영상방","tags":"도구 음악 오픈소스 로컬","text":"YuE2\n# YuE2\n\n[[수노]]의 대안으로 9월에 주목받은 **오픈소스 음악 생성 모델**입니다.\n\n## 평가 (9월)\n- 거의 수노급 음질이고, **편곡은 수노보다 낫다**는 평입니다 (Mr.HAN, L4331).\n- 참조곡 제한이 없고 커스텀할 수 있습니다. 다만 10곡쯤은 뽑아야 마음에 드는 게 나온다고 합니다 (두따, L4057-4060).\n- 커버곡도 만들 수 있습니다 (L4251-4254).\n- 특정 가사를 씹는(발음이 뭉개지는) 문제가 있습니다 (L4382).\n\n## 실행 방법\n| 방법 | 내용 | 줄 |\n|---|---|---|\n| Q8 모델 | 약 8GB VRAM에서 돌아감 | L4211 |\n| yue2-studio (Windows exe) | VRAM 24GB 이상이면 설정 없이 실행. 자막 플러그인, 보컬 캐릭터 고정 기능 | L4221-4227 |\n| Kaggle 노트북 | 사양이 낮을 때 | L4211, L4378 |\n\n- 기본 배포판은 UI 없이 터미널에 JSON을 넣는 방식입니다. WebUI 버전인지 확인하세요 (L4217).\n- 길이는 원곡보다 넉넉히 잡습니다 (L4390).\n\n## 상업 이용: 논란 있음\n- **판도라고:** 모델 가중치 라이선스가 **CC BY-NC 4.0(비상업)**이라고 지적했습니다 (L4359).\n- **Mr.HAN:** 9/16 개발팀 공지로 **사업자가 아닌 개인**은 상업적 이용이 허용됐다고 했습니다 (L4211, L4366).\n- **위키 판단:** 두 말이 다릅니다. 쓰기 전에 공식 저장소의 라이선스를 직접 확인하세요. → [[저작권과-라이선스]]\n\n관련: [[음악-만들기]], [[로컬-영상-생성]]\n","lines":["수노의 대안으로 9월에 주목받은 오픈소스 음악 생성 모델입니다.","거의 수노급 음질이고, 편곡은 수노보다 낫다는 평입니다 (Mr.HAN, L4331).","참조곡 제한이 없고 커스텀할 수 있습니다. 다만 10곡쯤은 뽑아야 마음에 드는 게 나온다고 합니다 (두따, L4057-4060).","커버곡도 만들 수 있습니다 (L4251-4254).","특정 가사를 씹는(발음이 뭉개지는) 문제가 있습니다 (L4382).","방법 · 내용 · 줄","--- · --- · ---","Q8 모델 · 약 8GB VRAM에서 돌아감 · L4211","yue2-studio (Windows exe) · VRAM 24GB 이상이면 설정 없이 실행. 자막 플러그인, 보컬 캐릭터 고정 기능 · L4221-4227","Kaggle 노트북 · 사양이 낮을 때 · L4211, L4378","기본 배포판은 UI 없이 터미널에 JSON을 넣는 방식입니다. WebUI 버전인지 확인하세요 (L4217).","길이는 원곡보다 넉넉히 잡습니다 (L4390).","판도라고: 모델 가중치 라이선스가 CC BY-NC 4.0(비상업)이라고 지적했습니다 (L4359).","Mr.HAN: 9/16 개발팀 공지로 사업자가 아닌 개인은 상업적 이용이 허용됐다고 했습니다 (L4211, L4366).","위키 판단: 두 말이 다릅니다. 쓰기 전에 공식 저장소의 라이선스를 직접 확인하세요. → 저작권과-라이선스","관련: 음악-만들기, 로컬-영상-생성"]},"그록":{"name":"그록","title":"그록 (Grok)","folder":"AI영상방","tags":"도구 영상모델","text":"그록 (Grok)\n# 그록 (Grok)\n\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | GPT 무료 한도를 다 쓰면 대신 씀 | L1202 |\n| 9월 | 영상은 잘 나오지만 **엉뚱한 동작이 많아 절반 이상을 잘라낸다** | L2236-2241 |\n\n관련: [[영상-모델-비교]]\n","lines":["대화 시점 · 내용 · 줄","--- · --- · ---","8월 · GPT 무료 한도를 다 쓰면 대신 씀 · L1202","9월 · 영상은 잘 나오지만 엉뚱한 동작이 많아 절반 이상을 잘라낸다 · L2236-2241","관련: 영상-모델-비교"]},"드리미나":{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","folder":"AI영상방","tags":"도구 플랫폼","text":"드리미나 (Dreamina) · 캡컷\n# 드리미나 (Dreamina) · 캡컷\n\n[[시댄스]]의 **공식 홈**입니다. 캡컷과 같은 회사 계열입니다.\n\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | 시댄스 2.5가 2.0보다 2배 넘게 비쌈 | L83 |\n| 8월 | 검열이 심해 저작권 캐릭터나 댄스는 막힘 | L170-178 |\n| 8월 | 주간 챌린지: 1분 이상 만들면 10,000크레딧 보상 | L177-181 |\n| 9월 | 연간 결제가 53만 원에서 58만 원으로 오르고 크레딧은 줄었다는 말. **남은 크레딧은 이월되지 않음** | L4188-4193 |\n| 11월 | 공식이라 싸지만 제약이 많음. 다른 곳의 시댄스와 특징이 다름 | L6159-6160 |\n| 11월 | 드래프트 모드도 1080p로 나옴. 태그 방식이 불편함 | L6168, L6192 |\n| 11월 | 15초에 550크레딧. 캡컷 기본 구독은 월 700포인트라 **약 12초 분량밖에 못 만듦** | L6199-6202 |\n| 11월 | 서버가 느려 생성에 하루 종일 걸렸다는 보고 | L6197 |\n| 11월 | \"스토리 스튜디오\"로 대본과 에셋 이미지를 만드는 파이프라인 → [[로컬-영상-생성]] | L6191-6194 |\n\n관련: [[영상-모델-비교]], [[편집-툴]]\n","lines":["시댄스의 공식 홈입니다. 캡컷과 같은 회사 계열입니다.","대화 시점 · 내용 · 줄","--- · --- · ---","8월 · 시댄스 2.5가 2.0보다 2배 넘게 비쌈 · L83","8월 · 검열이 심해 저작권 캐릭터나 댄스는 막힘 · L170-178","8월 · 주간 챌린지: 1분 이상 만들면 10,000크레딧 보상 · L177-181","9월 · 연간 결제가 53만 원에서 58만 원으로 오르고 크레딧은 줄었다는 말. 남은 크레딧은 이월되지 않음 · L4188-4193","11월 · 공식이라 싸지만 제약이 많음. 다른 곳의 시댄스와 특징이 다름 · L6159-6160","11월 · 드래프트 모드도 1080p로 나옴. 태그 방식이 불편함 · L6168, L6192","11월 · 15초에 550크레딧. 캡컷 기본 구독은 월 700포인트라 약 12초 분량밖에 못 만듦 · L6199-6202","11월 · 서버가 느려 생성에 하루 종일 걸렸다는 보고 · L6197","11월 · \"스토리 스튜디오\"로 대본과 에셋 이미지를 만드는 파이프라인 → 로컬-영상-생성 · L6191-6194","관련: 영상-모델-비교, 편집-툴"]},"런웨이":{"name":"런웨이","title":"런웨이 (Runway)","folder":"AI영상방","tags":"도구 플랫폼","text":"런웨이 (Runway)\n# 런웨이 (Runway)\n\n8월 말에 **무제한 요금제가 곧 끝난다**는 이야기가 오갔습니다 (L30, L48, L75).\n\n## 무제한일 때 두 개 동시 생성 요령 (ai공부중1, 8월)\n1. [[시댄스]] 2.5를 먼저 대기열에 겁니다.\n2. 바로 2.0으로 바꿔 하나 더 겁니다. 그러면 두 개가 동시에 돌아갑니다.\n- **순서가 반대면** 2.5를 걸 수 없습니다.\n- 프롬프트가 3,500자 이하일 때 됩니다.\n- 근거: L52-53, L61\n\n## 평가\n- 크레딧제로 돌리면 2.5는 너무 비쌉니다 (L80-81).\n- 런웨이 안의 [[미니맥스-H3|미니맥스]]는 결과가 처참했다는 평입니다 (L107).\n","lines":["8월 말에 무제한 요금제가 곧 끝난다는 이야기가 오갔습니다 (L30, L48, L75).","시댄스 2.5를 먼저 대기열에 겁니다.","바로 2.0으로 바꿔 하나 더 겁니다. 그러면 두 개가 동시에 돌아갑니다.","순서가 반대면 2.5를 걸 수 없습니다.","프롬프트가 3,500자 이하일 때 됩니다.","근거: L52-53, L61","크레딧제로 돌리면 2.5는 너무 비쌉니다 (L80-81).","런웨이 안의 미니맥스는 결과가 처참했다는 평입니다 (L107)."]},"뮤즈-AI":{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","folder":"AI영상방","tags":"도구 이미지 영상모델 무료","text":"뮤즈 AI (Meta Muse)\n# 뮤즈 AI (Meta Muse)\n\n메타의 이미지·영상 생성 서비스입니다. **무료**라서 9월부터 화제가 됐습니다 (L3009-3041, L4576-4607).\n\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 9월 | Muse Spark 1.3은 OpenCode에서 무료로 쓸 수 있지만 데이터를 수집하므로 **개인정보를 넣지 말 것** | L3525-3527 |\n| 11월 | 무료이지만 프롬프트 가이드와 모델 사양 정보가 없어 세밀하게 제어하기 어려움 | L5100-5101 |\n| 11월 | 4K를 지원하고 미드저니 같은 색감 | L6263-6273 |\n| 11월 | 좋은 시트 예시를 몇 개 먼저 주면 그 방식을 학습함 → [[캐릭터-시트]] | L6269 |\n| 11월 | **영상은 디지털 느낌이 강하고 통제가 어려움.** 눈 색이 바뀌는 등 | L6283-6290 |\n| 11월 | 지역 제한으로 영상 기능을 못 쓰는 사람이 있음 | L6277-6280 |\n\n- **쓰임새:** Mr.HAN의 파이프라인에서 프롬프트를 [[미니맥스-H3|미니맥스]]용으로 바꾸는 데 씁니다 (L6193).\n- **배경 이미지:** [[미드저니]]와 함께 배경용으로 추천됩니다 (L6246-6248).\n","lines":["메타의 이미지·영상 생성 서비스입니다. 무료라서 9월부터 화제가 됐습니다 (L3009-3041, L4576-4607).","대화 시점 · 내용 · 줄","--- · --- · ---","9월 · Muse Spark 1.3은 OpenCode에서 무료로 쓸 수 있지만 데이터를 수집하므로 개인정보를 넣지 말 것 · L3525-3527","11월 · 무료이지만 프롬프트 가이드와 모델 사양 정보가 없어 세밀하게 제어하기 어려움 · L5100-5101","11월 · 4K를 지원하고 미드저니 같은 색감 · L6263-6273","11월 · 좋은 시트 예시를 몇 개 먼저 주면 그 방식을 학습함 → 캐릭터-시트 · L6269","11월 · 영상은 디지털 느낌이 강하고 통제가 어려움. 눈 색이 바뀌는 등 · L6283-6290","11월 · 지역 제한으로 영상 기능을 못 쓰는 사람이 있음 · L6277-6280","쓰임새: Mr.HAN의 파이프라인에서 프롬프트를 미니맥스용으로 바꾸는 데 씁니다 (L6193).","배경 이미지: 미드저니와 함께 배경용으로 추천됩니다 (L6246-6248)."]},"미니맥스-H3":{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","folder":"AI영상방","tags":"도구 영상모델 로컬","text":"미니맥스 H3 (MiniMax H3)\n# 미니맥스 H3 (MiniMax H3)\n\n**가장 싸고**, 내 PC에서도 돌릴 수 있는 영상 모델입니다. 뮤직비디오와 세로 숏폼에 많이 씁니다.\n\n## 방 안 평가\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | 빠른 동작에 약하고 번짐이 있음 | L119-128 |\n| 8월 | 2D와 디자인 쪽에 강함 | L415-417 |\n| 8월 | 공식 프롬프트 가이드가 있으니 LLM에게 **먼저 학습시킨 뒤** 프롬프트를 물어볼 것 | L103-105 |\n| 8월 | [[런웨이]] 안에서 쓴 미니맥스는 결과가 처참했다는 평 | L107 |\n| 9월 | H3 Turbo는 크레딧이 매우 싸고 30초 안에 생성 | L2777, L2897 |\n| 9월 | 특유의 지글거림, 액션·멀티 레퍼런스에 약함. 이미지→프레임 방식은 괜찮음 | L2796-2805 |\n| 9월 | [[드리미나]]에도 들어옴 | L3216-3217 |\n| 11월 | **H3가 표준 모델이고 가장 쌈.** Max는 속도만 빠름 | L5278-5281 |\n| 11월 | 뮤비에 좋음. Blender 프리비즈를 넣어 카메라 무빙을 줄 수 있음 | L5274, L5096 |\n| 11월 | MV 한 편에 RunningHub 약 8천 코인 (재생성 포함) | L5840 |\n\n## 약점\n- 액션 장면\n- 한글 글자 출력 (복불복, L26-38)\n- 작은 얼굴은 뭉개짐 → [[로컬-영상-생성]]의 FaceDetailer\n\n## 로컬 실행\n- 가속 LoRA(MiniMax-H3-Acc-LoRAs)를 쓰면 8GB VRAM에서도 돌아갑니다 (L1347-1348).\n- 저해상도로 생성한 뒤 업스케일하는 워크플로가 있습니다.\n- 자세한 내용은 [[로컬-영상-생성]]에 있습니다.\n\n관련: [[영상-모델-비교]]\n","lines":["가장 싸고, 내 PC에서도 돌릴 수 있는 영상 모델입니다. 뮤직비디오와 세로 숏폼에 많이 씁니다.","대화 시점 · 내용 · 줄","--- · --- · ---","8월 · 빠른 동작에 약하고 번짐이 있음 · L119-128","8월 · 2D와 디자인 쪽에 강함 · L415-417","8월 · 공식 프롬프트 가이드가 있으니 LLM에게 먼저 학습시킨 뒤 프롬프트를 물어볼 것 · L103-105","8월 · 런웨이 안에서 쓴 미니맥스는 결과가 처참했다는 평 · L107","9월 · H3 Turbo는 크레딧이 매우 싸고 30초 안에 생성 · L2777, L2897","9월 · 특유의 지글거림, 액션·멀티 레퍼런스에 약함. 이미지→프레임 방식은 괜찮음 · L2796-2805","9월 · 드리미나에도 들어옴 · L3216-3217","11월 · H3가 표준 모델이고 가장 쌈. Max는 속도만 빠름 · L5278-5281","11월 · 뮤비에 좋음. Blender 프리비즈를 넣어 카메라 무빙을 줄 수 있음 · L5274, L5096","11월 · MV 한 편에 RunningHub 약 8천 코인 (재생성 포함) · L5840","액션 장면","한글 글자 출력 (복불복, L26-38)","작은 얼굴은 뭉개짐 → 로컬-영상-생성의 FaceDetailer","가속 LoRA(MiniMax-H3-Acc-LoRAs)를 쓰면 8GB VRAM에서도 돌아갑니다 (L1347-1348).","저해상도로 생성한 뒤 업스케일하는 워크플로가 있습니다.","자세한 내용은 로컬-영상-생성에 있습니다.","관련: 영상-모델-비교"]},"미드저니":{"name":"미드저니","title":"미드저니 (Midjourney)","folder":"AI영상방","tags":"도구 이미지","text":"미드저니 (Midjourney)\n# 미드저니 (Midjourney)\n\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 9월 | 프롬프트를 1000자까지 쓰는 사례. 길이는 각자 정하면 된다는 답 | L4289-4291 |\n| 11월 | **색감이 좋음.** 하지만 캐릭터 시트는 잘 못 만듦 | L6236-6237, L6266, L6273 |\n| 11월 | 배경은 미드저니나 [[뮤즈-AI\\|뮤즈]], 세부 수정은 [[GPT-코덱스\\|GPT]]로 | L6246-6248 |\n\n관련: [[캐릭터-시트]]\n","lines":["대화 시점 · 내용 · 줄","--- · --- · ---","9월 · 프롬프트를 1000자까지 쓰는 사례. 길이는 각자 정하면 된다는 답 · L4289-4291","11월 · 색감이 좋음. 하지만 캐릭터 시트는 잘 못 만듦 · L6236-6237, L6266, L6273","11월 · 배경은 미드저니나 뮤즈, 세부 수정은 GPT로 · L6246-6248","관련: 캐릭터-시트"]},"수노":{"name":"수노","title":"수노 (Suno)","folder":"AI영상방","tags":"도구 음악","text":"수노 (Suno)\n# 수노 (Suno)\n\nAI 음악 생성 서비스입니다.\n\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 9월 | **다운로드 제한**이 걸림. 프리미어 요금제는 무제한이라는 말 | L2952-2956, L4062 |\n| 9월 | Studio에서 export가 불안정함 | L2502 |\n| 9월 | 공유 링크로 들려주는 것은 가능 | L2964 |\n| 9월 | 저작권 필터가 과하다는 불만 | L4260 |\n| 11월 | **클로드에 수노 MCP를 연결**해 곡을 만들면 편함. 너무 길면 짧게 다시 만들게 함 | L4709-4734 |\n\n## 요령\n- **원하는 분위기 따라 하기:** 참고곡을 LLM에 주고 수노용 스타일 프롬프트와 가사를 추천받습니다 (로킹, L2271-2273).\n- **유튜브 유입:** 오리지널만 올리면 잘 안 봅니다. 커버곡을 가끔 섞으면 도움이 됩니다 (L5943-5949).\n\n## 대안\n- [[YuE2]]: 오픈소스\n- [[Flow]] 뮤직\n- 자세한 내용은 [[음악-만들기]]에 있습니다.\n","lines":["AI 음악 생성 서비스입니다.","대화 시점 · 내용 · 줄","--- · --- · ---","9월 · 다운로드 제한이 걸림. 프리미어 요금제는 무제한이라는 말 · L2952-2956, L4062","9월 · Studio에서 export가 불안정함 · L2502","9월 · 공유 링크로 들려주는 것은 가능 · L2964","9월 · 저작권 필터가 과하다는 불만 · L4260","11월 · 클로드에 수노 MCP를 연결해 곡을 만들면 편함. 너무 길면 짧게 다시 만들게 함 · L4709-4734","원하는 분위기 따라 하기: 참고곡을 LLM에 주고 수노용 스타일 프롬프트와 가사를 추천받습니다 (로킹, L2271-2273).","유튜브 유입: 오리지널만 올리면 잘 안 봅니다. 커버곡을 가끔 섞으면 도움이 됩니다 (L5943-5949).","YuE2: 오픈소스","Flow 뮤직","자세한 내용은 음악-만들기에 있습니다."]},"시댄스":{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방","tags":"도구 영상모델","text":"시댄스 (Seedance)\n# 시댄스 (Seedance)\n\n방에서 **품질과 액션 표현이 가장 좋다**고 꼽히는 영상 생성 모델입니다. 버전은 2.0, 2.0 mini, 2.0 Fast, 2.5가 있습니다.\n- **공식 홈:** [[드리미나]]\n- **다른 곳에서 쓰기:** [[힉스필드]], [[런웨이]] 등\n\n## 방 안 평가\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | 2.5가 더 부드럽고 사실적 | L299 |\n| 8월 | **2D 애니는 2.0이 더 깔끔**. 각각 3번씩 뽑아 3번 다 2.0 선택. 애니엔 2.0 mini도 괜찮음 | L317-326 |\n| 8월 | 2.5는 영상 속 특정 부분 수정에 쓸 수 있다는 말 (전해 들은 정보) | L1263 |\n| 9월 | 저작권 필터가 엄격해서 외주 작업을 미니맥스로 대체 | L2789-2793 |\n| 9월 | 2.5는 \"BGM 금지\"라고 적어도 음악이 섞여 나옴 | L4446-4447 |\n| 11월 | 대사에 한계가 있음 → [[대사와-목소리]] | L5145 |\n| 11월 | 액션은 최강이지만 캐릭터 일관성은 약하고, 매우 비쌈 | L5499-5501 |\n| 11월 | 사고(이상한 결과)가 가장 적음 | L5355 |\n| 11월 | 실사는 2.5, 애니는 2.0. 둘의 색감이 다름 | L6246, L6261 |\n\n## 비용 (대화 시점 기준)\n- 15초 생성: 2.5가 18크레딧. [[탑뷰-T1]]은 15크레딧입니다 (11월, L5284).\n- 시댄스만으로 약 3분 분량을 만드는 데 약 9만~10만 원이 들었습니다 (11월, L5492-5493).\n- 2.5는 2.0보다 2배 넘게 비쌉니다 ([[드리미나]] 기준, 8월, L83).\n\n## 쓰는 요령\n- 비싸므로 **화려한 액션 컷에만** 씁니다 → [[크레딧-비용-절약]]\n- 대사 발음은 소리 나는 대로 적습니다 → [[대사와-목소리]]\n\n관련: [[영상-모델-비교]]\n","lines":["방에서 품질과 액션 표현이 가장 좋다고 꼽히는 영상 생성 모델입니다. 버전은 2.0, 2.0 mini, 2.0 Fast, 2.5가 있습니다.","공식 홈: 드리미나","다른 곳에서 쓰기: 힉스필드, 런웨이 등","대화 시점 · 내용 · 줄","--- · --- · ---","8월 · 2.5가 더 부드럽고 사실적 · L299","8월 · 2D 애니는 2.0이 더 깔끔. 각각 3번씩 뽑아 3번 다 2.0 선택. 애니엔 2.0 mini도 괜찮음 · L317-326","8월 · 2.5는 영상 속 특정 부분 수정에 쓸 수 있다는 말 (전해 들은 정보) · L1263","9월 · 저작권 필터가 엄격해서 외주 작업을 미니맥스로 대체 · L2789-2793","9월 · 2.5는 \"BGM 금지\"라고 적어도 음악이 섞여 나옴 · L4446-4447","11월 · 대사에 한계가 있음 → 대사와-목소리 · L5145","11월 · 액션은 최강이지만 캐릭터 일관성은 약하고, 매우 비쌈 · L5499-5501","11월 · 사고(이상한 결과)가 가장 적음 · L5355","11월 · 실사는 2.5, 애니는 2.0. 둘의 색감이 다름 · L6246, L6261","15초 생성: 2.5가 18크레딧. 탑뷰-T1은 15크레딧입니다 (11월, L5284).","시댄스만으로 약 3분 분량을 만드는 데 약 9만~10만 원이 들었습니다 (11월, L5492-5493).","2.5는 2.0보다 2배 넘게 비쌉니다 (드리미나 기준, 8월, L83).","비싸므로 화려한 액션 컷에만 씁니다 → 크레딧-비용-절약","대사 발음은 소리 나는 대로 적습니다 → 대사와-목소리","관련: 영상-모델-비교"]},"클로드":{"name":"클로드","title":"클로드 (Claude)","folder":"AI영상방","tags":"도구 LLM","text":"클로드 (Claude)\n# 클로드 (Claude)\n\nAnthropic의 LLM입니다. 방에서는 **스토리·대본·코드·프리비즈에 강하다**는 평입니다.\n\n## 방 안 평가\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | 스토리 구성과 코드 품질이 좋지만 안전한 쪽을 골라 밋밋할 때가 있음 | L517-519 |\n| 8월 | 이미지는 만들지 못함 | L500 |\n| 8월 | 사용량이 5시간마다 초기화되고 Pro는 한도가 작음 | L534-535 |\n| 9월 | 블로그 자동 발행 프로그램 같은 개발에는 Claude Code 추천 | L4002, L4013 |\n| 9월 | 9/23 GPT와 함께 \"초기화권\" 지급 → [[사용량-관리]] | L4295-4300 |\n| 11월 | 편집 스킬, 대본 정리, 프리비즈를 잘 만듦. 이미지 해석은 엉뚱할 때가 있음 | L4956-4961, L5012-5015, L5043 |\n| 11월 | Opus는 사용량이 빨리 닳는다는 체감 | L5126-5131 |\n| 11월 | PC에 켜 두고 휴대폰으로 지시하면 MCP로 그림·음악·영상까지 처리 | L6254-6259 |\n\n## 모델 소식\n- **9/21:** 방장이 Opus 5.5 출시설을 전했습니다. 가격은 루머라고 밝혔습니다 (L2247-2260).\n- **9/23:** 방장이 \"Opus 5.5 vs 아스트라\" 비교 영상을 올렸습니다 (L4648-4653). → [[쓸만한-링크]]\n\n## 활용\n- MCP 연결과 토큰 절약 요령은 [[클로드-MCP-활용]]에 있습니다.\n- [[GPT-코덱스]]와의 역할 분담도 참고하세요.\n","lines":["Anthropic의 LLM입니다. 방에서는 스토리·대본·코드·프리비즈에 강하다는 평입니다.","대화 시점 · 내용 · 줄","--- · --- · ---","8월 · 스토리 구성과 코드 품질이 좋지만 안전한 쪽을 골라 밋밋할 때가 있음 · L517-519","8월 · 이미지는 만들지 못함 · L500","8월 · 사용량이 5시간마다 초기화되고 Pro는 한도가 작음 · L534-535","9월 · 블로그 자동 발행 프로그램 같은 개발에는 Claude Code 추천 · L4002, L4013","9월 · 9/23 GPT와 함께 \"초기화권\" 지급 → 사용량-관리 · L4295-4300","11월 · 편집 스킬, 대본 정리, 프리비즈를 잘 만듦. 이미지 해석은 엉뚱할 때가 있음 · L4956-4961, L5012-5015, L5043","11월 · Opus는 사용량이 빨리 닳는다는 체감 · L5126-5131","11월 · PC에 켜 두고 휴대폰으로 지시하면 MCP로 그림·음악·영상까지 처리 · L6254-6259","9/21: 방장이 Opus 5.5 출시설을 전했습니다. 가격은 루머라고 밝혔습니다 (L2247-2260).","9/23: 방장이 \"Opus 5.5 vs 아스트라\" 비교 영상을 올렸습니다 (L4648-4653). → 쓸만한-링크","MCP 연결과 토큰 절약 요령은 클로드-MCP-활용에 있습니다.","GPT-코덱스와의 역할 분담도 참고하세요."]},"클링":{"name":"클링","title":"클링 (Kling)","folder":"AI영상방","tags":"도구 영상모델","text":"클링 (Kling)\n# 클링 (Kling)\n\n영상 생성 모델이자 같은 이름의 단일 툴입니다.\n\n| 대화 시점 | 평가 | 줄 |\n|---|---|---|\n| 11월 | **실사는 클링이 낫다** | L5270 |\n| 11월 | 액션은 약하지만 캐릭터 일관성이 좋다 | L5501 |\n\n- 질문에 \"Kling 4.0\"이라는 표현이 나옵니다 (L5267). 실제 버전은 확인되지 않았습니다.\n- 플랫폼을 고를 때 \"클링 = 단일 툴, [[힉스필드]] = 여러 모델 모음\"으로 비교됩니다.\n\n관련: [[영상-모델-비교]]\n","lines":["영상 생성 모델이자 같은 이름의 단일 툴입니다.","대화 시점 · 평가 · 줄","--- · --- · ---","11월 · 실사는 클링이 낫다 · L5270","11월 · 액션은 약하지만 캐릭터 일관성이 좋다 · L5501","질문에 \"Kling 4.0\"이라는 표현이 나옵니다 (L5267). 실제 버전은 확인되지 않았습니다.","플랫폼을 고를 때 \"클링 = 단일 툴, 힉스필드 = 여러 모델 모음\"으로 비교됩니다.","관련: 영상-모델-비교"]},"탑뷰-T1":{"name":"탑뷰-T1","title":"탑뷰 T1 (Topview T1)","folder":"AI영상방","tags":"도구 영상모델","text":"탑뷰 T1 (Topview T1)\n# 탑뷰 T1 (Topview T1)\n\nTopview에서만 쓸 수 있는 영상 모델입니다.\n\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 11월 | 방장: \"탑뷰 T1 좋습니다.\" [[시댄스]] 2.5를 증류한 것 같고 품질이 거의 비슷함 | L5272-5282 |\n| 11월 | 15초에 T1은 15크레딧, 시댄스 2.5는 18크레딧. **차이가 작아 그냥 2.5를 쓴다**는 의견 | L5284 |\n| 11월 | 플랜에 따라 가격이 다르게 보였다는 말 | L5293-5300 |\n\n관련: [[영상-모델-비교]]\n","lines":["Topview에서만 쓸 수 있는 영상 모델입니다.","대화 시점 · 내용 · 줄","--- · --- · ---","11월 · 방장: \"탑뷰 T1 좋습니다.\" 시댄스 2.5를 증류한 것 같고 품질이 거의 비슷함 · L5272-5282","11월 · 15초에 T1은 15크레딧, 시댄스 2.5는 18크레딧. 차이가 작아 그냥 2.5를 쓴다는 의견 · L5284","11월 · 플랜에 따라 가격이 다르게 보였다는 말 · L5293-5300","관련: 영상-모델-비교"]},"편집-툴":{"name":"편집-툴","title":"편집 툴","folder":"AI영상방","tags":"도구 편집","text":"편집 툴\n# 편집 툴\n\n11/4에 자막 가독성 이야기에서 시작해 편집 툴을 비교했습니다 (L4779-4972).\n\n| 툴 | 평가 | 줄 |\n|---|---|---|\n| **캡컷 (CapCut)** | 가장 무난하고 쓰기 쉬움. 입문용 추천 | L3601, L4902, L4950 |\n| 프리미어 (Premiere) | 유료 로컬 앱 | L4802-4805 |\n| 파워디렉터 | 무겁고, 5분 넘게 편집하면 블루스크린이 잦음 | L4926-4928 |\n| 다빈치 리졸브 | MCP를 붙일 수 있다는 소식 (불확실). 시댄스 2.0과 2.5의 색감을 맞출 때 쓴다는 말 | L4941, L6248 |\n| 쌤컷 | 캡컷보다 간단한 무료 컷 편집기. https://ssamtool.com/tool/cut/ | L4952 |\n| 아트크래프트 | 오픈소스 로컬 편집 툴, 완성도는 아직 부족. https://getartcraft.com/ | L4815-4833 |\n| 클로드·GPT | 편집 스킬을 만들어 맡기는 방식 → [[클로드]] | L4956-4961 |\n\n## 꼭 알아 둘 요령: 캡컷 울렁임\n- AI 영상은 보통 **24fps**인데 캡컷 기본 내보내기는 30fps입니다.\n- **24fps로 맞춰 내보내면** 울렁임이 사라집니다 (카이로스, 8월, L302-306).\n","lines":["11/4에 자막 가독성 이야기에서 시작해 편집 툴을 비교했습니다 (L4779-4972).","툴 · 평가 · 줄","--- · --- · ---","캡컷 (CapCut) · 가장 무난하고 쓰기 쉬움. 입문용 추천 · L3601, L4902, L4950","프리미어 (Premiere) · 유료 로컬 앱 · L4802-4805","파워디렉터 · 무겁고, 5분 넘게 편집하면 블루스크린이 잦음 · L4926-4928","다빈치 리졸브 · MCP를 붙일 수 있다는 소식 (불확실). 시댄스 2.0과 2.5의 색감을 맞출 때 쓴다는 말 · L4941, L6248","쌤컷 · 캡컷보다 간단한 무료 컷 편집기. https://ssamtool.com/tool/cut/ · L4952","아트크래프트 · 오픈소스 로컬 편집 툴, 완성도는 아직 부족. https://getartcraft.com/ · L4815-4833","클로드·GPT · 편집 스킬을 만들어 맡기는 방식 → 클로드 · L4956-4961","AI 영상은 보통 24fps인데 캡컷 기본 내보내기는 30fps입니다.","24fps로 맞춰 내보내면 울렁임이 사라집니다 (카이로스, 8월, L302-306)."]},"힉스필드":{"name":"힉스필드","title":"힉스필드 (Higgsfield)","folder":"AI영상방","tags":"도구 플랫폼","text":"힉스필드 (Higgsfield)\n# 힉스필드 (Higgsfield)\n\n여러 영상·이미지 모델을 한곳에 모은 **\"스튜디오\"형 플랫폼**입니다.\n\n## 방 안 평가\n| 대화 시점 | 내용 | 줄 |\n|---|---|---|\n| 8월 | 무제한 요금제여도 동시 대기는 6개가 한계. 6개를 다 걸면 무료 생성은 안 되고 크레딧으로만 됨 | L442-451, L485-496 |\n| 8월 | 에이전트 기능(Opus), 작가도우미는 크레딧을 많이 씀 | L454, L465-469 |\n| 8월 | 클로드와 MCP로 연결할 수 있음 → [[클로드-MCP-활용]] | L523-524 |\n| 9월 | Genjutsu: 참고 영상의 춤을 따라 하는 기능 | L2414-2416 |\n| 9월 | 크레딧으로 쓰면 매우 비쌈. 무제한 요금제는 MCP 연결에 적용되지 않음 | L3132, L4280 |\n| 9월 | Enterprise는 입력을 학습에 쓰지 않지만 매우 비쌈 | L4186 |\n| 11월 | **MCP 연결 자체는 무료**, 생성에는 크레딧이 듦 | L5057-5059 |\n| 11월 | 애니메이션 플랫폼으로 추천됨. [[드리미나]]는 시댄스만 있고 힉스필드에는 다 있음 | L5444-5445 |\n| 11월 | 작년엔 80%까지 할인했고 올해는 할인이 적다. 블랙프라이데이 할인을 기다리는 분위기 | L5888-5892 |\n\n## 주의: 피싱 의심 메일\n- 홈페이지에 없는 'Pro 요금제'를 안내하는 메일이 왔다는 보고가 있습니다 (11월, L5978-5981).\n- 방 안 결론은 사기로 의심된다는 것이었습니다.\n\n## 비교\n- Zcre는 1만 원에 1천 크레딧입니다 (L5115).\n- 같은 돈이면 Zcre가 약 30초 더 만든다는 계산이 나왔지만, GPT가 계산한 것이고 검증되지 않았습니다 (L5348).\n\n관련: [[크레딧-비용-절약]], [[영상-모델-비교]]\n","lines":["여러 영상·이미지 모델을 한곳에 모은 \"스튜디오\"형 플랫폼입니다.","대화 시점 · 내용 · 줄","--- · --- · ---","8월 · 무제한 요금제여도 동시 대기는 6개가 한계. 6개를 다 걸면 무료 생성은 안 되고 크레딧으로만 됨 · L442-451, L485-496","8월 · 에이전트 기능(Opus), 작가도우미는 크레딧을 많이 씀 · L454, L465-469","8월 · 클로드와 MCP로 연결할 수 있음 → 클로드-MCP-활용 · L523-524","9월 · Genjutsu: 참고 영상의 춤을 따라 하는 기능 · L2414-2416","9월 · 크레딧으로 쓰면 매우 비쌈. 무제한 요금제는 MCP 연결에 적용되지 않음 · L3132, L4280","9월 · Enterprise는 입력을 학습에 쓰지 않지만 매우 비쌈 · L4186","11월 · MCP 연결 자체는 무료, 생성에는 크레딧이 듦 · L5057-5059","11월 · 애니메이션 플랫폼으로 추천됨. 드리미나는 시댄스만 있고 힉스필드에는 다 있음 · L5444-5445","11월 · 작년엔 80%까지 할인했고 올해는 할인이 적다. 블랙프라이데이 할인을 기다리는 분위기 · L5888-5892","홈페이지에 없는 'Pro 요금제'를 안내하는 메일이 왔다는 보고가 있습니다 (11월, L5978-5981).","방 안 결론은 사기로 의심된다는 것이었습니다.","Zcre는 1만 원에 1천 크레딧입니다 (L5115).","같은 돈이면 Zcre가 약 30초 더 만든다는 계산이 나왔지만 // ── 왼쪽 목록 ──
async function loadTree() {
  tree = await api("/api/tree");
  $("kbPath").textContent = D ? `${tree.count}쪽 · 공유본 ${D.built}${D.hasRaw ? " · 원문 포함" : ""}` : `${tree.count}쪽`;
  $("kbPath").title = D ? "이 파일 하나에 위키가 모두 들어 있습니다. 인터넷 없이도 열립니다." : tree.kb;
  drawTree();
}
function drawTree() {
  const f = $("filter").value.trim().toLowerCase();
  const box = $("tree"); box.replaceChildren();
  for (const folder of tree.folders) {
    const pages = folder.pages.filter(p => !f || p.title.toLowerCase().includes(f) || p.name.toLowerCase().includes(f));
    if (!pages.length && f) continue;
    const d = el("details", "folder"); d.open = true;
    const sum = el("summary"); const dot = el("span", "dot"); dot.style.background = COLOR(folder.label);
    sum.append(dot, el("span", null, folder.label), el("span", "cnt", `${folder.pages.length}`));
    if (folder.file) sum.title = folder.file;
    d.append(sum);
    for (const [key, label] of SECTIONS) {
      const list = pages.filter(p => p.section === key);
      if (!list.length) continue;
      if (folder.id) d.append(el("div", "sec-label", label));
      for (const p of list) {
        const a = el("a", "pg" + (current === p.name ? " on" : ""), p.title.replace(/^(질문|자료 요약):\s*/, ""));
        a.href = "#/page/" + enc(p.name); a.title = p.title; a.dataset.name = p.name;
        d.append(a);
      }
    }
    if (folder.raw?.length && !f) {
      d.append(el("div", "sec-label", "원문"));
      for (const r of folder.raw) { const a = el("a", "rawlink", "📄 " + r); a.href = `#/raw/${enc(folder.id)}?file=${enc(r)}`; d.append(a); }
    }
    box.append(d);
  }
}

let rawCache = {};
async function showRaw(folder, params) {
  current = null; markTree();
  const main = $("main"); main.replaceChildren(el("p", "empty", "원문 불러오는 중…"));
  const fileQ = params.get("file") ? "&file=" + enc(params.get("file")) : "";
  const key = folder + fileQ;
  let r;
  try { r = rawCache[key] ||= await api(`/api/raw?folder=${enc(folder)}${fileQ}`); }
  catch (e) { main.replaceChildren(wrapMsg(e.message)); return; }
  document.title = `${r.folderLabel} 원문 · KB 뷰어`;
  const view = el("div", "rawview");
  const bar = el("div", "rawbar");
  bar.append(el("h2", null, `📄 ${r.folderLabel} 원문`));
  const sel = el("select"); for (const f of r.files) { const o = el("option", null, f); o.value = f; o.selected = f === r.file; sel.append(o); }
  sel.addEventListener("change", () => location.hash = `#/raw/${enc(folder)}?file=${enc(sel.value)}`);
  const go = el("input"); go.placeholder = "줄 (예: 5145 또는 5145-5149)"; go.size = 22;
  const find = el("input"); find.placeholder = "원문에서 찾기 (Enter: 다음)"; find.size = 22;
  const info = el("span", "hint", `${r.lines.length.toLocaleString()}줄`);
  bar.append(sel, go, find, info);
  const box = el("div", "lines");
  const frag = document.createDocumentFragment();
  r.lines.forEach((t, i) => {
    const d = el("div", "ln" + (/^-{5,} \d{4}년/.test(t) ? " date" : "")); d.id = "L" + (i + 1);
    d.append(el("b", null, i + 1), el("span", null, t || " "));
    frag.append(d);
  });
  box.append(frag); view.append(bar, box); main.replaceChildren(view);
  const highlight = (a, b) => {
    box.querySelectorAll(".ln.on").forEach(x => x.classList.remove("on"));
    for (let n = a; n <= b && n <= r.lines.length; n++) $("L" + n)?.classList.add("on");
    // 고정된 위쪽 막대 아래로 첫 줄이 보이게 스크롤 (main 이 스크롤되든 문서 전체가 스크롤되든)
    const target = $("L" + Math.min(a, r.lines.length));
    if (target) requestAnimationFrame(() => {
      const gap = () => target.getBoundingClientRect().top - bar.getBoundingClientRect().bottom - 60;
      main.scrollTop += gap();
      if (Math.abs(gap()) > 4) window.scrollBy(0, gap());
    });
    info.textContent = `${r.lines.length.toLocaleString()}줄 · ${a === b ? a + "줄" : a + "~" + b + "줄"} 표시`;
  };
  const range = params.get("l");
  if (range) { const [a, b] = range.split("-").map(Number); setTimeout(() => highlight(a, b || a), 0); }
  go.addEventListener("keydown", e => { if (e.key !== "Enter") return; const [a, b] = go.value.split(/[-~]/).map(s => parseInt(s, 10)); if (a) highlight(a, b || a); });
  let lastFind = 0;
  find.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const q = find.value.trim().toLowerCase(); if (!q) return;
    for (let k = 1; k <= r.lines.length; k++) {
      const n = ((lastFind + k - 1) % r.lines.length) + 1;
      if (r.lines[n - 1].toLowerCase().includes(q)) { lastFind = n; highlight(n, n); return; }
    }
    info.textContent = "찾는 말이 없어요";
  });
}

let graphStop = null;
async function showGraph() {
  current = null; markTree();
  const main = $("main"); const wrap = el("div", "graphwrap"); const cv = el("canvas"); cv.id = "graph";
  const legend = el("div", "legend");
  wrap.append(cv, legend); main.replaceChildren(wrap);
  const g = await api("/api/graph");
  const labels = [...new Set(g.nodes.map(n => n.folder))];
  for (const l of labels) { const d = el("div"); const i = el("i"); i.style.background = COLOR(l); d.append(i, l); legend.append(d); }
  legend.append(el("div", "empty", `노드 ${g.nodes.length} · 링크 ${g.edges.length}`));
  legend.append(el("div", "empty", "끌기: 이동 · 휠: 확대 · 클릭: 열기"));
  const W = () => cv.clientWidth, H = () => cv.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  const resize = () => { cv.width = W() * dpr; cv.height = H() * dpr; };
  resize();
  const idx = new Map(g.nodes.map((n, i) => [n.id, i]));
  const deg = new Array(g.nodes.length).fill(0);
  const E = g.edges.map(e => [idx.get(e.s), idx.get(e.t)]).filter(([a, b]) => a != null && b != null);
  E.forEach(([a, b]) => { deg[a]++; deg[b]++; });
  const N = g.nodes.map((n, i) => {
    const ang = (labels.indexOf(n.folder) / labels.length) * Math.PI * 2;
    return { ...n, x: Math.cos(ang) * 200 + (Math.random() - .5) * 200, y: Math.sin(ang) * 200 + (Math.random() - .5) * 200, vx: 0, vy: 0, r: 4 + Math.sqrt(deg[i]) * 1.8, color: CSSCOLOR(n.folder) };
  });
  let view = { x: 0, y: 0, k: 1 }, drag = null, hover = null, alpha = 1, running = true;
  const toWorld = (px, py) => [(px - W() / 2 - view.x) / view.k, (py - H() / 2 - view.y) / view.k];
  function tick() {
    if (alpha > 0.02) {
      for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
        const a = N[i], b = N[j]; let dx = b.x - a.x, dy = b.y - a.y; let d2 = dx * dx + dy * dy || 1;
        const f = 2200 / d2 * alpha; const d = Math.sqrt(d2); dx /= d; dy /= d;
        a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
      }
      for (const [ia, ib] of E) {
        const a = N[ia], b = N[ib]; const dx = b.x - a.x, dy = b.y - a.y; const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = (d - 90) * 0.012 * alpha; a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
      }
      for (const n of N) {
        n.vx -= n.x * 0.004 * alpha; n.vy -= n.y * 0.004 * alpha;
        if (n !== drag?.node) { n.x += n.vx; n.y += n.vy; }
        n.vx *= 0.55; n.vy *= 0.55;
      }
      alpha *= 0.985;
    }
    draw();
    if (running) requestAnimationFrame(tick);
  }
  const ctx = cv.getContext("2d");
  const fg = getComputedStyle(document.body).color, line = getComputedStyle(document.documentElement).getPropertyValue("--line").trim();
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W(), H());
    ctx.translate(W() / 2 + view.x, H() / 2 + view.y); ctx.scale(view.k, view.k);
    const near = hover ? new Set(E.filter(([a, b]) => a === hover || b === hover).flat()) : null;
    ctx.lineWidth = 1 / view.k;
    for (const [a, b] of E) {
      const on = hover != null && (a === hover || b === hover);
      ctx.strokeStyle = on ? N[hover].color : line; ctx.globalAlpha = hover != null && !on ? 0.25 : 0.9;
      ctx.beginPath(); ctx.moveTo(N[a].x, N[a].y); ctx.lineTo(N[b].x, N[b].y); ctx.stroke();
    }
    N.forEach((n, i) => {
      ctx.globalAlpha = near && !near.has(i) && i !== hover ? 0.3 : 1;
      ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
      if (n.r > 8 || view.k > 1.6 || i === hover || near?.has(i)) {
        ctx.fillStyle = fg; ctx.font = `${12 / Math.max(view.k, .7)}px sans-serif`; ctx.textAlign = "center";
        ctx.fillText(n.title.length > 18 ? n.title.slice(0, 17) + "…" : n.title, n.x, n.y + n.r + 12 / Math.max(view.k, .7));
      }
    });
    ctx.globalAlpha = 1;
  }
  const pick = (e) => { const r = cv.getBoundingClientRect(); const [x, y] = toWorld(e.clientX - r.left, e.clientY - r.top); let best = null, bd = 1e9; N.forEach((n, i) => { const d = Math.hypot(n.x - x, n.y - y); if (d < n.r + 6 / view.k && d < bd) { bd = d; best = i; } }); return best; };
  cv.addEventListener("mousedown", e => { const i = pick(e); drag = { node: i != null ? N[i] : null, sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false }; });
  window.addEventListener("mousemove", onMove);
  function onMove(e) {
    if (!cv.isConnected) return;
    const tip = $("gtip");
    if (drag) {
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 3) drag.moved = true;
      if (drag.node) { const r = cv.getBoundingClientRect(); [drag.node.x, drag.node.y] = toWorld(e.clientX - r.left, e.clientY - r.top); alpha = Math.max(alpha, 0.3); }
      else { view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy; }
      return;
    }
    const i = pick(e); hover = i;
    if (i != null) { tip.hidden = false; tip.textContent = `${N[i].title} · ${N[i].folder} · 링크 ${deg[i]}`; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; cv.style.cursor = "pointer"; }
    else { tip.hidden = true; cv.style.cursor = "grab"; }
  }
  window.addEventListener("mouseup", e => { if (drag && !drag.moved && drag.node) location.hash = "#/page/" + enc(drag.node.id); drag = null; });
  cv.addEventListener("wheel", e => { e.preventDefault(); const k = Math.min(4, Math.max(.25, view.k * (e.deltaY < 0 ? 1.12 : 1 / 1.12))); view.k = k; }, { passive: false });
  window.addEventListener("resize", resize);
  graphStop = () => { running = false; $("gtip").hidden = true; window.removeEventListener("mousemove", onMove); window.removeEventListener("resize", resize); };
  tick();
}

const saveChat = () => { try { sessionStorage.setItem("kb-chat", JSON.stringify(chatLog.slice(-40))); } catch {} };
let chatBusy = false;
const EXAMPLES = ["실사 영상은 어떤 모델이 나아?", "시댄스 대사 발음이 이상할 때 어떻게 해?", "AI 영상 초보는 뭐부터 시작해?", "아침인사방 송년회는 정해졌어?", "돈 아끼면서 영상 만드는 방법 알려줘"];
function showChat() {
  current = null; markTree();
  const main = $("main"); const box = el("div", "chat");
  const msgs = el("div", "msgs");
  const comp = el("form", "composer");
  const ta = el("textarea"); ta.placeholder = "위키에 물어보세요  (Enter 보내기 · Shift+Enter 줄바꿈)"; ta.rows = 1;
  const send = el("button", null, "보내기"); send.type = "submit";
  comp.append(ta, send);
  const tip = el("div", "composer-tip");
  tip.append(el("span", null, "위키 페이지와 카톡 원문에서 근거를 골라 Claude가 답합니다. 답 하나에 보통 10~40초 걸립니다."));
  const clear = el("button", null, "대화 지우기"); clear.type = "button";
  clear.addEventListener("click", () => { chatLog.length = 0; saveChat(); draw(); });
  tip.append(clear);
  box.append(msgs, comp, tip); main.replaceChildren(box);
  if (D) {   // 공유본(파일 하나)에는 서버가 없어서 Claude 를 부를 수 없음
    msgs.append(hello("채팅은 이 PC에서 서버로 실행했을 때만 돼요", "공유본(HTML 파일)에서는 위 검색창으로 찾아 주세요. 이 PC에서는 kb-viewer\\KB뷰어-실행.bat 으로 열면 채팅을 쓸 수 있어요."));
    ta.disabled = send.disabled = true; clear.hidden = true; return;
  }
  function hello(title, sub) { const h = el("div", "hello"); h.append(el("div", null, "💬"), el("h2", null, title), el("div", null, sub)); return h; }
  function bubbleFor(m) {
    if (m.role === "user") return el("div", "bubble user", m.text);
    if (m.role === "error") return el("div", "bubble err", "⚠ " + m.text);
    const b = el("div", "bubble bot"); const body = el("div"); body.innerHTML = m.html;   // 서버가 escape 후 만든 HTML
    b.append(body);
    const meta = el("div", "meta"); meta.append("근거:");
    for (const s of m.sources || []) { const a = el("a", null, s.title.replace(/^(질문|자료 요약):\s*/, "")); a.href = "#/page/" + enc(s.name); a.title = s.folder; meta.append(a); }
    if (m.rawCount) meta.append(`· 원문 ${m.rawCount}줄`);
    if (m.seconds) meta.append(`· ${m.seconds}초`);
    b.append(meta); return b;
  }
  function draw() {
    msgs.replaceChildren();
    if (!chatLog.length) {
      const h = hello("위키에 물어보세요", "AI영상방 노하우, 도구 비교, 아침인사방 이야기까지 위키에 있는 내용으로 답해요.");
      const ex = el("div", "examples");
      for (const q of EXAMPLES) { const b = el("button", null, q); b.type = "button"; b.addEventListener("click", () => ask(q)); ex.append(b); }
      h.append(ex); msgs.append(h);
    }
    for (const m of chatLog) msgs.append(bubbleFor(m));
    if (chatBusy) { const w = el("div", "bubble wait"); w.append(el("span", null, "Claude가 위키를 읽고 답을 쓰는 중…")); msgs.append(w); }
    msgs.scrollTop = msgs.scrollHeight;
    send.disabled = chatBusy;
  }
  async function ask(q) {
    q = q.trim(); if (!q || chatBusy) return;
    const history = chatLog.filter(m => m.role !== "error").slice(-6).map(m => ({ role: m.role === "user" ? "user" : "assistant", text: m.role === "user" ? m.text : (m.markdown || "") }));
    chatLog.push({ role: "user", text: q }); saveChat(); chatBusy = true; ta.value = ""; draw();
    try {
      const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json", "X-KB-Chat": "1" }, body: JSON.stringify({ question: q, history }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) chatLog.push({ role: "error", text: j.error || "답을 받지 못했어요." });
      else chatLog.push({ role: "bot", html: j.html, markdown: j.markdown, sources: j.sources, rawCount: j.rawCount, seconds: j.seconds });
    } catch (e) { chatLog.push({ role: "error", text: "서버에 연결하지 못했어요. KB뷰어-실행.bat 으로 켜져 있는지 확인해 주세요." }); }
    chatBusy = false; saveChat();
    if (msgs.isConnected) { draw(); ta.focus(); }
  }
  comp.addEventListener("submit", e => { e.preventDefault(); ask(ta.value); });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(ta.value); } });
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 160) + "px"; });
  draw(); ta.focus();
}

// ── 주소(해시) 라우팅 ──
async function route() {
  graphStop?.(); graphStop = null;
  document.body.classList.remove("drawer");
  const h = location.hash.slice(1) || "/page/index";
  const [path, qs] = h.split("?");
  const params = new URLSearchParams(qs || "");
  const parts = path.split("/").filter(Boolean).map(decodeURIComponent);
  const tab = ["graph", "stats", "chat"].includes(parts[0]) ? parts[0] : "page";
  const TITLES = { graph: "그래프", stats: "통계", search: "검색", chat: "채팅" };
  document.title = TITLES[parts[0]] ? `${TITLES[parts[0]]} · KB 뷰어` : "KB 뷰어";
  document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  try {
    if (parts[0] === "page") await showPage(parts.slice(1).join("/") || "index");
    else if (parts[0] === "raw") await showRaw(parts[1] || "", params);
    else if (parts[0] === "search") await showSearch(params);
    else if (parts[0] === "chat") showChat();
    else if (parts[0] === "graph") await showGraph();
    else if (parts[0] === "stats") await showStats();
    else await showPage("index");
  } catch (e) { $("main").replaceChildren(wrapMsg("문제가 생겼어요: " + e.message)); }
}
window.addEventListener("hashchange", route);
$("menuBtn").addEventListener("click", () => document.body.classList.toggle("drawer"));

loadTree().then(route).catch(e => { $("tree").replaceChildren(el("p", "empty", "목록을 못 불러왔어요: " + e.message)); route(); });
})();
</script>
