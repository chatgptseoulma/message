EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스<\/a>는 결과가 처참했다는 평입니다 (<span class=\"lref\">L107<\/span>).<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","folder":"AI영상방"},{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"}],"outgoing":[{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","exists":true},{"name":"시댄스","title":"시댄스 (Seedance)","exists":true}]},"뮤즈-AI":{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/뮤즈-AI.md","fm":{"type":"entity","tags":["도구","이미지","영상모델","무료"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L3009-3041 L3525-3527 L4576-4607 L5100-5101 L6193 L6263-6290"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L3009-3041<\/span> <span class=\"lref\">L3525-3527<\/span> <span class=\"lref\">L4576-4607<\/span> <span class=\"lref\">L5100-5101<\/span> <span class=\"lref\">L6193<\/span> <span class=\"lref\">L6263-6290<\/span>"],"html":"<h1>뮤즈 AI (Meta Muse)<\/h1>\n<p>메타의 이미지·영상 생성 서비스입니다. <strong>무료<\/strong>라서 9월부터 화제가 됐습니다 (<span class=\"lref\">L3009-3041<\/span>, <span class=\"lref\">L4576-4607<\/span>).<\/p>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>9월<\/td><td>Muse Spark 1.3은 OpenCode에서 무료로 쓸 수 있지만 데이터를 수집하므로 <strong>개인정보를 넣지 말 것<\/strong><\/td><td><span class=\"lref\">L3525-3527<\/span><\/td><\/tr><tr><td>11월<\/td><td>무료이지만 프롬프트 가이드와 모델 사양 정보가 없어 세밀하게 제어하기 어려움<\/td><td><span class=\"lref\">L5100-5101<\/span><\/td><\/tr><tr><td>11월<\/td><td>4K를 지원하고 미드저니 같은 색감<\/td><td><span class=\"lref\">L6263-6273<\/span><\/td><\/tr><tr><td>11월<\/td><td>좋은 시트 예시를 몇 개 먼저 주면 그 방식을 학습함 → <a class=\"wl\" href=\"#/page/%EC%BA%90%EB%A6%AD%ED%84%B0-%EC%8B%9C%ED%8A%B8\">캐릭터-시트<\/a><\/td><td><span class=\"lref\">L6269<\/span><\/td><\/tr><tr><td>11월<\/td><td><strong>영상은 디지털 느낌이 강하고 통제가 어려움.<\/strong> 눈 색이 바뀌는 등<\/td><td><span class=\"lref\">L6283-6290<\/span><\/td><\/tr><tr><td>11월<\/td><td>지역 제한으로 영상 기능을 못 쓰는 사람이 있음<\/td><td><span class=\"lref\">L6277-6280<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>쓰임새:<\/strong> Mr.HAN의 파이프라인에서 프롬프트를 <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스<\/a>용으로 바꾸는 데 씁니다 (<span class=\"lref\">L6193<\/span>).<\/li><li><strong>배경 이미지:<\/strong> <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%93%9C%EC%A0%80%EB%8B%88\">미드저니<\/a>와 함께 배경용으로 추천됩니다 (<span class=\"lref\">L6246-6248<\/span>).<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"미드저니","title":"미드저니 (Midjourney)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"src-AI영상방-대화","title":"자료 요약: AI영상방 대화 내보내기","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"캐릭터-시트","title":"캐릭터 시트","folder":"AI영상방"}],"outgoing":[{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","exists":true},{"name":"미드저니","title":"미드저니 (Midjourney)","exists":true},{"name":"캐릭터-시트","title":"캐릭터 시트","exists":true}]},"미니맥스-H3":{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/미니맥스-H3.md","fm":{"type":"entity","tags":["도구","영상모델","로컬"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L104-128 L415-417 L1347-1400 L2777-2805 L3216 L5096-5102 L5274-5281 L5840"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L104-128<\/span> <span class=\"lref\">L415-417<\/span> <span class=\"lref\">L1347-1400<\/span> <span class=\"lref\">L2777-2805<\/span> <span class=\"lref\">L3216<\/span> <span class=\"lref\">L5096-5102<\/span> <span class=\"lref\">L5274-5281<\/span> <span class=\"lref\">L5840<\/span>"],"html":"<h1>미니맥스 H3 (MiniMax H3)<\/h1>\n<p><strong>가장 싸고<\/strong>, 내 PC에서도 돌릴 수 있는 영상 모델입니다. 뮤직비디오와 세로 숏폼에 많이 씁니다.<\/p>\n<h2>방 안 평가<\/h2>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>빠른 동작에 약하고 번짐이 있음<\/td><td><span class=\"lref\">L119-128<\/span><\/td><\/tr><tr><td>8월<\/td><td>2D와 디자인 쪽에 강함<\/td><td><span class=\"lref\">L415-417<\/span><\/td><\/tr><tr><td>8월<\/td><td>공식 프롬프트 가이드가 있으니 LLM에게 <strong>먼저 학습시킨 뒤<\/strong> 프롬프트를 물어볼 것<\/td><td><span class=\"lref\">L103-105<\/span><\/td><\/tr><tr><td>8월<\/td><td><a class=\"wl\" href=\"#/page/%EB%9F%B0%EC%9B%A8%EC%9D%B4\">런웨이<\/a> 안에서 쓴 미니맥스는 결과가 처참했다는 평<\/td><td><span class=\"lref\">L107<\/span><\/td><\/tr><tr><td>9월<\/td><td>H3 Turbo는 크레딧이 매우 싸고 30초 안에 생성<\/td><td><span class=\"lref\">L2777<\/span>, <span class=\"lref\">L2897<\/span><\/td><\/tr><tr><td>9월<\/td><td>특유의 지글거림, 액션·멀티 레퍼런스에 약함. 이미지→프레임 방식은 괜찮음<\/td><td><span class=\"lref\">L2796-2805<\/span><\/td><\/tr><tr><td>9월<\/td><td><a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a>에도 들어옴<\/td><td><span class=\"lref\">L3216-3217<\/span><\/td><\/tr><tr><td>11월<\/td><td><strong>H3가 표준 모델이고 가장 쌈.<\/strong> Max는 속도만 빠름<\/td><td><span class=\"lref\">L5278-5281<\/span><\/td><\/tr><tr><td>11월<\/td><td>뮤비에 좋음. Blender 프리비즈를 넣어 카메라 무빙을 줄 수 있음<\/td><td><span class=\"lref\">L5274<\/span>, <span class=\"lref\">L5096<\/span><\/td><\/tr><tr><td>11월<\/td><td>MV 한 편에 RunningHub 약 8천 코인 (재생성 포함)<\/td><td><span class=\"lref\">L5840<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>약점<\/h2>\n<ul><li>액션 장면<\/li><li>한글 글자 출력 (복불복, <span class=\"lref\">L26-38<\/span>)<\/li><li>작은 얼굴은 뭉개짐 → <a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a>의 FaceDetailer<\/li><\/ul>\n<h2>로컬 실행<\/h2>\n<ul><li>가속 LoRA(MiniMax-H3-Acc-LoRAs)를 쓰면 8GB VRAM에서도 돌아갑니다 (<span class=\"lref\">L1347-1348<\/span>).<\/li><li>저해상도로 생성한 뒤 업스케일하는 워크플로가 있습니다.<\/li><li>자세한 내용은 <a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a>에 있습니다.<\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"런웨이","title":"런웨이 (Runway)","folder":"AI영상방"},{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방"},{"name":"src-AI영상방-대화","title":"자료 요약: AI영상방 대화 내보내기","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"}],"outgoing":[{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","exists":true},{"name":"런웨이","title":"런웨이 (Runway)","exists":true},{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","exists":true},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","exists":true}]},"미드저니":{"name":"미드저니","title":"미드저니 (Midjourney)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/미드저니.md","fm":{"type":"entity","tags":["도구","이미지"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L4289-4291 L6236-6273"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L4289-4291<\/span> <span class=\"lref\">L6236-6273<\/span>"],"html":"<h1>미드저니 (Midjourney)<\/h1>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody "lref\">L4062<\/span><\/td><\/tr><tr><td>9월<\/td><td>Studio에서 export가 불안정함<\/td><td><span class=\"lref\">L2502<\/span><\/td><\/tr><tr><td>9월<\/td><td>공유 링크로 들려주는 것은 가능<\/td><td><span class=\"lref\">L2964<\/span><\/td><\/tr><tr><td>9월<\/td><td>저작권 필터가 과하다는 불만<\/td><td><span class=\"lref\">L4260<\/span><\/td><\/tr><tr><td>11월<\/td><td><strong>클로드에 수노 MCP를 연결<\/strong>해 곡을 만들면 편함. 너무 길면 짧게 다시 만들게 함<\/td><td><span class=\"lref\">L4709-4734<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>요령<\/h2>\n<ul><li><strong>원하는 분위기 따라 하기:<\/strong> 참고곡을 LLM에 주고 수노용 스타일 프롬프트와 가사를 추천받습니다 (로킹, <span class=\"lref\">L2271-2273<\/span>).<\/li><li><strong>유튜브 유입:<\/strong> 오리지널만 올리면 잘 안 봅니다. 커버곡을 가끔 섞으면 도움이 됩니다 (<span class=\"lref\">L5943-5949<\/span>).<\/li><\/ul>\n<h2>대안<\/h2>\n<ul><li><a class=\"wl\" href=\"#/page/YuE2\">YuE2<\/a>: 오픈소스<\/li><li><a class=\"wl\" href=\"#/page/Flow\">Flow<\/a> 뮤직<\/li><li>자세한 내용은 <a class=\"wl\" href=\"#/page/%EC%9D%8C%EC%95%85-%EB%A7%8C%EB%93%A4%EA%B8%B0\">음악-만들기<\/a>에 있습니다.<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"Flow","title":"Flow (구글)","folder":"AI영상방"},{"name":"YuE2","title":"YuE2","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","folder":"AI영상방"}],"outgoing":[{"name":"Flow","title":"Flow (구글)","exists":true},{"name":"YuE2","title":"YuE2","exists":true},{"name":"음악-만들기","title":"음악 만들기","exists":true}]},"시댄스":{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/시댄스.md","fm":{"type":"entity","tags":["도구","영상모델"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L41-99 L291-339 L2789-2793 L4446 L5145-5149 L5284 L5355 L5481-5501 L6246-6261"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L41-99<\/span> <span class=\"lref\">L291-339<\/span> <span class=\"lref\">L2789-2793<\/span> <span class=\"lref\">L4446<\/span> <span class=\"lref\">L5145-5149<\/span> <span class=\"lref\">L5284<\/span> <span class=\"lref\">L5355<\/span> <span class=\"lref\">L5481-5501<\/span> <span class=\"lref\">L6246-6261<\/span>"],"html":"<h1>시댄스 (Seedance)<\/h1>\n<p>방에서 <strong>품질과 액션 표현이 가장 좋다<\/strong>고 꼽히는 영상 생성 모델입니다. 버전은 2.0, 2.0 mini, 2.0 Fast, 2.5가 있습니다.<\/p>\n<ul><li><strong>공식 홈:<\/strong> <a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a><\/li><li><strong>다른 곳에서 쓰기:<\/strong> <a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a>, <a class=\"wl\" href=\"#/page/%EB%9F%B0%EC%9B%A8%EC%9D%B4\">런웨이<\/a> 등<\/li><\/ul>\n<h2>방 안 평가<\/h2>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>2.5가 더 부드럽고 사실적<\/td><td><span class=\"lref\">L299<\/span><\/td><\/tr><tr><td>8월<\/td><td><strong>2D 애니는 2.0이 더 깔끔<\/strong>. 각각 3번씩 뽑아 3번 다 2.0 선택. 애니엔 2.0 mini도 괜찮음<\/td><td><span class=\"lref\">L317-326<\/span><\/td><\/tr><tr><td>8월<\/td><td>2.5는 영상 속 특정 부분 수정에 쓸 수 있다는 말 (전해 들은 정보)<\/td><td><span class=\"lref\">L1263<\/span><\/td><\/tr><tr><td>9월<\/td><td>저작권 필터가 엄격해서 외주 작업을 미니맥스로 대체<\/td><td><span class=\"lref\">L2789-2793<\/span><\/td><\/tr><tr><td>9월<\/td><td>2.5는 \"BGM 금지\"라고 적어도 음악이 섞여 나옴<\/td><td><span class=\"lref\">L4446-4447<\/span><\/td><\/tr><tr><td>11월<\/td><td>대사에 한계가 있음 → <a class=\"wl\" href=\"#/page/%EB%8C%80%EC%82%AC%EC%99%80-%EB%AA%A9%EC%86%8C%EB%A6%AC\">대사와-목소리<\/a><\/td><td><span class=\"lref\">L5145<\/span><\/td><\/tr><tr><td>11월<\/td><td>액션은 최강이지만 캐릭터 일관성은 약하고, 매우 비쌈<\/td><td><span class=\"lref\">L5499-5501<\/span><\/td><\/tr><tr><td>11월<\/td><td>사고(이상한 결과)가 가장 적음<\/td><td><span class=\"lref\">L5355<\/span><\/td><\/tr><tr><td>11월<\/td><td>실사는 2.5, 애니는 2.0. 둘의 색감이 다름<\/td><td><span class=\"lref\">L6246<\/span>, <span class=\"lref\">L6261<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>비용 (대화 시점 기준)<\/h2>\n<ul><li>15초 생성: 2.5가 18크레딧. <a class=\"wl\" href=\"#/page/%ED%83%91%EB%B7%B0-T1\">탑뷰-T1<\/a>은 15크레딧입니다 (11월, <span class=\"lref\">L5284<\/span>).<\/li><li>시댄스만으로 약 3분 분량을 만드는 데 약 9만~10만 원이 들었습니다 (11월, <span class=\"lref\">L5492-5493<\/span>).<\/li><li>2.5는 2.0보다 2배 넘게 비쌉니다 (<a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a> 기준, 8월, <span class=\"lref\">L83<\/span>).<\/li><\/ul>\n<h2>쓰는 요령<\/h2>\n<ul><li>비싸므로 <strong>화려한 액션 컷에만<\/strong> 씁니다 → <a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a><\/li><li>대사 발음은 소리 나는 대로 적습니다 → <a class=\"wl\" href=\"#/page/%EB%8C%80%EC%82%AC%EC%99%80-%EB%AA%A9%EC%86%8C%EB%A6%AC\">대사와-목소리<\/a><\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"CLAUDE","title":"CLAUDE.md — docs/kb LLM Wiki 스키마","folder":"볼트"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"Wan","title":"Wan (완)","folder":"AI영상방"},{"name":"대사와-목소리","title":"대사와 목소리","folder":"AI영상방"},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","folder":"AI영상방"},{"name":"런웨이","title":"런웨이 (Runway)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방"},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","folder":"AI영상방"},{"name":"탑뷰-T1","title":"탑뷰 T1 (Topview T1)","folder":"AI영상방"}],"outgoing":[{"name":"대사와-목소리","title":"대사와 목소리","exists":true},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","exists":true},{"name":"런웨이","title":"런웨이 (Runway)","exists":true},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","exists":true},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","exists":true},{"name":"탑뷰-T1","title":"탑뷰 T1 (Topview T1)","exists":true},{"name":"힉스필드","title":"힉스필드 (Higgsfield)","exists":true}]},"클로드":{"name":"클로드","title":"클로드 (Claude)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/클로드.md","fm":{"type":"entity","tags":["도구","LLM"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L500-535 L2247-2260 L3808-3813 L4002-4013 L4295-4300 L4648-4653 L4956-4961 L5012-5043 L5126-5131 L6254-6259"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L500-535<\/span> <span class=\"lref\">L2247-2260<\/span> <span class=\"lref\">L3808-3813<\/span> <span class=\"lref\">L4002-4013<\/span> <span class=\"lref\">L4295-4300<\/span> <span class=\"lref\">L4648-4653<\/span> <span class=\"lref\">L4956-4961<\/span> <span class=\"lref\">L5012-5043<\/span> <span class=\"lref\">L5126-5131<\/span> <span class=\"lref\">L6254-6259<\/span>"],"html":"<h1>클로드 (Claude)<\/h1>\n<p>Anthropic의 LLM입니다. 방에서는 <strong>스토리·대본·코드·프리비즈에 강하다<\/strong>는 평입니다.<\/p>\n<h2>방 안 평가<\/h2>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>스토리 구성과 코드 품질이 좋지만 안전한 쪽을 골라 밋밋할 때가 있음<\/td><td><span class=\"lref\">L517-519<\/span><\/td><\/tr><tr><td>8월<\/td><td>이미지는 만들지 못함<\/td><td><span class=\"lref\">L500<\/span><\/td><\/tr><tr><td>8월<\/td><td>사용량이 5시간마다 초기화되고 Pro는 한도가 작음<\/td><td><span class=\"lref\">L534-535<\/span><\/td><\/tr><tr><td>9월<\/td><td>블로그 자동 발행 프로그램 같은 개발에는 Claude Code 추천<\/td><td><span class=\"lref\">L4002<\/span>, <span class=\"lref\">L4013<\/span><\/td><\/tr><tr><td>9월<\/td><td>9/23 GPT와 함께 \"초기화권\" 지급 → <a class=\"wl\" href=\"#/page/%EC%82%AC%EC%9A%A9%EB%9F%89-%EA%B4%80%EB%A6%AC\">사용량-관리<\/a><\/td><td><span class=\"lref\">L4295-4300<\/span><\/td><\/tr><tr><td>11월<\/td><td>편집 스킬, 대본 정리, 프리비즈를 잘 만듦. 이미지 해석은 엉뚱할 때가 있음<\/td><td><span class=\"lref\">L4956-4961<\/span>, <span class=\"lref\">L5012-5015<\/span>, <span class=\"lref\">L5043<\/span><\/td><\/tr><tr><td>11월<\/td><td>Opus는 사용량이 빨리 닳는다는 체감<\/td><td><span class=\"lref\">L5126-5131<\/span><\/td><\/tr><tr><td>11월<\/td><td>PC에 켜 두고 휴대폰으로 지시하면 MCP로 그림·음악·영상까지 처리<\/td><td><span class=\"lref\">L6254-6259<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>모델 소식<\/h2>\n<ul><li><strong>9/21:<\/strong> 방장이 Opus 5.5 출시설을 전했습니다. 가격은 루머라고 밝혔습니다 (<span class=\"lref\">L2247-2260<\/span>).<\/li><li><strong>9/23:<\/strong> 방장이 \"Opus 5.5 vs 아스트라\" 비교 영상을 올렸습니다 (<span class=\"lref\">L4648-4653<\/span>). → <a class=\"wl\" href=\"#/page/%EC%93%B8%EB%A7%8C%ED%95%9C-%EB%A7%81%ED%81%AC\">쓸만한-링크<\/a><\/li><\/ul>\n<h2>활용<\/h2>\n<ul><li>MCP 연결과 토큰 절약 요령은 <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C-MCP-%ED%99%9C%EC%9A%A9\">클로드-MCP-활용<\/a>에 있습니다.<\/li><li><a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT-코덱스<\/a>와의 역할 분담도 참고하세요.<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","folder":"AI영상방"},{"name":"편집-툴","title":"편집 툴","folder":"AI영상방"}],"outgoing":[{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","exists":true},{"name":"사용량-관리","title":"사용량 관리 (LLM 한도)","exists":true},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","exists":true},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","exists":true}]},"클링":{"name":"클링","title":"클링 (Kling)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/클링.md","fm":{"type":"entity","tags":["도구","영상모델"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L5266-5270 L5501"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L5266-5270<\/span> <span class=\"lref\">L5501<\/span>"],"html":"<h1>클링 (Kling)<\/h1>\n<p>영상 생성 모델이자 같은 이름의 단일 툴입니다.<\/p>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>평가<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>11월<\/td><td><strong>실사는 클링이 낫다<\/strong><\/td><td><span class=\"lref\">L5270<\/span><\/td><\/tr><tr><td>11월<\/td><td>액션은 약하지만 캐릭터 일관성이 좋다<\/td><td><span class=\"lref\">L5501<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>질문에 \"Kling 4.0\"이라는 표현이 나옵니다 (<span class=\"lref\">L5267<\/span>). 실제 버전은 확인되지 않았습니다.<\/li><li>플랫폼을 고를 때 \"클링 = 단일 툴, <a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a> = 여러 모델 모음\"으로 비교됩니다.<\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"}],"outgoing":[{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","exists":true},{"name":"힉스필드","title":"힉스필드 (Higgsfield)","exists":true}]},"탑뷰-T1":{"name":"탑뷰-T1","title":"탑뷰 T1 (Topview T1)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/탑뷰-T1.md","fm":{"type":"entity","tags":["도구","영상모델"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L5272-5300"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L5272-5300<\/span>"],"html":"<h1>탑뷰 T1 (Topview T1)<\/h1>\n<p>Topview에서만 쓸 수 있는 영상 모델입니다.<\/p>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>11월<\/td><td>방장: \"탑뷰 T1 좋습니다.\" <a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a> 2.5를 증류한 것 같고 품질이 거의 비슷함<\/td><td><span class=\"lref\">L5272-5282<\/span><\/td><\/tr><tr><td>11월<\/td><td>15초에 T1은 15크레딧, 시댄스 2.5는 18크레딧. <strong>차이가 작아 그냥 2.5를 쓴다<\/strong>는 의견<\/td><td><span class=\"lref\">L5284<\/span><\/td><\/tr><tr><td>11월<\/td><td>플랜에 따라 가격이 다르게 보였다는 말<\/td><td><span class=\"lref\">L5293-5300<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"}],"outgoing":[{"name":"시댄스","title":"시댄스 (Seedance)","exists":true},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","exists":true}]},"편집-툴":{"name":"편집-툴","title":"편집 툴","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/편집-툴.md","fm":{"type":"entity","tags":["도구","편집"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L302-306 L3601 L4779-4972 L4815-4833 L4926-4928 L4941 L4952"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L302-306<\/span> <span class=\"lref\">L3601<\/span> <span class=\"lref\">L4779-4972<\/span> <span class=\"lref\">L4815-4833<\/span> <span class=\"lref\">L4926-4928<\/span> <span class=\"lref\">L4941<\/span> <span class=\"lref\">L4952<\/span>"],"html":"<h1>편집 툴<\/h1>\n<p>11/4에 자막 가독성 이야기에서 시작해 편집 툴을 비교했습니다 (<span class=\"lref\">L4779-4972<\/span>).<\/p>\n<div class='tw'><table><thead><tr><th>툴<\/th><th>평가<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td><strong>캡컷 (CapCut)<\/strong><\/td><td>가장 무난하고 쓰기 쉬움. 입문용 추천<\/td><td><span class=\"lref\">L3601<\/span>, <span class=\"lref\">L4902<\/span>, <span class=\"lref\">L4950<\/span><\/td><\/tr><tr><td>프리미어 (Premiere)<\/td><td>유료 로컬 앱<\/td><td><span class=\"lref\">L4802-4805<\/span><\/td><\/tr><tr><td>파워디렉터<\/td><td>무겁고, 5분 넘게 편집하면 블루스크린이 잦음<\/td><td><span class=\"lref\">L4926-4928<\/span><\/td><\/tr><tr><td>다빈치 리졸브<\/td><td>MCP를 붙일 수 있다는 소식 (불확실). 시댄스 2.0과 2.5의 색감을 맞출 때 쓴다는 말<\/td><td><span class=\"lref\">L4941<\/span>, <span class=\"lref\">L6248<\/span><\/td><\/tr><tr><td>쌤컷<\/td><td>캡컷보다 간단한 무료 컷 편집기. <a href=\"https://ssamtool.com/tool/cut/\" target=\"_blank\" rel=\"noopener\">https://ssamtool.com/tool/cut/<\/a><\/td><td><span class=\"lref\">L4952<\/span><\/td><\/tr><tr><td>아트크래프트<\/td><td>오픈소스 로컬 편집 툴, 완성도는 아직 부족. <a href=\"https://getartcraft.com/\" target=\"_blank\" rel=\"noopener\">https://getartcraft.com/<\/a><\/td><td><span class=\"lref\">L4815-4833<\/span><\/td><\/tr><tr><td>클로드·GPT<\/td><td>편집 스킬을 만들어 맡기는 방식 → <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C\">클로드<\/a><\/td><td><span class=\"lref\">L4956-4961<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>꼭 알아 둘 요령: 캡컷 울렁임<\/h2>\n<ul><li>AI 영상은 보통 <strong>24fps<\/strong>인데 캡컷 기본 내보내기는 30fps입니다.<\/li><li><strong>24fps로 맞춰 내보내면<\/strong> 울렁임이 사라집니다 (카이로스, 8월, <span class=\"lref\">L302-306<\/span>).<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방"}],"outgoing":[{"name":"클로드","title":"클로드 (Claude)","exists":true}]},"힉스필드":{"name":"힉스필드","title":"힉스필드 (Higgsfield)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/힉스필드.md","fm":{"type":"entity","tags":["도구","플랫폼"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L442-496 L523-524 L2414-2416 L3132 L4186 L4280 L5057-5059 L5113-5120 L5443-5519 L5888-5892 L5978-5981"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <span class=\"lref\">L442-496<\/span> <span class=\"lref\">L523-524<\/span> <span class=\"lref\">L2414-2416<\/span> <span class=\"lref\">L3132<\/span> <span class=\"lref\">L4186<\/span> <span class=\"lref\">L4280<\/span> <span class=\"lref\">L5057-5059<\/span> <span class=\"lref\">L5113-5120<\/span> <span class=\"lref\">L5443-5519<\/span> <span class=\"lref\">L5888-5892<\/span> <span class=\"lref\">L5978-5981<\/span>"],"html":"<h1>힉스필드 (Higgsfield)<\/h1>\n<p>여러 영상·이미지 모델을 한곳에 모은 <strong>\"스튜디오\"형 플랫폼<\/strong>입니다.<\/p>\n<h2>방 안 평가<\/h2>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>무제한 요금제여도 동시 대기는 6개가 한계. 6개를 다 걸면 무료 생성은 안 되고 크레딧으로만 됨<\/td><td><span class=\"lref\">L442-451<\/span>, <span class=\"lref\">L485-496<\/span><\/td><\/tr><tr><td>8월<\/td><td>에이전트 기능(Opus), 작가도우미는 크레딧을 많이 씀<\/td><td><span class=\"lref\">L454<\/span>, <span class=\"lref\">L465-469<\/span><\/td><\/tr><tr><td>8월<\/td><td>클로드와 MCP로 연결할 수 있음 → <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C-MCP-%ED%99%9C%EC%9A%A9\">클로드-MCP-활용<\/a><\/td><td><span class=\"lref\">L523-524<\/span><\/td><\/tr><tr><td>9월<\/td><td>Genjutsu: 참고 영상의 춤을 따라 하는 기능<\/td><td><span class=\"lref\">L2414-2416<\/span><\/td><\/tr><tr><td>9월<\/td><td>크레딧으로 쓰면 매우 비쌈. 무제한 요금제는 MCP 연결에 적용되지 않음<\/td><td><span class=\"lref\">L3132<\/span>, <span class=\"lref\">L4280<\/span><\/td><\/tr><tr><td>9월<\/td><td>Enterprise는 입력을 학습에 쓰지 않지만 매우 비쌈<\/td><td><span class=\"lref\">L4186<\/span><\/td><\/tr><tr><td>11월<\/td><td><strong>MCP 연결 자체는 무료<\/strong>, 생성에는 크레딧이 듦<\/td><td><span class=\"lref\">L5057-5059<\/span><\/td><\/tr><tr><td>11월<\/td><td>애니메이션 플랫폼으로 추천됨. <a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a>는 시댄스만 있고 힉스필드에는 다 있음<\/td><td><span class=\"lref\">L5444-5445<\/span><\/td><\/tr><tr><td>11월<\/td><td>작년엔 80%까지 할인했고 올해는 할인이 적다. 블랙프라이데이 할인을 기다리는 분위기<\/td><td><span class=\"lref\">L5888-5892<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>주의: 피싱 의심 메일<\/h2>\n<ul><li>홈페이지에 없는 'Pro 요금제'를 안내하는 메일이 왔다는 보고가 있습니다 (11월, <span class=\"lref\">L5978-5981<\/span>).<\/li><li>방 안 결론은 사기로 의심된다는 것이었습니다.<\/li><\/ul>\n<h2>비교<\/h2>\n<ul><li>Zcre는 1만 원에 1천 크레딧입니다 (<span class=\"lref\">L5115<\/span>).<\/li><li>같은 돈이면 Zcre가 약 30초 더 만든다는 계산이 나왔지만, GPT가 계산한 것이고 검증되지 않았습니다 (<span class=\"lref\">L5348<\/span>).<\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a>, <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","folder":"AI영상방"},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","folder":"AI영상방"},{"name":"클링","title":"클링 (Kling)","folder":"AI영상방"}],"outgoing":[{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","exists":true},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","exists":true},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","exists":true},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","exists":true}]},"src-AI영상방-대화":{"name":"src-AI영상방-대화","title":"자료 요약: AI영상방 대화 내보내기","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"sources","path":"AI영상방_KakaoTalk_20261106_0943/wiki/sources/src-AI영상방-대화.md","fm":{"type":"source","tags":["자료"],"rooms":["AI영상방"],"sources":["raw/2026-11-06_AI영상방_KakaoTalk_0943.txt"],"updated":"2026-11-06"},"sourcesHtml":["raw/2026-11-06_AI영상방_KakaoTalk_0943.txt"],"html":"<h1>자료 요약: AI영상방 대화 내보내기<\/h1>\n<div class='tw'><table><thead><tr><th>항목<\/th><th>값<\/th><\/tr><\/thead><tbody><tr><td>원본<\/td><td><code>raw/2026-11-06_AI영상방_KakaoTalk_0943.txt<\/code> (원래 이름 <code>KakaoTalk_20261106_0943_31_784_group.txt<\/code>)<\/td><\/tr><tr><td>방 이름<\/td><td>AI아스트라 AI영상 노하우 공유방 (<span class=\"lref\">L1<\/span>)<\/td><\/tr><tr><td>크기<\/td><td>6,369줄, 약 461KB<\/td><\/tr><tr><td>저장한 시각<\/td><td>2026-11-06 09:43:33<\/td><\/tr><tr><td>메시지<\/td><td><strong>4,752건<\/strong>. 이 가운데 사진·동영상 425건, 링크가 있는 줄 60개<\/td><\/tr><tr><td>말한 사람<\/td><td>155명<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>날짜별<\/h2>\n<div class='tw'><table><thead><tr><th>기간<\/th><th>줄<\/th><th>날짜별 메시지<\/th><th>큰 화제<\/th><\/tr><\/thead><tbody><tr><td>8/26~28<\/td><td><span class=\"lref\">L4-2227<\/span><\/td><td>626 · 418 · 189<\/td><td>런웨이 무제한 막바지, 로컬 <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스-H3<\/a> 속도, GPT·클로드 비교, 실사 출력 질감<\/td><\/tr><tr><td>9/21~23<\/td><td><span class=\"lref\">L2228-4662<\/span><\/td><td>678 · 880 · 465<\/td><td>오퍼스 5.5 루머, 고가 강의 금지, 코덱스 리셋 소동, <a class=\"wl\" href=\"#/page/YuE2\">YuE2<\/a>, 강퇴 1건<\/td><\/tr><tr><td>11/4~6<\/td><td><span class=\"lref\">L4663-6369<\/span><\/td><td>741 · 588 · 167<\/td><td>편집 툴, 영상 모델 비교, 대사 보정 스킬, 실사 지침, <a class=\"wl\" href=\"#/page/%EB%AE%A4%EC%A6%88-AI\">뮤즈-AI<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong><span class=\"lref\">L1411-2224<\/span>:<\/strong> AI로 만든 웹툰 대본(60컷)을 통째로 붙여 넣은 부분입니다. 대화가 아니므로 위키에는 연출 요령만 넣었습니다.<\/li><li><strong><span class=\"lref\">L6073-6121<\/span>:<\/strong> 저작권 있는 노래 가사가 붙어 있습니다. 위키에 넣지 않습니다.<\/li><\/ul>\n<h2>많이 말한 사람 (상위 8)<\/h2>\n<div class='tw'><table><thead><tr><th>닉네임<\/th><th>메시지<\/th><th>주로 다루는 것<\/th><\/tr><\/thead><tbody><tr><td>사카요리 윤<\/td><td>530<\/td><td>애니 쇼츠 운영, 시댄스 2.0/2.5 비교, 저작권 견해<\/td><\/tr><tr><td>ai공부중1<\/td><td>520<\/td><td>로컬 생성, 런웨이 요령, GPT·클로드 비교, 캐릭터 시트<\/td><\/tr><tr><td>로킹<\/td><td>429<\/td><td>초보 안내, RunPod·Wan2GP, 실사 지침<\/td><\/tr><tr><td>뜰<\/td><td>272<\/td><td>실사 지침 테스트, 로컬 생성 시간 측정<\/td><\/tr><tr><td>알바하는 너구리 쿠리<\/td><td>261<\/td><td>(잡담 비중 높음)<\/td><\/tr><tr><td>라이또<\/td><td>220<\/td><td>미니맥스 MV, 수노·Flow 뮤직, 자작 도구<\/td><\/tr><tr><td>N블 마블링<\/td><td>207<\/td><td>블로그 수익화, 인쇄 디자인<\/td><\/tr><tr><td>판도라고<\/td><td>196<\/td><td>이미지 프롬프트, Flow, YuE2 라이선스 확인<\/td><\/tr><\/tbody><\/table><\/div>\n<p>이 밖에 Mr.HAN(175, 파이프라인·YuE2), 빌런(167, 비용 상담), Runa(113, 대사 보정 스킬), AN0(113, GIF·이모티콘), 카이로스(69, 클로드 MCP 절약)가 자주 등장합니다. 방장은 <strong>AI Astra<\/strong>입니다.<\/p>\n<h2>위키에서 뺀 내용<\/h2>\n<ul><li>안전 필터·검열 우회 방법<\/li><li>여러 계정이나 게스트 로그인으로 할인·무료를 반복해서 받는 방법<\/li><li>저작권 필터를 피하려는 시도, 수위가 있는 대화, 개인 SNS와 연락처, 노래 가사<\/li><\/ul>\n<h2>반영한 페이지<\/h2>\n<p><a class=\"wl\" href=\"#/page/AI%EC%98%81%EC%83%81%EB%B0%A9\">AI영상방<\/a>과 모든 도구·노하우·분석 페이지<\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"src-AI영상방-요약","title":"자료 요약: AI영상방 요약 문서 (사람이 만든 2차 자료)","folder":"AI영상방"},{"name":"AI영상방-기록","title":"작업 기록 (log) — AI영상방","folder":"AI영상방"}],"outgoing":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","exists":true},{"name":"YuE2","title":"YuE2","exists":true},{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","exists":true},{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","exists":true}]},"src-AI영상방-요약":{"name":"src-AI영상방-요약","title":"자료 요약: AI영상방 요약 문서 (사람이 만든 2차 자료)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"sources","path":"AI영상방_KakaoTalk_20261106_0943/wiki/sources/src-AI영상방-요약.md","fm":{"type":"source","tags":["자료","요약"],"rooms":["AI영상방"],"sources":["raw/2026-11-06_AI영상방_요약.md"],"updated":"2026-11-06"},"sourcesHtml":["raw/2026-11-06_AI영상방_요약.md"],"html":"<h1>자료 요약: AI영상방 요약 문서 (사람이 만든 2차 자료)<\/h1>\n<div class='tw'><table><thead><tr><th>항목<\/th><th>값<\/th><\/tr><\/thead><tbody><tr><td>원본<\/td><td><code>raw/2026-11-06_AI영상방_요약.md<\/code> (원래 이름 <code>AI아스트라_영상노하우방_요약_20261106.md<\/code>, 09:47 작성)<\/td><\/tr><tr><td>성격<\/td><td><a class=\"wl\" href=\"#/page/src-AI%EC%98%81%EC%83%81%EB%B0%A9-%EB%8C%80%ED%99%94\">src-AI영상방-대화<\/a>를 요약한 <strong>2차 자료<\/strong>. 원문과 다르면 원문을 따릅니다.<\/td><\/tr><tr><td>구성<\/td><td>날짜별 화제, 노하우·팁, 도구 평가, 자주 나온 질문, 링크, 방 규칙<\/td><\/tr><tr><td>빼고 정리한 것<\/td><td>AI 안전장치 우회법, 여러 계정으로 할인을 반복해서 받는 법<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>원문 대조 결과 (2026-11-06)<\/h2>\n<div class='tw'><table><thead><tr><th>항목<\/th><th>요약 문서<\/th><th>원문 집계<\/th><th>판정<\/th><\/tr><\/thead><tbody><tr><td>메시지 수<\/td><td>4,752<\/td><td>4,752<\/td><td>일치<\/td><\/tr><tr><td>사진·동영상<\/td><td>425<\/td><td>425<\/td><td>일치<\/td><\/tr><tr><td>링크<\/td><td>60<\/td><td>http가 들어간 줄 60<\/td><td>일치<\/td><\/tr><tr><td>1위 발언자<\/td><td>사카요리 윤 530<\/td><td>530<\/td><td>일치<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>반영한 페이지<\/h2>\n<p>도구 평가와 노하우 페이지의 뼈대로 썼습니다. 세부 내용과 줄 번호는 원문 기간별 분석으로 보완했습니다. → <a class=\"wl\" href=\"#/page/src-AI%EC%98%81%EC%83%81%EB%B0%A9-%EB%8C%80%ED%99%94\">src-AI영상방-대화<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"AI영상방-기록","title":"작업 기록 (log) — AI영상방","folder":"AI영상방"}],"outgoing":[{"name":"src-AI영상방-대화","title":"자료 요약: AI영상방 대화 내보내기","exists":true}]}},"search":{"CLAUDE":{"name":"CLAUDE","title":"CLAUDE.md — docs/kb LLM Wiki 스키마","folder":"볼트","tags":"","text":"CLAUDE.md — docs/kb LLM Wiki 스키마\n# CLAUDE.md — docs/kb LLM Wiki 스키마\n\n이 폴더는 Andrej Karpathy의 **LLM Wiki** 패턴을 구현한 지식 베이스이자 **Obsidian 볼트**입니다.\n- 원문: https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f (2026-04-04)\n- 사람은 자료(카카오톡 내보내기)를 넣고 질문합니다. Claude는 위키를 쓰고, 고치고, 점검합니다.\n- **역할 비유:** Obsidian은 IDE, Claude는 프로그래머, 위키는 코드베이스입니다.\n\n## 세 층\n| 층 | 위치 | 누가 | 규칙 |\n|---|---|---|---|\n| 원자료 | `<폴더>/raw/` | 사람이 넣음 | **고치지 않습니다.** 내보낸 txt와 그 파일의 요약을 둡니다. |\n| 위키 | `<폴더>/wiki/` | Claude | 페이지를 만들고 고칩니다. |\n| 스키마 | 이 파일 | 함께 | 규칙이 바뀌면 여기를 고칩니다. |\n\n## 볼트 구조\n```\ndocs/kb/                      ← Obsidian 볼트 루트\n  index.md                    볼트 홈: 파일별 위키 표, 자주 찾는 페이지\n  log.md                      볼트 전체 작업 기록 (추가만)\n  CLAUDE.md                   이 스키마\n  README.md                   사람용 안내\n  _templates/                 Obsidian 템플릿 (entity, concept, source, analysis, query-log)\n  _tools/                     파이썬 도구 (표준 라이브러리만)\n  .claude/commands/           Claude Code 명령: /ingest /query /lint\n  .obsidian/                  Obsidian 설정\n  <방>_KakaoTalk_<YYYYMMDD>_<HHMM>/   내보내기 파일 하나당 폴더 하나\n    raw/                      원자료\n    wiki/\n      <방>-개요.md            이 파일의 전체 그림\n      <방>-목차.md            이 폴더의 모든 페이지 목록 (index 역할)\n      <방>-기록.md            이 폴더의 작업 기록 (log 역할)\n      entities/  concepts/  sources/  analyses/\n```\n- **원본 위치:** 내보내기 원본은 `C:\\2026CC\\카카오톡\\`에 있습니다. 거기서 `raw/`로 복사합니다.\n- **이름 규칙:** 볼트 전체에서 **페이지 이름이 겹치면 안 됩니다.** 위키 링크가 이름으로 찾기 때문입니다.\n  - 그래서 개요·목차·기록 페이지에는 방 이름을 붙입니다.\n  - 새 페이지를 만들기 전에 `python -I _tools/kb_lint.py .`로 겹침을 확인합니다.\n- **같은 도구가 여러 파일에 나오면:**\n  - 기존 페이지(예: [[시댄스]])에 \"○○ 파일 기준\" 단락을 추가합니다.\n  - 페이지를 새로 만들어야 하면 `시댄스-아침인사방`처럼 이름을 다르게 합니다.\n\n## 페이지 규칙\n- **링크:** `[[페이지]]`, `[[페이지|보이는 글]]`\n  - **표 안에서는** `[[페이지\\|보이는 글]]`처럼 `|`를 escape합니다.\n- **머리 정보 (Obsidian Properties):**\n  ```yaml\n  ---\n  type: entity | concept | source | analysis | overview\n  tags: [도구, 영상모델]          # 공백 없는 낱말\n  rooms: [AI영상방]\n  sources: [src-AI영상방-대화 L41-99]\n  updated: YYYY-MM-DD\n  ---\n  ```\n- **본문 순서:** 한 줄 정의 → 사실(표·목록, 줄 번호 `L1234`) → 관련 페이지\n- **믿는 순서:** 원문 대화 > 사람이 만든 요약. 가격·한도·버전은 \"○월 대화 기준\"이라고 적습니다.\n- **추정:** \"(불확실)\"로 표시합니다. 회원 의견은 검증하지 않았다는 점을 밝힙니다.\n\n## 넣지 않는 것\n- 전화번호, 이메일, 실명, 주소, 계좌, 닉네임에 붙은 지역\n- AI 안전장치·검열 우회, 여러 계정으로 약관을 어기며 할인을 받는 방법, 저작권 필터 회피\n- 선정적인 내용, 다툼에서 누구를 탓하는 서술, 노래 가사, 남의 글 전문 (인용은 15자 안팎으로 짧게)\n\n## 작업 흐름\n\n### 넣기 (ingest) — `/ingest <파일>`\n1. `C:\\2026CC\\카카오톡\\`의 새 txt를 `<방>_KakaoTalk_<날짜>_<시각>/raw/`로 복사합니다.\n2. `python -I _tools/kakao_stats.py <txt>`로 기간, 날짜 경계 줄, 메시지 수, 많이 말한 사람을 뽑습니다.\n3. 날짜 경계로 나눠 읽습니다. 2천 줄이 넘으면 기간별로 나눠 병렬로 읽습니다.\n4. `sources/src-…`, `entities/`, `concepts/`, `analyses/` 페이지를 만들거나 고칩니다. 템플릿은 `_templates/`에 있습니다.\n5. `<방>-목차`, `<방>-기록`, 볼트 [[index]]의 표, [[log]]를 고칩니다.\n6. `_tools/kb_lint.py`로 점검합니다.\n\n### 묻기 (query) — `/query <질문>`\n1. [[index]] → 해당 `<방>-목차`를 읽습니다. `python -I _tools/kb_search.py . \"<낱말>\"`로 찾습니다.\n2. 페이지를 읽고, 필요하면 `raw/` 원문 줄을 확인합니다.\n3. 페이지를 링크로 인용해 답합니다.\n4. 다시 쓸 만한 답은 `analyses/`에 페이지로 남기고, 목차와 기록에 추가합니다.\n\n### 점검 (lint) — `/lint`\n1. `python -I _tools/kb_lint.py .`를 실행합니다. 다음을 확인합니다.\n   - 깨진 링크\n   - 고아 페이지\n   - frontmatter 누락\n   - 이름 겹침\n   - 표 안 escape 안 된 별칭\n   - 줄 번호 없는 sources\n2. 직접 읽고 다음을 확인합니다.\n   - 모순\n   - 낡은 가격·버전\n   - 자주 나오는데 페이지가 없는 개념\n3. 고칠 것은 고치고, 나머지는 기록 페이지에 제안으로 남깁니다.\n\n기록 형식: `## [YYYY-MM-DD] ingest|query|lint|setup | 제목`\n최근 기록 보기: `Select-String '^## \\[' log.md | Select-Object -Last 5`\n","lines":["이 폴더는 Andrej Karpathy의 LLM Wiki 패턴을 구현한 지식 베이스이자 Obsidian 볼트입니다.","원문: https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f (2026-04-04)","사람은 자료(카카오톡 내보내기)를 넣고 질문합니다. Claude는 위키를 쓰고, 고치고, 점검합니다.","역할 비유: Obsidian은 IDE, Claude는 프로그래머, 위키는 코드베이스입니다.","층 · 위치 · 누가 · 규칙","--- · --- · --- · ---","원자료 · <폴더>/raw/ · 사람이 넣음 · 고치지 않습니다. 내보낸 txt와 그 파일의 요약을 둡니다.","위키 · <폴더>/wiki/ · Claude · 페이지를 만들고 고칩니다.","스키마 · 이 파일 · 함께 · 규칙이 바뀌면 여기를 고칩니다.","","docs/kb/                      ← Obsidian 볼트 루트","index.md                    볼트 홈: 파일별 위키 표, 자주 찾는 페이지","log.md                      볼트 전체 작업 기록 (추가만)","CLAUDE.md                   이 스키마","README.md                   사람용 안내","_templates/                 Obsidian 템플릿 (entity, concept, source, analysis, query-log)","_tools/                     파이썬 도구 (표준 라이브러리만)",".claude/commands/           Claude Code 명령: /ingest /query /lint",".obsidian/                  Obsidian 설정","<방>_KakaoTalk_<YYYYMMDD>_<HHMM>/   내보내기 파일 하나당 폴더 하나","raw/                      원자료","wiki/","<방>-개요.md            이 파일의 전체 그림","<방>-목차.md            이 폴더의 모든 페이지 목록 (index 역할)","<방>-기록.md            이 폴더의 작업 기록 (log 역할)","entities/  concepts/  sources/  analyses/","","원본 위치: 내보내기 원본은 C:\\2026CC\\카카오톡\\에 있습니다. 거기서 raw/로 복사합니다.","이름 규칙: 볼트 전체에서 페이지 이름이 겹치면 안 됩니다. 위키 링크가 이름으로 찾기 때문입니다.","그래서 개요·목차·기록 페이지에는 방 이름을 붙입니다.","새 페이지를 만들기 전에 python -I _tools/kb_lint.py .로 겹침을 확인합니다.","같은 도구가 여러 파일에 나오면:","기존 페이지(예: 시댄스)에 \"○○ 파일 기준\" 단락을 추가합니다.","페이지를 새로 만들어야 하면 시댄스-아침인사방처럼 이름을 다르게 합니다.","링크: 페이지, 보이는 글","표 안에서는 보이는 글처럼 · 를 escape합니다.","머리 정보 (Obsidian Properties):","yaml","---","type: entity · concept · source · analysis · overview","tags: [도구, 영상모델]          # 공백 없는 낱말","rooms: [AI영상방]","sources: [src-AI영상방-대화 L41-99]","updated: YYYY-MM-DD","---","","본문 순서: 한 줄 정의 → 사실(표·목록, 줄 번호 L1234) → 관련 페이지","믿는 순서: 원문 대화 > 사람이 만든 요약. 가격·한도·버전은 \"○월 대화 기준\"이라고 적습니다.","추정: \"(불확실)\"로 표시합니다. 회원 의견은 검증하지 않았다는 점을 밝힙니다.","전화번호, 이메일, 실명, 주소, 계좌, 닉네임에 붙은 지역","AI 안전장치·검열 우회, 여러 계정으로 약관을 어기며 할인을 받는 방법, 저작권 필터 회피","선정적인 내용, 다툼에서 누구를 탓하는 서술, 노래 가사, 남의 글 전문 (인용은 15자 안팎으로 짧게)","C:\\2026CC\\카카오톡\\의 새 txt를 <방>_KakaoTalk_<날짜>_<시각>/raw/로 복사합니다.","python -I _tools/kakao_stats.py <txt>로 기간, 날짜 경계 줄, 메시지 수, 많이 말한 사람을 뽑습니다.","날짜 경계로 나눠 읽습니다. 2천 줄이 넘으면 기간별로 나눠 병렬로 읽습니다.","sources/src-…, entities/, concepts/, analyses/ 페이지를 만들거나 고칩니다. 템플릿은 _templates/에 있습니다.","<방>-목차, <방>-기록, 볼트 index의 표, log를 고칩니다.","_tools/kb_lint.py로 점검합니다.","index → 해당 <방>-목차를 읽습니다. python -I _tools/kb_search.py . \"<낱말>\"로 찾습니다.","페이지를 읽고, 필요하면 raw/ 원문 줄을 확인합니다.","페이지를 링크로 인용해 답합니다.","다시 쓸 만한 답은 analyses/에 페이지로 남기고, 목차와 기록에 추가합니다.","python -I _tools/kb_lint.py .를 실행합니다. 다음을 확인합니다.","깨진 링크","고아 페이지","frontmatter 누락","이름 겹침","표 안 escape 안 된 별칭","줄 번호 없는 sources","직접 읽고 다음을 확인합니다.","모순","낡은 가격·버전","자주 나오는데 페이지가 없는 개념","고칠 것은 고치고, 나머지는 기록 페이지에 제안으로 남깁니다.","기록 형식: ## [YYYY-MM-DD] ingest · query · lint · setup · 제목","최근 기록 보기: Select-String '^## \\[' log.md · Select-Object -Last 5"]},"index":{"name":"index","title":"KB 홈 (index)","folder":"볼트","tags":"목차 홈","text":"KB 홈 (index)\n# KB 홈 (index)\n\n카카오톡 대화로 만든 **LLM Wiki**의 시작 페이지입니다.\n- 이 폴더(`docs/kb`) 전체가 하나의 Obsidian 볼트입니다.\n- 내보내기 파일 하나가 폴더 하나입니다.\n- 규칙은 [[CLAUDE]], 볼트 전체 작업 기록은 [[log]]에 있습니다.\n\n## 파일별 위키\n| 위키 | 원본 파일 | 개요 | 전체 목록 | 작업 기록 | 쪽수 |\n|---|---|---|---|---|---|\n| AI영상방 | `KakaoTalk_20261106_0943_31_784_group.txt` | [[AI영상방-개요]] | [[AI영상방-목차]] | [[AI영상방-기록]] | 36 |\n| 아침인사방 | `KakaoTalk_20261106_0929_17_298_group.txt` | [[아침인사방-개요]] | [[아침인사방-목차]] | [[아침인사방-기록]] | 6 |\n\n## 자주 찾는 페이지\n- **AI 영상 입문:** [[초보-시작-가이드]] → [[영상-모델-비교]] → [[크레딧-비용-절약]]\n- **도구 평가:** [[시댄스]], [[클링]], [[Wan]], [[미니맥스-H3]], [[힉스필드]], [[GPT-코덱스]], [[클로드]]\n- **질문 기록:**\n  - [[자주-나온-질문]]\n  - [[세-사람이-있는-대화-찾기]]\n  - [[송년회-논의]]\n\n## Obsidian에서 보는 법\n- **그래프 보기 (Ctrl+G):** 폴더별 색으로 두 위키가 나뉘어 보입니다.\n- **백링크 패널:** 이 페이지를 가리키는 페이지가 보입니다.\n- **검색 (Ctrl+Shift+F):** 볼트 전체에서 찾습니다. 예: `tag:#도구`, `path:AI영상방 시댄스`\n- **새 페이지:** 템플릿 삽입(Alt+T)으로 `_templates/`의 틀을 씁니다.\n- **원문:** 각 폴더 `raw/`의 txt를 볼트에서 바로 열 수 있습니다.\n","lines":["카카오톡 대화로 만든 LLM Wiki의 시작 페이지입니다.","이 폴더(docs/kb) 전체가 하나의 Obsidian 볼트입니다.","내보내기 파일 하나가 폴더 하나입니다.","규칙은 CLAUDE, 볼트 전체 작업 기록은 log에 있습니다.","위키 · 원본 파일 · 개요 · 전체 목록 · 작업 기록 · 쪽수","--- · --- · --- · --- · --- · ---","AI영상방 · KakaoTalk_20261106_0943_31_784_group.txt · AI영상방-개요 · AI영상방-목차 · AI영상방-기록 · 36","아침인사방 · KakaoTalk_20261106_0929_17_298_group.txt · 아침인사방-개요 · 아침인사방-목차 · 아침인사방-기록 · 6","AI 영상 입문: 초보-시작-가이드 → 영상-모델-비교 → 크레딧-비용-절약","도구 평가: 시댄스, 클링, Wan, 미니맥스-H3, 힉스필드, GPT-코덱스, 클로드","질문 기록:","자주-나온-질문","세-사람이-있는-대화-찾기","송년회-논의","그래프 보기 (Ctrl+G): 폴더별 색으로 두 위키가 나뉘어 보입니다.","백링크 패널: 이 페이지를 가리키는 페이지가 보입니다.","검색 (Ctrl+Shift+F): 볼트 전체에서 찾습니다. 예: tag:#도구, path:AI영상방 시댄스","새 페이지: 템플릿 삽입(Alt+T)으로 _templates/의 틀을 씁니다.","원문: 각 폴더 raw/의 txt를 볼트에서 바로 열 수 있습니다."]},"log":{"name":"log","title":"볼트 작업 기록 (log)","folder":"볼트","tags":"기록","text":"볼트 작업 기록 (log)\n# 볼트 작업 기록 (log)\n\n- 볼트 전체에 걸친 작업을 적습니다. 추가만 합니다.\n- 파일별 작업은 각 폴더의 기록 페이지에 있습니다: [[AI영상방-기록]], [[아침인사방-기록]]\n- 형식: `## [YYYY-MM-DD] ingest|query|lint|setup | 제목`\n\n## [2026-11-06] ingest | 카카오톡 내보내기 2개\n- AI영상방(`KakaoTalk_20261106_0943`)과 아침인사방(`KakaoTalk_20261106_0929`)을 위키로 만들었습니다.\n- 처음에는 `카카오톡-wiki`에 한데 만들었다가, 파일별 폴더로 나눴습니다.\n\n## [2026-11-06] setup | LLM Wiki 볼트 구성\n- `docs/kb` 전체를 Obsidian 볼트 하나로 만들었습니다.\n- 폴더마다 같은 이름이던 overview·index·log를 볼트 안에서 겹치지 않는 이름으로 바꿨습니다.\n  - `<방>-개요`, `<방>-목차`, `<방>-기록`\n- 볼트 홈 [[index]]와 이 기록 페이지를 만들었습니다.\n- 다음을 추가했습니다.\n  - 도구: `_tools/` (점검, 검색, 카톡 통계)\n  - 템플릿: `_templates/`\n  - Claude 명령: `.claude/commands/`\n  - Obsidian 설정: `.obsidian/`\n\n## [2026-11-06] lint | 볼트 전체 점검\n- `_tools/kb_lint.py`로 점검했습니다.\n- 처음 결과: 오류 0건, 경고 6건\n  - sources에 줄 번호가 없는 페이지 4쪽 → 줄 범위를 넣었습니다.\n  - 목차에서만 연결된 자료 요약 2쪽 → 방 페이지에서 링크를 걸었습니다.\n- 고친 뒤: **페이지 40쪽(허브 제외), 오류 0건, 경고 0건**\n- 표 안에서 escape되지 않은 별칭 링크 1곳(미드저니)을 Obsidian 표에 맞게 고쳤습니다.\n\n## [2026-11-06] setup | Obsidian 설치와 볼트 등록\n- winget으로 Obsidian 1.15를 사용자 범위에 설치했습니다.\n- 이 폴더를 볼트 `kb`로 등록했습니다.\n- Obsidian이 볼트를 열면서 `workspace.json`을 만들었고, 시작 페이지로 [[index]]가 열렸습니다.\n","lines":["볼트 전체에 걸친 작업을 적습니다. 추가만 합니다.","파일별 작업은 각 폴더의 기록 페이지에 있습니다: AI영상방-기록, 아침인사방-기록","형식: ## [YYYY-MM-DD] ingest · query · lint · setup · 제목","AI영상방(KakaoTalk_20261106_0943)과 아침인사방(KakaoTalk_20261106_0929)을 위키로 만들었습니다.","처음에는 카카오톡-wiki에 한데 만들었다가, 파일별 폴더로 나눴습니다.","docs/kb 전체를 Obsidian 볼트 하나로 만들었습니다.","폴더마다 같은 이름이던 overview·index·log를 볼트 안에서 겹치지 않는 이름으로 바꿨습니다.","<방>-개요, <방>-목차, <방>-기록","볼트 홈 index와 이 기록 페이지를 만들었습니다.","다음을 추가했습니다.","도구: _tools/ (점검, 검색, 카톡 통계)","템플릿: _templates/","Claude 명령: .claude/commands/","Obsidian 설정: .obsidian/","_tools/kb_lint.py로 점검했습니다.","처음 결과: 오류 0건, 경고 6건","sources에 줄 번호가 없는 페이지 4쪽 → 줄 범위를 넣었습니다.","목차에서만 연결된 자료 요약 2쪽 → 방 페이지에서 링크를 걸었습니다.","고친 뒤: 페이지 40쪽(허브 제외), 오류 0건, 경고 0건","표 안에서 escape되지 않은 별칭 링크 1곳(미드저니)을 Obsidian 표에 맞게 고쳤습니다.","winget으로 Obsidian 1.15를 사용자 범위에 설치했습니다.","이 폴더를 볼트 kb로 등록했습니다.","Obsidian이 볼트를 열면서 workspace.json을 만들었고, 시작 페이지로 index가 열렸습니다."]},"README":{"name":"README","title":"docs/kb — 카카오톡 대화 LLM Wiki (Obsidian 볼트)","folder":"볼트","tags":"","text":"docs/kb — 카카오톡 대화 LLM Wiki (Obsidian 볼트)\n# docs/kb — 카카오톡 대화 LLM Wiki (Obsidian 볼트)\n\nAndrej Karpathy의 [LLM Wiki](https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f) 패턴으로 만든 지식 베이스입니다.\n- 사람은 카카오톡 내보내기 파일을 넣고 질문합니다. Claude가 위키를 쓰고 관리합니다.\n- **이 폴더 전체가 Obsidian 볼트 하나입니다.**\n\n## 구성\n| 위치 | 역할 |\n|---|---|\n| `index.md` | 볼트 홈 (Obsidian 북마크 1번) |\n| `log.md` | 볼트 전체 작업 기록 |\n| `CLAUDE.md` | **스키마.** 규칙과 넣기·묻기·점검 절차 |\n| `<방>_KakaoTalk_<날짜>_<시각>/` | 내보내기 파일 하나당 폴더 하나. `raw/` 원자료, `wiki/` 페이지 |\n| `_templates/` | Obsidian 템플릿 (entity, concept, source, analysis, log-entry) |\n| `_tools/` | 파이썬 도구: `kb_lint.py` 점검, `kb_search.py` 검색, `kakao_stats.py` 카톡 통계 |\n| `.claude/commands/` | Claude Code 명령: `/ingest`, `/query`, `/lint` |\n| `.obsidian/` | Obsidian 설정: 위키 링크, txt 표시, 템플릿, 그래프 색, 북마크 |\n\n| 위키 | 원본 파일 | 쪽수 |\n|---|---|---|\n| AI영상방 | `KakaoTalk_20261106_0943_31_784_group.txt` + 요약 md | 36 |\n| 아침인사방 | `KakaoTalk_20261106_0929_17_298_group.txt` | 6 |\n\n## Obsidian으로 보기\n- **설치:** 설치돼 있습니다 (1.15, `%LOCALAPPDATA%\\Programs\\Obsidian`). 이 폴더는 `kb`라는 볼트로 등록돼 있습니다.\n- **다시 열기:** 시작 메뉴에서 Obsidian을 엽니다. 다른 볼트가 열리면 왼쪽 아래 볼트 전환에서 `kb`를 고릅니다.\n- **그래프 (Ctrl+G):** 폴더별로 색이 다릅니다. 파랑은 AI영상방, 주황은 아침인사방, 회색은 자료 요약, 빨강은 홈과 기록입니다.\n- **새 페이지:** 만든 뒤 Alt+T로 템플릿을 넣습니다.\n- **선택 사항:** Dataview 같은 커뮤니티 플러그인은 설치하지 않았습니다. 필요하면 설정 → 커뮤니티 플러그인에서 직접 켜세요.\n\n## Claude로 관리하기\n`C:\\2026CC\\docs\\kb`에서 Claude Code를 열고 다음 명령을 씁니다.\n\n| 하고 싶은 것 | 명령 |\n|---|---|\n| 새 카톡 파일 넣기 | `/ingest KakaoTalk_….txt` (먼저 `C:\\2026CC\\카카오톡\\`에 저장) |\n| 질문하기 | `/query 실사 영상은 어떤 모델이 나아?` |\n| 점검하기 | `/lint` |\n\n직접 실행하려면:\n```bash\npython -I _tools/kb_lint.py .\n```\n```bash\npython -I _tools/kb_search.py . \"시댄스 대사\"\n```\n```bash\npython -I _tools/kakao_stats.py \"C:\\2026CC\\카카오톡\\KakaoTalk_….txt\"\n```\n","lines":["Andrej Karpathy의 [LLM Wiki](https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f) 패턴으로 만든 지식 베이스입니다.","사람은 카카오톡 내보내기 파일을 넣고 질문합니다. Claude가 위키를 쓰고 관리합니다.","이 폴더 전체가 Obsidian 볼트 하나입니다.","위치 · 역할","--- · ---","index.md · 볼트 홈 (Obsidian 북마크 1번)","log.md · 볼트 전체 작업 기록","CLAUDE.md · 스키마. 규칙과 넣기·묻기·점검 절차","<방>_KakaoTalk_<날짜>_<시각>/ · 내보내기 파일 하나당 폴더 하나. raw/ 원자료, wiki/ 페이지","_templates/ · Obsidian 템플릿 (entity, concept, source, analysis, log-entry)","_tools/ · 파이썬 도구: kb_lint.py 점검, kb_search.py 검색, kakao_stats.py 카톡 통계",".claude/commands/ · Claude Code 명령: /ingest, /query, /lint",".obsidian/ · Obsidian 설정: 위키 링크, txt 표시, 템플릿, 그래프 색, 북마크","위키 · 원본 파일 · 쪽수","--- · --- · ---","AI영상방 · KakaoTalk_20261106_0943_31_784_group.txt + 요약 md · 36","아침인사방 · KakaoTalk_20261106_0929_17_298_group.txt · 6","설치: 설치돼 있습니다 (1.15, %LOCALAPPDATA%\\Programs\\Obsidian). 이 폴더는 kb라는 볼트로 등록돼 있습니다.","다시 열기: 시작 메뉴에서 Obsidian을 엽니다. 다른 볼트가 열리면 왼쪽 아래 볼트 전환에서 kb를 고릅니다.","그래프 (Ctrl+G): 폴더별로 색이 다릅니다. 파랑은 AI영상방, 주황은 아침인사방, 회색은 자료 요약, 빨강은 홈과 기록입니다.","새 페이지: 만든 뒤 Alt+T로 템플릿을 넣습니다.","선택 사항: Dataview 같은 커뮤니티 플러그인은 설치하지 않았습니다. 필요하면 설정 → 커뮤니티 플러그인에서 직접 켜세요.","C:\\2026CC\\docs\\kb에서 Claude Code를 열고 다음 명령을 씁니다.","하고 싶은 것 · 명령","--- · ---","새 카톡 파일 넣기 · /ingest KakaoTalk_….txt (먼저 C:\\2026CC\\카카오톡\\에 저장)","질문하기 · /query 실사 영상은 어떤 모델이 나아?","점검하기 · /lint","직접 실행하려면:","bash","python -I _tools/kb_lint.py .","","bash","python -I _tools/kb_search.py . \"시댄스 대사\"","","bash","python -I _tools/kakao_stats.py \"C:\\2026CC\\카카오톡\\KakaoTalk_….txt\"",""]},"아침인사방-개요":{"name":"아침인사방-개요","title":"개요 — 아침인사방 (KakaoTalk_20261106_0929)","folder":"아침인사방","tags":"개요","text":"개요 — 아침인사방 (KakaoTalk_20261106_0929)\n# 개요 — 아침인사방 (KakaoTalk_20261106_0929)\n\n내보내기 파일 `KakaoTalk_20261106_0929_17_298_group.txt` 한 개로 만든 위키입니다.\n\n- **방:** [[아침인사방]]. 김선중, 최근화, 이상준 님 등이 있는 지인
