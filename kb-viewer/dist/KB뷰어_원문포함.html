<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KB 뷰어 (공유본)</title>
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --fg: #1f2430; --muted: #6b7280; --line: #e3e6eb;
  --accent: #3b6fd8; --accent-soft: #e8efff; --hl: #fff4c2; --chip: #eef1f5;
  --ai: #3b82f6; --am: #f59e0b; --vault: #e0525a; --src: #8b95a5;
  --mono: ui-monospace, Consolas, "D2Coding", monospace;
  --sans: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1b1f26; --fg: #e5e7eb; --muted: #9aa3af; --line: #2b313b;
    --accent: #7aa2ff; --accent-soft: #22304d; --hl: #4a3f12; --chip: #262c36;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1b1f26; --fg: #e5e7eb; --muted: #9aa3af; --line: #2b313b;
  --accent: #7aa2ff; --accent-soft: #22304d; --hl: #4a3f12; --chip: #262c36;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* 머리줄 */
header { position: sticky; top: 0; z-index: 10; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .brand { font-weight: 700; font-size: 17px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
header .brand small { color: var(--muted); font-weight: 400; font-size: 12px; }
.tabs { display: flex; gap: 4px; }
.tabs a { padding: 6px 12px; border-radius: 8px; color: var(--fg); white-space: nowrap; }
.tabs a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; text-decoration: none; }
.searchbox { flex: 1; display: flex; gap: 6px; max-width: 520px; margin-left: auto; }
.searchbox input[type=search] { flex: 1; min-width: 0; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.iconbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.menu-btn { display: none; }

/* 3단 배치 */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); height: calc(100dvh - 57px); }
aside.side { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 10px 8px 24px; }
main { overflow-y: auto; min-width: 0; }
.filter { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-bottom: 8px; }
details.folder { margin-bottom: 6px; }
details.folder > summary { list-style: none; cursor: pointer; padding: 6px 8px; border-radius: 8px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
details.folder > summary::-webkit-details-marker { display: none; }
details.folder > summary::before { content: "▸"; font-size: 11px; color: var(--muted); }
details.folder[open] > summary::before { content: "▾"; }
details.folder > summary .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
details.folder > summary .cnt { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.sec-label { font-size: 11.5px; color: var(--muted); margin: 8px 10px 2px; letter-spacing: .02em; }
.side a.pg { display: block; padding: 3px 10px 3px 22px; border-radius: 6px; color: var(--fg); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side a.pg:hover { background: var(--chip); text-decoration: none; }
.side a.pg.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side a.rawlink { display: block; padding: 3px 10px 3px 22px; font-size: 13px; color: var(--muted); }

/* 문서 화면 */
.page { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 24px; max-width: 1180px; margin: 0 auto; padding: 22px 28px 60px; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.props { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 4px 0 18px; display: grid; grid-template-columns: 80px 1fr; gap: 4px 12px; font-size: 13.5px; }
.props dt { color: var(--muted); }
.props dd { margin: 0; overflow-wrap: anywhere; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 0 9px; margin: 0 4px 3px 0; font-size: 12.5px; }
.type { font-weight: 600; }
article { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 26px 22px; overflow-wrap: anywhere; }
article h1 { font-size: 26px; margin: 18px 0 8px; line-height: 1.3; }
article h2 { font-size: 19px; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
article h3 { font-size: 16px; margin: 20px 0 6px; }
article p, article li { margin: 6px 0; }
article ul, article ol { padding-left: 22px; }
article blockquote { margin: 10px 0; padding: 8px 14px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
article code { font-family: var(--mono); font-size: 13px; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
article pre { background: var(--chip); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
article pre code { background: none; padding: 0; }
.tw { overflow-x: auto; margin: 10px 0; }
article table { border-collapse: collapse; width: 100%; font-size: 14px; }
article th, article td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
article th { background: var(--chip); font-weight: 600; white-space: nowrap; }
a.wl { border-bottom: 1px dashed transparent; }
a.wl.missing { color: var(--muted); text-decoration: line-through; }
a.lref { font-family: var(--mono); font-size: 12.5px; background: var(--chip); padding: 0 4px; border-radius: 4px; }
.rail { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 14px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.box h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.box ul { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.box li { padding: 2px 0; }
.box li small { color: var(--muted); }
.empty { color: var(--muted); font-size: 13.5px; }

/* 원문 화면 */
.rawview { max-width: 1100px; margin: 0 auto; padding: 18px 24px 40px; }
.rawbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--bg); padding: 8px 0 10px; }
.rawbar h2 { margin: 0 12px 0 0; font-size: 18px; }
.rawbar input, .rawbar select { padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.rawbar .hint { color: var(--muted); font-size: 13px; }
.lines { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font: 13px/1.55 var(--mono); padding: 6px 0; }
.ln { display: grid; grid-template-columns: 64px 1fr; padding: 0 12px 0 0; }
.ln b { color: var(--muted); font-weight: 400; text-align: right; padding-right: 14px; user-select: none; }
.ln span { white-space: pre-wrap; overflow-wrap: anywhere; }
.ln.on { background: var(--hl); }
.ln.date span { color: var(--accent); font-weight: 600; }
.ln.find span mark { background: var(--hl); color: inherit; }

/* 검색 화면 */
.wrap { max-width: 980px; margin: 0 auto; padding: 22px 24px 60px; }
.res { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin: 8px 0; }
.res .t { font-weight: 600; }
.res .s { color: var(--muted); font-size: 13.5px; margin-top: 3px; overflow-wrap: anywhere; }
.rawres { font: 13px/1.5 var(--mono); padding: 4px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.rawres a { margin-right: 8px; }

/* 그래프 */
.graphwrap { position: relative; height: 100%; }
#graph { width: 100%; height: 100%; display: block; cursor: grab; }
.legend { position: absolute; left: 16px; top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.legend div { display: flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.gtip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }

/* 통계 */
.room { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 18px; }
.room h2 { margin: 0 0 4px; font-size: 19px; }
.room .sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.tile b { display: block; font-size: 22px; }
.tile span { color: var(--muted); font-size: 12.5px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.charts h3 { font-size: 14px; margin: 0 0 8px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 160px; border-bottom: 1px solid var(--line); }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--muted); min-width: 0; }
.bars .b i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.bars .b:hover i { opacity: .75; }
.bars.hours { gap: 2px; height: 110px; }
.xl { display: flex; gap: 6px; font-size: 11px; color: var(--muted); }
.xl span { flex: 1; text-align: center; min-width: 0; overflow: hidden; white-space: nowrap; }
.xl.hours { gap: 2px; }
.hbar { display: grid; grid-template-columns: 150px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
.hbar .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar .track { background: var(--chip); border-radius: 4px; height: 12px; }
.hbar .track i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.hbar .c { text-align: right; color: var(--muted); }

/* 채팅 */
.chat { display: flex; flex-direction: column; height: 100%; max-width: 900px; margin: 0 auto; padding: 0 20px; }
.chat .msgs { flex: 1; overflow-y: auto; padding: 18px 0 10px; display: flex; flex-direction: column; gap: 14px; }
.chat .hello { text-align: center; color: var(--muted); margin: 40px 0 10px; }
.chat .hello h2 { color: var(--fg); margin: 0 0 6px; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.examples button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.examples button:hover { border-color: var(--accent); color: var(--accent); }
.bubble { max-width: 85%; border-radius: 16px; padding: 10px 14px; overflow-wrap: anywhere; }
.bubble.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
.bubble.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; max-width: 100%; }
.bubble.bot p:first-child { margin-top: 0; } .bubble.bot p:last-child { margin-bottom: 0; }
.bubble.bot ul, .bubble.bot ol { padding-left: 20px; margin: 6px 0; }
.bubble.bot table { border-collapse: collapse; font-size: 14px; } .bubble.bot th, .bubble.bot td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.bubble.err { align-self: flex-start; background: var(--hl); border: 1px solid var(--line); }
.bubble.wait { align-self: flex-start; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); }
.bubble .meta { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.bubble .meta a { background: var(--chip); border-radius: 999px; padding: 0 9px; }
.composer { display: flex; gap: 8px; padding: 10px 0 16px; border-top: 1px solid var(--line); background: var(--bg); }
.composer textarea { flex: 1; resize: none; min-height: 48px; max-height: 160px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font: inherit; color: inherit; }
.composer button { border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 0 18px; font-weight: 600; cursor: pointer; }
.composer button:disabled { opacity: .5; cursor: default; }
.composer-tip { font-size: 12px; color: var(--muted); margin: -10px 0 10px; display: flex; justify-content: space-between; gap: 8px; }
.composer-tip button { border: 0; background: none; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: 12px; }
@keyframes blink { 50% { opacity: .35; } } .bubble.wait span { animation: blink 1.2s infinite; }

@media (max-width: 1000px) { .page { grid-template-columns: 1fr; } .rail { position: static; } }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  aside.side { position: fixed; top: 57px; bottom: 0; left: 0; width: min(300px, 86vw); z-index: 20; transform: translateX(-102%); transition: transform .2s; box-shadow: 6px 0 24px rgba(0,0,0,.18); }
  body.drawer aside.side { transform: none; }
  .menu-btn { display: inline-block; }
  header { flex-wrap: wrap; }
  .searchbox { order: 3; max-width: none; flex-basis: 100%; }
  .page, .wrap, .rawview { padding: 14px 12px 40px; }
  article { padding: 4px 14px 16px; }
  .hbar { grid-template-columns: 100px 1fr 40px; }
}
</style>
</head>

20261106_0929","folderLabel":"아침인사방","file":"2026-11-06_아침인사방_KakaoTalk_0929.txt"}]},"labels":{"":"볼트","AI영상방_KakaoTalk_20261106_0943":"AI영상방","아침인사방_KakaoTalk_20261106_0929":"아침인사방"},"pages":{"CLAUDE":{"name":"CLAUDE","title":"CLAUDE.md — docs/kb LLM Wiki 스키마","folder":"","folderLabel":"볼트","section":"hub","path":"CLAUDE.md","fm":{},"sourcesHtml":[],"html":"<h1>CLAUDE.md — docs/kb LLM Wiki 스키마<\/h1>\n<p>이 폴더는 Andrej Karpathy의 <strong>LLM Wiki<\/strong> 패턴을 구현한 지식 베이스이자 <strong>Obsidian 볼트<\/strong>입니다.<\/p>\n<ul><li>원문: <a href=\"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f\" target=\"_blank\" rel=\"noopener\">https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f<\/a> (2026-04-04)<\/li><li>사람은 자료(카카오톡 내보내기)를 넣고 질문합니다. Claude는 위키를 쓰고, 고치고, 점검합니다.<\/li><li><strong>역할 비유:<\/strong> Obsidian은 IDE, Claude는 프로그래머, 위키는 코드베이스입니다.<\/li><\/ul>\n<h2>세 층<\/h2>\n<div class='tw'><table><thead><tr><th>층<\/th><th>위치<\/th><th>누가<\/th><th>규칙<\/th><\/tr><\/thead><tbody><tr><td>원자료<\/td><td><code>&lt;폴더&gt;/raw/<\/code><\/td><td>사람이 넣음<\/td><td><strong>고치지 않습니다.<\/strong> 내보낸 txt와 그 파일의 요약을 둡니다.<\/td><\/tr><tr><td>위키<\/td><td><code>&lt;폴더&gt;/wiki/<\/code><\/td><td>Claude<\/td><td>페이지를 만들고 고칩니다.<\/td><\/tr><tr><td>스키마<\/td><td>이 파일<\/td><td>함께<\/td><td>규칙이 바뀌면 여기를 고칩니다.<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>볼트 구조<\/h2>\n<pre><code>docs/kb/                      ← Obsidian 볼트 루트\n  index.md                    볼트 홈: 파일별 위키 표, 자주 찾는 페이지\n  log.md                      볼트 전체 작업 기록 (추가만)\n  CLAUDE.md                   이 스키마\n  README.md                   사람용 안내\n  _templates/                 Obsidian 템플릿 (entity, concept, source, analysis, query-log)\n  _tools/                     파이썬 도구 (표준 라이브러리만)\n  .claude/commands/           Claude Code 명령: /ingest /query /lint\n  .obsidian/                  Obsidian 설정\n  &lt;방&gt;_KakaoTalk_&lt;YYYYMMDD&gt;_&lt;HHMM&gt;/   내보내기 파일 하나당 폴더 하나\n    raw/                      원자료\n    wiki/\n      &lt;방&gt;-개요.md            이 파일의 전체 그림\n      &lt;방&gt;-목차.md            이 폴더의 모든 페이지 목록 (index 역할)\n      &lt;방&gt;-기록.md            이 폴더의 작업 기록 (log 역할)\n      entities/  concepts/  sources/  analyses/<\/code><\/pre>\n<ul><li><strong>원본 위치:<\/strong> 내보내기 원본은 <code>C:\\2026CC\\카카오톡\\<\/code>에 있습니다. 거기서 <code>raw/<\/code>로 복사합니다.<\/li><li><strong>이름 규칙:<\/strong> 볼트 전체에서 <strong>페이지 이름이 겹치면 안 됩니다.<\/strong> 위키 링크가 이름으로 찾기 때문입니다.<ul><li>그래서 개요·목차·기록 페이지에는 방 이름을 붙입니다.<\/li><li>새 페이지를 만들기 전에 <code>python -I _tools/kb_lint.py .<\/code>로 겹침을 확인합니다.<\/li><\/ul><\/li><li><strong>같은 도구가 여러 파일에 나오면:<\/strong><ul><li>기존 페이지(예: <a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a>)에 \"○○ 파일 기준\" 단락을 추가합니다.<\/li><li>페이지를 새로 만들어야 하면 <code>시댄스-아침인사방<\/code>처럼 이름을 다르게 합니다.<\/li><\/ul><\/li><\/ul>\n<h2>페이지 규칙<\/h2>\n<ul><li><strong>링크:<\/strong> <code>[[페이지]]<\/code>, <code>[[페이지|보이는 글]]<\/code><ul><li><strong>표 안에서는<\/strong> <code>[[페이지\\|보이는 글]]<\/code>처럼 <code>|<\/code>를 escape합니다.<\/li><\/ul><\/li><li><strong>머리 정보 (Obsidian Properties):<\/strong><\/li><\/ul>\n<pre><code>  ---\n  type: entity | concept | source | analysis | overview\n  tags: [도구, 영상모델]          # 공백 없는 낱말\n  rooms: [AI영상방]\n  sources: [src-AI영상방-대화 L41-99]\n  updated: YYYY-MM-DD\n  ---<\/code><\/pre>\n<ul><li><strong>본문 순서:<\/strong> 한 줄 정의 → 사실(표·목록, 줄 번호 <code>L1234<\/code>) → 관련 페이지<\/li><li><strong>믿는 순서:<\/strong> 원문 대화 &gt; 사람이 만든 요약. 가격·한도·버전은 \"○월 대화 기준\"이라고 적습니다.<\/li><li><strong>추정:<\/strong> \"(불확실)\"로 표시합니다. 회원 의견은 검증하지 않았다는 점을 밝힙니다.<\/li><\/ul>\n<h2>넣지 않는 것<\/h2>\n<ul><li>전화번호, 이메일, 실명, 주소, 계좌, 닉네임에 붙은 지역<\/li><li>AI 안전장치·검열 우회, 여러 계정으로 약관을 어기며 할인을 받는 방법, 저작권 필터 회피<\/li><li>선정적인 내용, 다툼에서 누구를 탓하는 서술, 노래 가사, 남의 글 전문 (인용은 15자 안팎으로 짧게)<\/li><\/ul>\n<h2>작업 흐름<\/h2>\n<h3>넣기 (ingest) — <code>/ingest &lt;파일&gt;<\/code><\/h3>\n<ol><li><code>C:\\2026CC\\카카오톡\\<\/code>의 새 txt를 <code>&lt;방&gt;_KakaoTalk_&lt;날짜&gt;_&lt;시각&gt;/raw/<\/code>로 복사합니다.<\/li><li><code>python -I _tools/kakao_stats.py &lt;txt&gt;<\/code>로 기간, 날짜 경계 줄, 메시지 수, 많이 말한 사람을 뽑습니다.<\/li><li>날짜 경계로 나눠 읽습니다. 2천 줄이 넘으면 기간별로 나눠 병렬로 읽습니다.<\/li><li><code>sources/src-…<\/code>, <code>entities/<\/code>, <code>concepts/<\/code>, <code>analyses/<\/code> 페이지를 만들거나 고칩니다. 템플릿은 <code>_templates/<\/code>에 있습니다.<\/li><li><code>&lt;방&gt;-목차<\/code>, <code>&lt;방&gt;-기록<\/code>, 볼트 <a class=\"wl\" href=\"#/page/index\">index<\/a>의 표, <a class=\"wl\" href=\"#/page/log\">log<\/a>를 고칩니다.<\/li><li><code>_tools/kb_lint.py<\/code>로 점검합니다.<\/li><\/ol>\n<h3>묻기 (query) — <code>/query &lt;질문&gt;<\/code><\/h3>\n<ol><li><a class=\"wl\" href=\"#/page/index\">index<\/a> → 해당 <code>&lt;방&gt;-목차<\/code>를 읽습니다. <code>python -I _tools/kb_search.py . &quot;&lt;낱말&gt;&quot;<\/code>로 찾습니다.<\/li><li>페이지를 읽고, 필요하면 <code>raw/<\/code> 원문 줄을 확인합니다.<\/li><li>페이지를 링크로 인용해 답합니다.<\/li><li>다시 쓸 만한 답은 <code>analyses/<\/code>에 페이지로 남기고, 목차와 기록에 추가합니다.<\/li><\/ol>\n<h3>점검 (lint) — <code>/lint<\/code><\/h3>\n<ol><li><code>python -I _tools/kb_lint.py .<\/code>를 실행합니다. 다음을 확인합니다.<ul><li>깨진 링크<\/li><li>고아 페이지<\/li><li>frontmatter 누락<\/li><li>이름 겹침<\/li><li>표 안 escape 안 된 별칭<\/li><li>줄 번호 없는 sources<\/li><\/ul><\/li><li>직접 읽고 다음을 확인합니다.<ul><li>모순<\/li><li>낡은 가격·버전<\/li><li>자주 나오는데 페이지가 없는 개념<\/li><\/ul><\/li><li>고칠 것은 고치고, 나머지는 기록 페이지에 제안으로 남깁니다.<\/li><\/ol>\n<p>기록 형식: <code>## [YYYY-MM-DD] ingest|query|lint|setup | 제목<\/code> 최근 기록 보기: <code>Select-String &#x27;^## \\[&#x27; log.md | Select-Object -Last 5<\/code><\/p>","backlinks":[{"name":"index","title":"KB 홈 (index)","folder":"볼트"}],"outgoing":[{"name":"index","title":"KB 홈 (index)","exists":true},{"name":"log","title":"볼트 작업 기록 (log)","exists":true},{"name":"시댄스","title":"시댄스 (Seedance)","exists":true}]},"index":{"name":"index","title":"KB 홈 (index)","folder":"","folderLabel":"볼트","section":"hub","path":"index.md","fm":{"type":"overview","tags":["목차","홈"],"updated":"2026-11-06"},"sourcesHtml":[],"html":"<h1>KB 홈 (index)<\/h1>\n<p>카카오톡 대화로 만든 <strong>LLM Wiki<\/strong>의 시작 페이지입니다.<\/p>\n<ul><li>이 폴더(<code>docs/kb ls/kb_lint.py<\/code>로 점검했습니다.<\/li><li>처음 결과: 오류 0건, 경고 6건<ul><li>sources에 줄 번호가 없는 페이지 4쪽 → 줄 범위를 넣었습니다.<\/li><li>목차에서만 연결된 자료 요약 2쪽 → 방 페이지에서 링크를 걸었습니다.<\/li><\/ul><\/li><li>고친 뒤: <strong>페이지 40쪽(허브 제외), 오류 0건, 경고 0건<\/strong><\/li><li>표 안에서 escape되지 않은 별칭 링크 1곳(미드저니)을 Obsidian 표에 맞게 고쳤습니다.<\/li><\/ul>\n<h2>[2026-11-06] setup | Obsidian 설치와 볼트 등록<\/h2>\n<ul><li>winget으로 Obsidian 1.15를 사용자 범위에 설치했습니다.<\/li><li>이 폴더를 볼트 <code>kb<\/code>로 등록했습니다.<\/li><li>Obsidian이 볼트를 열면서 <code>workspace.json<\/code>을 만들었고, 시작 페이지로 <a class=\"wl\" href=\"#/page/index\">index<\/a>가 열렸습니다.<\/li><\/ul>","backlinks":[{"name":"CLAUDE","title":"CLAUDE.md — docs/kb LLM Wiki 스키마","folder":"볼트"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"}],"outgoing":[{"name":"AI영상방-기록","title":"작업 기록 (log) — AI영상방","exists":true},{"name":"index","title":"KB 홈 (index)","exists":true},{"name":"아침인사방-기록","title":"작업 기록 (log) — 아침인사방","exists":true}]},"README":{"name":"README","title":"docs/kb — 카카오톡 대화 LLM Wiki (Obsidian 볼트)","folder":"","folderLabel":"볼트","section":"hub","path":"README.md","fm":{},"sourcesHtml":[],"html":"<h1>docs/kb — 카카오톡 대화 LLM Wiki (Obsidian 볼트)<\/h1>\n<p>Andrej Karpathy의 <a href=\"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f\" target=\"_blank\" rel=\"noopener\">LLM Wiki<\/a> 패턴으로 만든 지식 베이스입니다.<\/p>\n<ul><li>사람은 카카오톡 내보내기 파일을 넣고 질문합니다. Claude가 위키를 쓰고 관리합니다.<\/li><li><strong>이 폴더 전체가 Obsidian 볼트 하나입니다.<\/strong><\/li><\/ul>\n<h2>구성<\/h2>\n<div class='tw'><table><thead><tr><th>위치<\/th><th>역할<\/th><\/tr><\/thead><tbody><tr><td><code>index.md<\/code><\/td><td>볼트 홈 (Obsidian 북마크 1번)<\/td><\/tr><tr><td><code>log.md<\/code><\/td><td>볼트 전체 작업 기록<\/td><\/tr><tr><td><code>CLAUDE.md<\/code><\/td><td><strong>스키마.<\/strong> 규칙과 넣기·묻기·점검 절차<\/td><\/tr><tr><td><code>&lt;방&gt;_KakaoTalk_&lt;날짜&gt;_&lt;시각&gt;/<\/code><\/td><td>내보내기 파일 하나당 폴더 하나. <code>raw/<\/code> 원자료, <code>wiki/<\/code> 페이지<\/td><\/tr><tr><td><code>_templates/<\/code><\/td><td>Obsidian 템플릿 (entity, concep src-아침인사방-대화 L5-190"],"updated":"2026-11-06"},"sourcesHtml":["src-아침인사방-대화 <a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=5-190\" title=\"원문 5~190줄 보기\">L5-190<\/a>"],"html":"<h1>아침 인사 글<\/h1>\n<p><a class=\"wl\" href=\"#/page/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9\">아침인사방<\/a>에서 안형종 님이 새벽마다 올리는 짧은 글입니다.<\/p>\n<ul><li>모든 글이 \"♡좋은 아침 ~^^~\"으로 끝납니다.<\/li><li>전문은 원자료(<code>raw/<\/code>)에서 보고, 이 페이지에는 주제만 요약합니다.<\/li><\/ul>\n<div class='tw'><table><thead><tr><th>날짜<\/th><th>시각<\/th><th>주제<\/th><th>한 줄 요약<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8/26 (수)<\/td><td>6:06<\/td><td>관계 정리<\/td><td>나를 계속 힘들게 하는 관계와는 거리를 두는 것도 나를 지키는 지혜<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=5-21\" title=\"원문 5~21줄 보기\">L5-21<\/a><\/td><\/tr><tr><td>8/27 (목)<\/td><td>6:03<\/td><td>꾸준함<\/td><td>빠르게보다 지치지 않는 속도로 꾸준히 가는 것이 성장의 힘<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=23-39\" title=\"원문 23~39줄 보기\">L23-39<\/a><\/td><\/tr><tr><td>8/28 (금)<\/td><td>6:42<\/td><td>말의 세 가지 문<\/td><td>탈무드: 사실인가, 필요한가, 친절한가. 피곤한 금요일에 말조심<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=41-58\" title=\"원문 41~58줄 보기\">L41-58<\/a><\/td><\/tr><tr><td>9/21 (월)<\/td><td>5:56<\/td><td>배움과 배려<\/td><td>공자의 배움, 천 리 길도 한 걸음부터, 배려가 나를 아름답게 함<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=60-80\" title=\"원문 60~80줄 보기\">L60-80<\/a><\/td><\/tr><tr><td>9/22 (화)<\/td><td>5:56<\/td><td>환절기 건강<\/td><td>일교차가 큰 날씨, 겉옷과 따뜻한 물로 감기 조심<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=82-104\" title=\"원문 82~104줄 보기\">L82-104<\/a><\/td><\/tr><tr><td>9/23 (수)<\/td><td>6:03<\/td><td>한가위 덕담<\/td><td>나눔, 가족, 감사. \"더도 말고 덜도 말고 한가위만 같아라\"<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=106-133\" title=\"원문 106~133줄 보기\">L106-133<\/a><\/td><\/tr><tr><td>11/4 (수)<\/td><td>5:52<\/td><td>희망<\/td><td>『마지막 잎새』처럼 따뜻한 말 한마디가 누군가의 희망이 됨<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=137-153\" title=\"원문 137~153줄 보기\">L137-153<\/a><\/td><\/tr><tr><td>11/5 (목)<\/td><td>5:53<\/td><td>인연<\/td><td>좋은 인연은 간직하고, 아픈 인연은 교훈으로, 고마운 인연엔 감사<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=155-164\" title=\"원문 155~164줄 보기\">L155-164<\/a><\/td><\/tr><tr><td>11/6 (금)<\/td><td>5:57<\/td><td>불금<\/td><td>일할 땐 프로답게, 쉴 땐 신나게. 평범한 하루를 즐겁게<\/td><td><a class=\"lref\" href=\"#/raw/%EC%95%84%EC%B9%A8%EC%9D%B8%EC%82%AC%EB%B0%A9_KakaoTalk_20261106_0929?l=166-190\" title=\"원문 166~190줄 보기\">L166-190<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>주제 묶음<\/h2>\n<ul><li><strong>사람·관계:<\/strong> 8/26 관계 정리, 8/28 말조심, 11/5 인연<\/li><li><strong>성장·배움:<\/strong> 8/27 꾸준함, 9/21 배움<\/li><li><strong>계절·명절:<\/strong> 9/22 환절기, 9/23 한가위<\/li><li><strong>위로·응원:<\/strong> 11/4 희망, 11/6 불금<\/li><\/ul>\n<h2>인용된 출처<\/h2>\n<ul><li>탈무드 (말의 세 가지 문)<\/li><li>공자 『논어』 (\"배우고 때때로 익히면…\")<\/li><li>속담 \"천 리 길도 한 걸음부터\", \"더도 말고 덜도 말고 한가위만 같아라\"<\/li><li>오 헨리 『마지막 잎새』<\/li><\/ul>","backlinks":[{"name":"아침인사방-개요","title":"개요 — 아침인사방 (KakaoTalk_20261106_0929)","folder":"아침인사방"},{"name":"아침인사방-목차","title":"목차 (index) — 아침인사방","folder":"아침인사방"},{"name":"아침인사방","title":"아침인사방 (지인 단톡방)","folder":"아침인사방"},{"name":"src-아침인사방-대화","title":"자료 요약: 아침인사방 대화 내보내기","folder":"아침인사방"},{"name":"아침인사방-기록","title":"작업 기록 (log) — 아침인사방","folder":"아침인사방"}],"outgoing":[{"name":"아침인사방","title":"아침인사방 (지인 단톡방)","exists":true}]},"아침인사방":{"name":"아침인사방","title":"아침인사방 (지인 단톡방)","folder":"아침인사방_KakaoTalk_20261106_0929","folderLabel":"아침인사방","section":"entities","path":"아침인사방_KakaoTalk_20261106_0929/wiki/entities/아침인사방.md", /a> 2.0 / mini<\/td><td>2D 애니가 더 깔끔<\/td><td>2.5와 색감이 다름<\/td><td>2.5의 절반 이하<\/td><td>애니메이션<\/td><\/tr><tr><td><a class=\"wl\" href=\"#/page/%ED%83%91%EB%B7%B0-T1\">탑뷰-T1<\/a><\/td><td>2.5와 거의 같은 품질<\/td><td>Topview 전용<\/td><td>15초 15크레딧<\/td><td>2.5 대안<\/td><\/tr><tr><td><a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A7%81\">클링<\/a><\/td><td>실사, 캐릭터 일관성<\/td><td>액션<\/td><td>–<\/td><td>실사 드라마<\/td><\/tr><tr><td><a class=\"wl\" href=\"#/page/Wan\">Wan<\/a> 3.0<\/td><td>애니, 가성비, 30초를 한 번에<\/td><td>시댄스보다 조금 부족<\/td><td>초당 15크레딧 (motionmux)<\/td><td>긴 애니 컷<\/td><\/tr><tr><td><a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스-H3<\/a><\/td><td><strong>가장 쌈<\/strong>, MV·세로 숏폼, 로컬 가능<\/td><td>액션, 한글 글자, 지글거림<\/td><td>최저<\/td><td>뮤직비디오, 대량 생성<\/td><\/tr><tr><td><a class=\"wl\" href=\"#/page/%EB%AE%A4%EC%A6%88-AI\">뮤즈-AI<\/a><\/td><td>무료, 4K, 색감<\/td><td>통제가 어렵고 디지털 느낌<\/td><td>무료<\/td><td>실험<\/td><\/tr><tr><td><a class=\"wl\" href=\"#/page/%EA%B7%B8%EB%A1%9D\">그록<\/a><\/td><td>영상은 잘 나옴<\/td><td>엉뚱한 동작<\/td><td>–<\/td><td>보조<\/td><\/tr><tr><td><a class=\"wl\" href=\"#/page/Flow\">Flow<\/a> (옴니)<\/td><td>무료 연습, 립싱크 괜찮음<\/td><td>워터마크<\/td><td>매일 50크레딧 무료<\/td><td>입문<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>한 줄 요약 (11/5, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5270-5274\" title=\"원문 5270~5274줄 보기\">L5270-5274<\/a>)<\/h2>\n<blockquote>실사는 클링, 애니는 Wan, 뮤비는 미니맥스. 가장 좋은 건 시댄스지만 비싸다.<\/blockquote>\n<h2>플랫폼 고르기<\/h2>\n<ul><li><strong>모델을 먼저 고르고, 플랫폼은 그다음입니다.<\/strong><\/li><li><a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a>: 여러 모델을 모은 곳<\/li><li><a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a>: 시댄스 공식 홈. 싸지만 제약이 많음<\/li><li><a class=\"wl\" href=\"#/page/%EB%9F%B0%EC%9B%A8%EC%9D%B4\">런웨이<\/a>: 무제한 종료<\/li><li>자세한 내용은 <a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a>에 있습니다.<\/li><\/ul>\n<h2>참고 영 B0%A9_KakaoTalk_20261106_0943?l=5962-6160\" title=\"원문 5962~6160줄 보기\">L5962-6160<\/a>"],"html":"<h1>자주 나온 질문 (AI영상방)<\/h1>\n<div class='tw'><table><thead><tr><th>질문<\/th><th>방 안 답<\/th><th>줄<\/th><th>더 보기<\/th><\/tr><\/thead><tbody><tr><td>완전 초보는 뭐부터?<\/td><td>GPT에 익숙해진 뒤 Flow 무료로 연습, 고가 강의는 비추천<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3557-3673\" title=\"원문 3557~3673줄 보기\">L3557-3673<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EC%B4%88%EB%B3%B4-%EC%8B%9C%EC%9E%91-%EA%B0%80%EC%9D%B4%EB%93%9C\">초보-시작-가이드<\/a><\/td><\/tr><tr><td>월 10만 원이면 얼마나?<\/td><td>시댄스 기준 약 2분 30초~3분<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5442-5523\" title=\"원문 5442~5523줄 보기\">L5442-5523<\/a><\/td><td><a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a><\/td><\/tr><tr><td>어떤 플랫폼?<\/td><td>모델 먼저, 플랫폼은 그다음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5530-5530\" title=\"원문 5530~5530줄 보기\">L5530<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/td><\/tr><tr><td>애니는 어디서?<\/td><td>힉스필드의 시댄스 추천. 드리미나는 시댄스만 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5443-5445\" title=\"원문 5443~5445줄 보기\">L5443-5445<\/a><\/td><td><a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a><\/td><\/tr><tr><td>GPT와 클로드 중 뭐가 나음?<\/td><td>이미지·사용량은 GPT, 스토리·코드는 클로드<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5011-5044\" title=\"원문 5011~5044줄 보기\">L5011-5044<\/a><\/td><td><a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT-코덱스<\/a>, <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C\">클로드<\/a><\/td><\/tr><tr><td>GPT와 Codex는 한도를 같이 씀?<\/td><td>따로. 이미지 결과는 같음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1148-1149\" title=\"원문 1148~1149줄 보기\">L1148-1149<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5082-5104\" title=\"원문 5082~5104줄 보기\">L5082-5104<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EC%82%AC%EC%9A%A9%EB%9F%89-%EA%B4%80%EB%A6%AC\">사용량-관리<\/a><\/td><\/tr><tr><td>Flow 영상을 상업적으로 써도 됨?<\/td><td>됨. 단 워터마크 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3235-3244\" title=\"원문 3235~3244줄 보기\">L3235-3244<\/a><\/td><td><a class=\"wl\" href=\"#/page/Flow\">Flow<\/a><\/td><\/tr><tr><td>힉스필드 MCP는 결제해야 함?<\/td><td>연결은 무료, 생성은 크레딧<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5057-5059\" title=\"원문 5057~5059줄 보기\">L5057-5059<\/a><\/td><td><a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C-MCP-%ED%99%9C%EC%9A%A9\">클로드-MCP-활용<\/a><\/td><\/tr><tr><td>'힉스 Pro' 메일이 왔다<\/td><td>홈페이지에 없는 요금제, 사기 의심<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5978-5981\" title=\"원문 5978~5981줄 보기\">L5978-5981<\/a><\/td><td><a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a><\/td><\/tr><tr><td>건물·풍경 카메라 무빙은?<\/td><td>어느 모델이든 비슷함. Blender 프리비즈가 최선<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5093-5096\" title=\"원문 5093~5096줄 보기\">L5093-5096<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스-H3<\/a><\/td><\/tr><tr><td>캐릭터 시트를 인체 비율이 안 깨지게 하려면?<\/td><td>요소를 중복하지 않기, 참고 영상 보기<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5421-5439\" title=\"원문 5421~5439줄 보기\">L5421-5439<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EC%BA%90%EB%A6%AD%ED%84%B0-%EC%8B%9C%ED%8A%B8\">캐릭터-시트<\/a><\/td><\/tr><tr><td>캡컷으로 내보내면 울렁거린다<\/td><td>24fps로 내보내기<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=302-306\" title=\"원문 302~306줄 보기\">L302-306<\/a><\/td><td><a class=\"wl\" href=\"#/page/%ED%8E%B8%EC%A7%91-%ED%88%B4\">편집-툴<\/a><\/td><\/tr><tr><td>한글 글자가 나오나?<\/td><td>복불복<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=26-38\" title=\"원문 26~38줄 보기\">L26-38<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스-H3<\/a><\/td><\/tr><tr><td>로컬 LLM과 영상 중 VRAM을 더 먹는 것?<\/td><td>LLM<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5-7\" title=\"원문 5~7줄 보기\">L5-7<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a><\/td><\/tr><tr><td>맥스튜디오와 일반 PC의 차이?<\/td><td>영상은 엔비디아가 빠름<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=819-850\" title=\"원문 819~850줄 보기\">L819-850<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a><\/td><\/tr><tr><td>유튜브 멤버십 버튼이 없다<\/td><td>수익창출 뒤 1~2일, 별도 심사<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=353-365\" title=\"원문 353~365줄 보기\">L353-365<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EC%87%BC%EC%B8%A0-%EC%97%85%EB%A1%9C%EB%93%9C-%EC%A0%84%EB%9E%B5\">쇼츠-업로드-전략<\/a><\/td><\/tr><tr><td>드래프트를 1080p로 올리면 더 깨져 보임<\/td><td>원인 불명, 못 느꼈다는 사람도 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5962-5971\" title=\"원문 5962~5971줄 보기\">L5962-5971<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a><\/td><\/tr><tr><td>드리미나의 시댄스와 다른 곳의 시댄스는 다른가?<\/td><td>공식 홈과 남의 툴이라 특징이 다름<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6158-6160\" title=\"원문 6158~6160줄 보기\">L6158-6160<\/a><\/td><td><a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84% alyses","path":"AI영상방_KakaoTalk_20261106_0943/wiki/analyses/초보-시작-가이드.md","fm":{"type":"analysis","tags":["가이드","초보"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L2503-2743 L3557-3676 L3808-3813 L5442-5530"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2503-2743\" title=\"원문 2503~2743줄 보기\">L2503-2743<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3557-3676\" title=\"원문 3557~3676줄 보기\">L3557-3676<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3808-3813\" title=\"원문 3808~3813줄 보기\">L3808-3813<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5442-5530\" title=\"원문 5442~5530줄 보기\">L5442-5530<\/a>"],"html":"<h1>초보 시작 가이드 (방 안 답변 종합)<\/h1>\n<p>AI 영상을 처음 시작하는 사람에게 방에서 실제로 해 준 조언을 순서대로 묶었습니다.<\/p>\n<h2>1단계: LLM과 친해지기<\/h2>\n<ul><li><strong>GPT 무료판<\/strong>부터 써 봅니다. 이미지를 그릴 수 있고 사용량이 넉넉해서 초보에게 권합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3563-3602\" title=\"원문 3563~3602줄 보기\">L3563-3602<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3808-3813\" title=\"원문 3808~3813줄 보기\">L3808-3813<\/a>). → <a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT-코덱스<\/a><\/li><li><strong>코딩은 몰라도 됩니다.<\/strong> \"그냥 대화하면 된다\"는 답이었습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3668-3673\" title=\"원문 3668~3673줄 보기\">L3668-3673<\/a>).<\/li><\/ul>\n<h2>2단계: 무료로 연습하기<\/h2>\n<ul><li><a class=\"wl\" href=\"#/page/Flow\">Flow<\/a>의 매일 무료 크레딧으로 짧은 영상을 만들어 봅니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3230-3244\" title=\"원문 3230~3244줄 보기\">L3230-3244<\/a>).<\/li><li>편집은 <a class=\"wl\" href=\"#/page/%ED%8E%B8%EC%A7%91-%ED%88%B4\">캡컷<\/a>으로 시작합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3601-3601\" title=\"원문 3601~3601줄 보기\">L3601<\/a>).<\/li><\/ul>\n<h2>3단계: 모델과 예산 정하기<\/h2>\n<ul><li><a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a>를 보고 모델을 먼저 정한 뒤 플랫폼을 고릅니다.<\/li><li><strong>예: 월 10만 원<\/strong>이면 <a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a> 기준 약 2분 30초~3분입니다 (대학 과제 상담, 11월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5442-5523\" title=\"원문 5442~5523줄 보기\">L5442-5523<\/a>).<\/li><li>저화질로 여러 모델을 시험해 본 뒤 고릅니다 → <a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a><\/li><\/ul>\n<h2>하지 말 것<\/h2>\n<ul><li><strong>고가 유료 강의 (300만 원 등):<\/strong> 대부분 말렸고, 방에서는 문의도 금지입니다. 대신 다음을 권했습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2503-2743\" title=\"원문 2503~2743줄 보기\">L2503-2743<\/a>).<ul><li>구독료로 직접 해 보기<\/li><li>방장 영상<\/li><li>지자체 무료 교육<\/li><\/ul><\/li><li><strong>외주로 비싸게 사기:<\/strong> 광고 영상을 외주로 50만 원에 산 사례에는 비싸다는 반응이 많았습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3557-3676\" title=\"원문 3557~3676줄 보기\">L3557-3676<\/a>).<\/li><\/ul>\n<h2>다음에 볼 것<\/h2>\n<ul><li><a class=\"wl\" href=\"#/page/%EC%BA%90%EB%A6%AD%ED%84%B0-%EC%8B%9C%ED%8A%B8\">캐릭터-시트<\/a><\/li><li><a class=\"wl\" href=\"#/page/%EB%8C%80%EC%82%AC%EC%99%80-%EB%AA%A9%EC%86%8C%EB%A6%AC\">대사와-목소리<\/a><\/li><li><a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a><\/li><li><a class=\"wl\" href=\"#/page/%EC%9E%90%EC%A3%BC-%EB%82%98%EC%98%A8-%EC%A7%88%EB%AC%B8\">자주-나온-질문<\/a><\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"Flow","title":"Flow (구글)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943) ss=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4500-4545\" title=\"원문 4500~4545줄 보기\">L4500-4545<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4879-4882\" title=\"원문 4879~4882줄 보기\">L4879-4882<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5196-5240\" title=\"원문 5196~5240줄 보기\">L5196-5240<\/a>"],"html":"<h1>AI영상방 규칙과 운영 기록<\/h1>\n<h2>규칙<\/h2>\n<div class='tw'><table><thead><tr><th>규칙<\/th><th>근거<\/th><\/tr><\/thead><tbody><tr><td>닉네임은 \"닉네임/지역\" 형식 (방장 공지를 보고 바꾸는 회원들)<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2714-2714\" title=\"원문 2714~2714줄 보기\">L2714<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3717-3717\" title=\"원문 3717~3717줄 보기\">L3717<\/a><\/td><\/tr><tr><td><strong>고액 유료 강의는 추천도 문의도 금지<\/strong> (방장, 9/21)<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2690-2690\" title=\"원문 2690~2690줄 보기\">L2690<\/a><\/td><\/tr><tr><td>외부 투표·추천 홍보는 방장 허락을 받은 뒤 링크만 공유. 좋아요는 자유<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2866-2880\" title=\"원문 2866~2880줄 보기\">L2866-2880<\/a><\/td><\/tr><tr><td>자기 작품 링크(외부 플랫폼)는 방장에게 먼저 확인<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4879-4882\" title=\"원문 4879~4882줄 보기\">L4879-4882<\/a><\/td><\/tr><tr><td>남이 공유한 이미지를 쓸 때는 출처를 밝힘 (\"공유방이니 자유롭게, 출처는 말해 달라\")<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=680-690\" title=\"원문 680~690줄 보기\">L680-690<\/a><\/td><\/tr><tr><td>연락처 같은 개인정보가 노출되면 지움<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3631-3632\" title=\"원문 3631~3632줄 보기\">L3631-3632<\/a><\/td><\/tr><tr><td>노출이 있거나 선정적인 이미지는 올리지 않음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5196-5240\" title=\"원문 5196~5240줄 보기\">L5196-5240<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>운영 기록 (중립적으로 정리)<\/h2>\n<ul><li><strong>9/21 고가 강의 문의:<\/strong> 약 300만 원짜리 강의를 들어도 되는지 묻는 질문에 대부분 말렸습니다. 이후 방장이 고액 강의 금지를 공지했습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2503-2743\" title=\"원문 2503~2743줄 보기\">L2503-2743<\/a>).<\/li><li><strong>9/23 오후 말다툼:<\/strong> 참여자 사이에 언쟁이 있었습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4500-4545\" title=\"원문 4500~4545줄 보기\">L4500-4545<\/a>).<ul><li>관리자가 메시지 여러 건을 가렸고, 한 참여자가 내보내졌습니다.<\/li><li>이후 사과가 오가며 분위기가 진정됐습니다.<\/li><\/ul><\/li><li><strong>11월 카카오 이용 정지 사례:<\/strong> 한 회원이 직접 그린 그림 때문에 카카오에서 1주일 이용 정지를 받았다고 말했습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5196-5217\" title=\"원문 5196~5217줄 보기\">L5196-5217<\/a>).<ul><li>예전에도 비슷한 정지 사례가 있었다고 합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5202-5202\" title=\"원문 5202~5202줄 보기\">L5202<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5239-5239\" title=\"원문 5239~5239줄 보기\">L5239<\/a>).<\/li><li>방 안 결론은 \"사진·영상은 안전한 것만 올리자\"였습니다.<\/li><\/ul><\/li><li><strong>가려진 메시지:<\/strong> 기간 중 \"관리자가 메시지를 가렸습니다\"가 여러 번 나옵니다. 사유는 기록에 없습니다.<\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/AI%EC%98%81%EC%83%81%EB%B0%A9\">AI영상방<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"}],"outgoing":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","exists":true}]},"대사와-목소리":{"name":"대사와-목소리","title":"대사와 목소리","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/대사와-목소리.md","fm":{"type":"concept","tags":["영상","음성"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L422-426 L1120-1121 L4372 L4399-4435 L5145-5178 L5382-5411 L5975-6013"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=422-426\" title=\"원문 422~426줄 보기\">L422-426<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1120-1121\" title=\"원문 1120~1121줄 보기\">L1120-1121<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4372-4372\" title=\"원문 4372~4372줄 보기\">L4372<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4399-4435\" title=\"원문 4399~4435줄 보기\">L4399-4435<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5145-5178\" title=\"원문 5145~5178줄 보기\">L5145-5178<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5382-5411\" title=\"원문 5382~5411줄 보기\">L5382-5411<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5975-6013\" title=\"원문 5975~6013줄 보기\">L5975-6013<\/a>"],"html":"<h1>대사와 목소리<\/h1>\n<h2>대사 발음 개선 (<a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a>, 방장, 11월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5145-5149\" title=\"원문 5145~5149줄 보기\">L5145-5149<\/a>)<\/h2>\n<ul><li>시댄스는 대사에 한계가 있습니다.<\/li><li><strong>여러 번 뽑거나 duration을 넉넉히<\/strong> 줍니다.<\/li><li>대사는 <strong>소리 나는 대로<\/strong> 적습니다. 예: \"C급\" → \"씨끕\"<\/li><\/ul>\n<h2>잘못 나온 대사만 고치기: Runa의 스킬 (11월)<\/h2>\n<ul><li>영상은 그대로 두고, 이상한 대사 음성만 골라 바꾸는 <strong>클로드 로컬 스킬<\/strong>입니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5159-5178\" title=\"원문 5159~5178줄 보기\">L5159-5178<\/a>).<ul><li>로컬에서 돌아가 비용이 들지 않습니다.<\/li><li>시댄스 억양도 잡습니다.<\/li><\/ul><\/li><li>11/5 밤에 구글 드라이브로 배포했습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6005-6005\" title=\"원문 6005~6005줄 보기\">L6005<\/a>).<ul><li>압축을 풀고 안의 TXT 안내대로 진행합니다.<\/li><li><strong>한국어만<\/strong> 지원합니다.<\/li><\/ul><\/li><li>RunningHub 워크플로로 만든 립싱크 도구도 있습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4843-4860\" title=\"원문 4843~4860줄 보기\">L4843-4860<\/a>).<\/li><li><strong>주의:<\/strong> 회원이 올린 파일이므로 실행하기 전에 내용을 확인하세요.<\/li><\/ul>\n<h2>목소리 지정 (Mr.HAN)<\/h2>\n<ul><li><strong>처음 만들 때<\/strong> 음성 레퍼런스를 넣는 것이 가장 효율적입니다. 나중에 바꾸려면 해당 구간을 잘라 립싱크를 다시 해야 합니다 (8월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=422-426\" title=\"원문 422~426줄 보기\">L422-426<\/a>).<\/li><li>원하는 말투를 내려면 음성을 레퍼런스로 넣어 음색과 말투를 따르게 합니다 (9월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4372-4372\" title=\"원문 4372~4372줄 보기\">L4372<\/a>).<\/li><li><strong>보이스 클로닝 도구:<\/strong> Supertone Play, Vrew, ElevenLabs (판도라고 정리, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4399-4435\" title=\"원문 4399~4435줄 보기\">L4399-4435<\/a>)<\/li><li><strong>Typecast:<\/strong> 성우 \"필재\"가 언급됐습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5542-5542\" title=\"원문 5542~5542줄 보기\">L5542<\/a>).<\/li><li><strong>튜니:<\/strong> 무료 버전은 립싱크가 맞지 않습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1120-1121\" title=\"원문 1120~1121줄 보기\">L1120-1121<\/a>).<\/li><\/ul>\n<h2>슬로우 효과 (ai공부중1, 11월)<\/h2>\n<ul><li>음성을 분리한 뒤 영상에만 슬로우를 겁니다.<\/li><li>입모양이 보이는 구간은 음성도 함께 늦춰야 합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5397-5397\" title=\"원문 5397~5397줄 보기\">L5397<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5402-5402\" title=\"원문 5402~5402줄 보기\">L5402<\/a>).<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방"}],"outgoing":[{"name":"시댄스","title":"시댄스 (Seedance)","exists":true}]},"로컬-영상-생성":{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/로컬-영상-생성.md","fm":{"type":"concept","tags":["로컬","하드웨어","워크플로"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L5-26 L127-138 L370-420 L575-740 L815-850 L1347-1400 L2477 L3134-3166 L4049-4050 L5334-5336 L6193-6194"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5-26\" title=\"원문 5~26줄 보기\">L5-26<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=127-138\" title=\"원문 127~138줄 보기\">L127-138<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=370-420\" title=\"원문 370~420줄 보기\">L370-420<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=575-740\" title=\"원문 575~740줄 보기\">L575-740<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=815-850\" title=\"원문 815~850줄 보기\">L815-850<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1347-1400\" title=\"원문 1347~1400줄 보기\">L1347-1400<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2477-2477\" title=\"원문 2477~2477줄 보기\">L2477<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3134-3166\" title=\"원문 3134~3166줄 보기\">L3134-3166<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4049-4050\" title=\"원문 4049~4050줄 보기\">L4049-4050<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5334-5336\" title=\"원문 5334~5336줄 보기\">L5334-5336<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6193-6194\" title=\"원문 6193~6194줄 보기\">L6193-6194<\/a>"],"html":"<h1>로컬 영상 생성 (내 PC로 만들기)<\/h1>\n<p>ComfyUI 같은 도구로 오픈 모델(<a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스-H3<\/a>, <a class=\"wl\" href=\"#/page/Wan\">Wan<\/a> 등)을 내 그래픽카드에서 돌리는 방법입니다.<\/p>\n<ul><li><strong>장점:<\/strong> 크레딧이 들지 않습니다.<\/li><li><strong>단점:<\/strong> 하드웨어와 시간이 듭니다.<\/li><\/ul>\n<h2>하드웨어 (방 안 의견)<\/h2>\n<ul><li><strong>VRAM:<\/strong> 16GB면 무난합니다. 5070 Ti 16GB와 3060 12GB도 돌아갑니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=9-17\" title=\"원문 9~17줄 보기\">L9-17<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=843-846\" title=\"원문 843~846줄 보기\">L843-846<\/a>).<ul><li>가속 LoRA를 쓰면 8GB(3060 Ti)도 됩니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1347-1348\" title=\"원문 1347~1348줄 보기\">L1347-1348<\/a>).<\/li><\/ul><\/li><li><strong>엔비디아 vs 맥:<\/strong> 영상 생성은 엔비디아(CUDA)가 맥보다 빠릅니다. 이미지는 비슷합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=819-850\" title=\"원문 819~850줄 보기\">L819-850<\/a>).<\/li><li><strong>사양을 넘기면:<\/strong> 스텝 수 등을 PC 성능 이상으로 올리면 GPU 대신 CPU로 넘어가 몇 시간씩 걸립니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=127-138\" title=\"원문 127~138줄 보기\">L127-138<\/a>).<\/li><li><strong>LLM과 비교:<\/strong> 로컬 LLM이 영상 생성보다 VRAM을 더 씁니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5-7\" title=\"원문 5~7줄 보기\">L5-7<\/a>).<\/li><\/ul>\n<h2>생성 시간 예시<\/h2>\n<div class='tw'><table><thead><tr><th>사양·설정<\/th><th>결과<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>5070 Ti 16GB, 0.9MP<\/td><td>8초 영상 14~20분<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=9-17\" title=\"원문 9~17줄 보기\">L9-17<\/a><\/td><\/tr><tr><td>3060 12GB, 데노 워크플로<\/td><td>10초 영상 약 700초<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=395-395\" title=\"원문 395~395줄 보기\">L395<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=846-846\" title=\"원문 846~846줄 보기\">L846<\/a><\/td><\/tr><tr><td>0.2MP + 업스케일<\/td><td>8초 영상 약 5분, 15초도 5분<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=576-576\" title=\"원문 576~576줄 보기\">L576<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=623-623\" title=\"원문 623~623줄 보기\">L623<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=704-704\" title=\"원문 704~704줄 보기\">L704<\/a><\/td><\/tr><tr><td>뉴디스 설정 (4스텝 + 8스텝 LoRA, 레이턴트 업스케일, RTX 업스케일, 프레임 보간)<\/td><td>15초 영상 309초<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=699-740\" title=\"원문 699~740줄 보기\">L699-740<\/a><\/td><\/tr><tr><td>뜰의 측정<\/td><td>이미지 1장 25초, 4초 영상 98초<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5334-5336\" title=\"원문 5334~5336줄 보기\">L5334-5336<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>속도 높이는 요령<\/h2>\n<ul><li><strong>데노 워크플로 (저해상도 생성 후 업스케일):<\/strong> 20스텝 대부분을 약 0.15MP로 돌리고 마지막 3스텝만 고해상도로 돌립니다 (Mr.HAN, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=395-402\" title=\"원문 395~402줄 보기\">L395-402<\/a>).<ul><li><strong>r2v 전용<\/strong>이라 i2v에서는 결과가 나쁩니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=407-407\" title=\"원문 407~407줄 보기\">L407<\/a>).<\/li><li>sol 노드 에러가 나면 노드를 지우고 새 버전으로 다시 연결합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=420-420\" title=\"원문 420~420줄 보기\">L420<\/a>).<\/li><\/ul><\/li><li><strong>빠른 동작이나 작은 얼굴:<\/strong> 레이턴트 업스케일을 끄고 1MP로 돌립니다. 시간은 2배쯤 걸립니다 (뉴디스, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=699-740\" title=\"원문 699~740줄 보기\">L699-740<\/a>).<\/li><li><strong>어텐션:<\/strong> Sol, Sage, Kitchen 어텐션을 씁니다. 검증이 많이 된 <strong>Sage가 충돌이 적습니다<\/strong>. 라데온은 따로 확인해야 합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=377-391\" title=\"원문 377~391줄 보기\">L377-391<\/a>).<\/li><li><strong>얼굴 뭉개짐:<\/strong> ComfyUI에 <strong>FaceDetailer<\/strong> 노드를 추가합니다 (두따, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2477-2477\" title=\"원문 2477~2477줄 보기\">L2477<\/a>).<\/li><li><strong>설치:<\/strong> 노드 설치와 워크플로 생성은 코덱스나 클로드에게 맡기면 편합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=392-418\" title=\"원문 392~418줄 보기\">L392-418<\/a>).<\/li><\/ul>\n<h2>PC가 약하면: GPU 빌리기<\/h2>\n<ul><li><strong>RunPod<\/strong>(<a href=\"https://www.runpod.io/\" target=\"_blank\" rel=\"noopener\">https://www.runpod.io/<\/a>)에서 시간당 요금으로 GPU를 빌려 ComfyUI나 Wan2GP를 돌립니다 (로킹, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3134-3166\" title=\"원문 3134~3166줄 보기\">L3134-3166<\/a>).<\/li><li>wan2gp.com은 다른 사이트이니 주의하세요 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3139-3143\" title=\"원문 3139~3143줄 보기\">L3139-3143<\/a>).<\/li><\/ul>\n<h2>회원 파이프라인<\/h2>\n<ul><li><strong>두따 (RAM 64GB, RTX 5080):<\/strong> <a class=\"wl\" href=\"#/page/YuE2\">YuE2<\/a>로 작곡 → Krea2로 캐릭터 시트 → 로컬 미니맥스 H3(ref2v)로 영상 → 프리미어로 편집 → AE로 자막 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4049-4050\" title=\"원문 4049~4050줄 보기\">L4049-4050<\/a>)<\/li><li><strong>Mr.HAN:<\/strong> <a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a> 스토리 스튜디오로 대본과 에셋 → <a class=\"wl\" href=\"#/page/%EB%AE%A4%EC%A6%88-AI\">뮤즈<\/a>로 미니맥스용 프롬프트 → RunningHub API로 영상 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6193-6194\" title=\"원문 6193~6194줄 보기\">L6193-6194<\/a>)<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"Wan","title":"Wan (완)","folder":"AI영상방"},{"name":"YuE2","title":"YuE2","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방"},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","folder":"AI영상방"}],"outgoing":[{"name":"Wan","title":"Wan (완)","exists":true},{"name":"YuE2","title":"YuE2","exists":true},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","exists":true},{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","exists":true},{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","exists":true}]},"사용량-관리":{"name":"사용량-관리","title":"사용량 관리 (LLM 한도)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/사용량-관리.md","fm":{"type":"concept","tags":["LLM","사용량"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L534-535 L2812-2849 L3249-3255 L3429-3536 L3680-3989 L4116-4126 L4195-4300 L5126-5131"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=534-535\" title=\"원문 534~535줄 보기\">L534-535<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2812-2849\" title=\"원문 2812~2849줄 보기\">L2812-2849<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3249-3255\" title=\"원문 3249~3255줄 보기\">L3249-3255<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3429-3536\" title=\"원문 3429~3536줄 보기\">L3429-3536<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3680-3989\" title=\"원문 3680~3989줄 보기\">L3680-3989<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4116-4126\" title=\"원문 4116~4126줄 보기\">L4116-4126<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4195-4300\" title=\"원문 4195~4300줄 보기\">L4195-4300<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5126-5131\" title=\"원문 5126~5131줄 보기\">L5126-5131<\/a>"],"html":"<h1>사용량 관리 (LLM 한도)<\/h1>\n<h2>요령<\/h2>\n<ul><li><strong>리셋 직후에는 \"사용량 증가(부스트)\" 옵션을 끕니다.<\/strong> 켜 둔 채로 한도를 넘기면 코인이 빠집니다 (ai공부중1, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3687-3688\" title=\"원문 3687~3688줄 보기\">L3687-3688<\/a>).<\/li><li><strong>모델을 확인합니다.<\/strong> 모델이 자동으로 바뀌는 경우가 있습니다. 예: 5.6 Sol이 중단되고 6으로 넘어갔습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4116-4126\" title=\"원문 4116~4126줄 보기\">L4116-4126<\/a>).<\/li><li><strong>한도가 따로인 곳을 나눠 씁니다.<\/strong> Codex와 일반 채팅은 한도가 따로입니다 → <a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT-코덱스<\/a><\/li><li><strong>무거운 작업을 피합니다.<\/strong> 3D 모델링처럼 무거운 작업은 사용량을 크게 씁니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3742-3777\" title=\"원문 3742~3777줄 보기\">L3742-3777<\/a>).<\/li><li><strong>클로드:<\/strong> 5시간마다 초기화되고 Pro는 한도가 작습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=534-535\" title=\"원문 534~535줄 보기\">L534-535<\/a>). Opus는 빨리 닳습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5126-5131\" title=\"원문 5126~5131줄 보기\">L5126-5131<\/a>).<\/li><\/ul>\n<h2>사건: 9월 코덱스 사용량 리셋 소동 (9/21~23)<\/h2>\n<div class='tw'><table><thead><tr><th>시점<\/th><th>일<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>9/21~22<\/td><td>OpenAI 관계자가 9/22 19시에 리셋한다고 예고한 것으로 받아들여짐. 회원들이 리셋 전에 사용량을 다 쓰려고 함<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2812-2849\" title=\"원문 2812~2849줄 보기\">L2812-2849<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3249-3255\" title=\"원문 3249~3255줄 보기\">L3249-3255<\/a><\/td><\/tr><tr><td>9/22 밤<\/td><td>리셋이 늦어져 불만이 커짐<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3680-3989\" title=\"원문 3680~3989줄 보기\">L3680-3989<\/a><\/td><\/tr><tr><td>9/23 아침<\/td><td>GPT가 <strong>\"초기화권\"<\/strong>을 지급함. 같은 날 클로드도 지급함<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4195-4224\" title=\"원문 4195~4224줄 보기\">L4195-4224<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4295-4300\" title=\"원문 4295~4300줄 보기\">L4295-4300<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>교훈 (위키 정리):<\/strong> 예고된 리셋에 맞춰 사용량을 몰아 쓰면 손해를 볼 수 있습니다.<\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"클로드","title":"클로드 (Claude)","folder":"AI영상방"},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","folder":"AI영상방"}],"outgoing":[{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","exists":true}]},"쇼츠-업로드-전략":{"name":"쇼츠-업로드-전략","title":"쇼츠·채널 운영 전략","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/쇼츠-업로드-전략.md","fm":{"type":"concept","tags":["유튜브"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L139-149 L350-365 L2328-2350 L2631-2652 L2689 L4035 L4094-4104 L5943-5949"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=139-149\" title=\"원문 139~149줄 보기\">L139-149<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=350-365\" title=\"원문 350~365줄 보기\">L350-365<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2328-2350\" title=\"원문 2328~2350줄 보기\">L2328-2350<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2631-2652\" title=\"원문 2631~2652줄 보기\">L2631-2652<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2689-2689\" title=\"원문 2689~2689줄 보기\">L2689<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4035-4035\" title=\"원문 4035~4035줄 보기\">L4035<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4094-4104\" title=\"원문 4094~4104줄 보기\">L4094-4104<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5943-5949\" title=\"원문 5943~5949줄 보기\">L5943-5949<\/a>"],"html":"<h1>쇼츠·채널 운영 전략<\/h1>\n<h2>업로드 간격 (사카요리 윤, 9월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2328-2350\" title=\"원문 2328~2350줄 보기\">L2328-2350<\/a>)<\/h2>\n<ul><li>새 영상을 올리면 앞 영상의 조회수가 떨어지는지가 화제였습니다.<\/li><li>앞 영상의 <strong>조회수 파동이 잦아들 때쯤<\/strong> 다음 영상을 올립니다.<\/li><li>재고를 쌓아 두고 <strong>3~7일 간격<\/strong>으로 올리면 무난하다는 의견입니다.<\/li><\/ul>\n<h2>주제 잡기<\/h2>\n<ul><li>유행하는 주제를 조사해서 따릅니다. 예: 팝송을 트로트로 바꾸고 15초 루프 영상과 합쳐 롱폼으로 만들기 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2631-2652\" title=\"원문 2631~2652줄 보기\">L2631-2652<\/a>)<\/li><li>잘 되는 채널을 Gemini로 분석한 뒤 클로드나 GPT에게 프롬프트를 받습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2689-2689\" title=\"원문 2689~2689줄 보기\">L2689<\/a>).<\/li><li>음악 채널은 커버곡을 가끔 섞습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5943-5949\" title=\"원문 5943~5949줄 보기\">L5943-5949<\/a>).<\/li><\/ul>\n<h2>수익화<\/h2>\n<ul><li><strong>유튜브 멤버십 버튼이 안 보이면:<\/strong> 수익창출 승인 뒤 1~2일 기다립니다. 멤버십은 따로 심사가 있습니다 (8월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=353-365\" title=\"원문 353~365줄 보기\">L353-365<\/a>).<\/li><li><strong>네이버 애드포스트:<\/strong> 글 30개, 방문자 30~50명이면 당월 승인됐다는 경험담입니다 (N블 마블링, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4035-4035\" title=\"원문 4035~4035줄 보기\">L4035<\/a>).<\/li><\/ul>\n<h2>썸네일<\/h2>\n<ul><li>유튜브 스튜디오의 썸네일 AI 생성 기능을 씁니다. 썸네일 &gt; 추천받기 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4094-4104\" title=\"원문 4094~4104줄 보기\">L4094-4104<\/a>).<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"}],"outgoing":[]},"실사-이미지-지침":{"name":"실사-이미지-지침","title":"실사 이미지 지침 (그리고 GIF·이모티콘)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/실사-이미지-지침.md","fm":{"type":"concept","tags":["이미지","프롬프트"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L904-1089 L1032-1037 L2855 L5566-5610 L5670-5752 L5886"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=904-1089\" title=\"원문 904~1089줄 보기\">L904-1089<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1032-1037\" title=\"원문 1032~1037줄 보기\">L1032-1037<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2855-2855\" title=\"원문 2855~2855줄 보기\">L2855<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5566-5610\" title=\"원문 5566~5610줄 보기\">L5566-5610<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5670-5752\" title=\"원문 5670~5752줄 보기\">L5670-5752<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5886-5886\" title=\"원문 5886~5886줄 보기\">L5886<\/a>"],"html":"<h1>실사 이미지 지침 (그리고 GIF·이모티콘)<\/h1>\n<h2>GPT 실사 지침 7항목 (뜰·로킹, 11월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5670-5690\" title=\"원문 5670~5690줄 보기\">L5670-5690<\/a>)<\/h2>\n<ol><li>화이트밸런스 5000~5500K<\/li><li>50mm 렌즈, F1.8~2.8 느낌의 심도<\/li><li>SNS용 삼분할 구도와 여백<\/li><li>채도, HDR, 샤프닝은 낮춤<\/li><li>피부 모공과 재질별 텍스처는 살림<\/li><li>주광원은 하나로 통일하고 접촉 그림자를 넣음<\/li><li>카메라를 의식하지 않은 순간 포착<\/li><\/ol>\n<ul><li><strong>테스트 결과:<\/strong> 그래도 손가락이나 손잡이가 늘어나는 오류가 있어 따로 고쳐야 합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5703-5728\" title=\"원문 5703~5728줄 보기\">L5703-5728<\/a>).<\/li><li>질감만 다시 렌더링하는 영문 프롬프트도 공유됐습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5743-5752\" title=\"원문 5743~5752줄 보기\">L5743-5752<\/a>).<\/li><\/ul>\n<h2>자글거림 줄이기<\/h2>\n<ul><li>\"8K, hyper realistic, ultra detailed, film grain, HDR\" 같은 단어를 <strong>너무 많이 넣으면 오히려 자글거립니다<\/strong> (지니쓰, 9월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2855-2855\" title=\"원문 2855~2855줄 보기\">L2855<\/a>).<\/li><\/ul>\n<h2>인쇄용 실사 (현수막 등, 8월)<\/h2>\n<ul><li>재질 결함, 렌즈, 조명을 구체적으로 적습니다. 네거티브 프롬프트에 CGI·플라스틱을 넣습니다 (슬곰이·판도라고, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=985-1083\" title=\"원문 985~1083줄 보기\">L985-1083<\/a>).<\/li><li>피사체를 따로 만든 뒤 합성하는 방법도 있습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1089-1089\" title=\"원문 1089~1089줄 보기\">L1089<\/a>).<\/li><li>인쇄물은 인쇄용 컬러 코드 기준으로 작업합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=925-925\" title=\"원문 925~925줄 보기\">L925<\/a>).<\/li><li>수정은 Gemini나 나노바나나가 좋다는 의견입니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1032-1037\" title=\"원문 1032~1037줄 보기\">L1032-1037<\/a>).<\/li><li><strong>한계:<\/strong> 크게 확대하면 AI 특유의 물결무늬와 질감은 남습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1222-1222\" title=\"원문 1222~1222줄 보기\">L1222<\/a>).<\/li><\/ul>\n<h2>미니어처<\/h2>\n<ul><li>미니어처 이미지는 나노(바나나)가 GPT보다 낫다는 의견입니다 (햄펠, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5886-5886\" title=\"원문 5886~5886줄 보기\">L5886<\/a>).<\/li><\/ul>\n<h2>GIF·카톡 이모티콘 만들기 (AN0, 11월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5566-5578\" title=\"원문 5566~5578줄 보기\">L5566-5578<\/a>)<\/h2>\n<ul><li><a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT<\/a>에 레퍼런스 이미지 1장과 프롬프트를 주고, 동작 컷 수를 늘리라고 합니다.<\/li><li>배경과 몸 위치는 고정하고 팔·얼굴·옷자락만 움직이게 하면 자연스럽습니다.<\/li><li>이모티콘 24개를 한 번에 요청하면 ZIP으로 받지만 <strong>매우 느립니다.<\/strong><\/li><\/ul>\n<h2>이미지 차이 찾기<\/h2>\n<p>두 이미지를 LLM에 넣고 무엇이 다른지 물어봅니다 (로킹, 요약 문서 기준).<\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"}],"outgoing":[{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","exists":true}]},"음악-만들기":{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/음악-만들기.md","fm":{"type":"concept","tags":["음악"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L2271-2273 L2884-2890 L2990 L3603 L4263 L5384 L5842-5843 L5943-5949"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2271-2273\" title=\"원문 2271~2273줄 보기\">L2271-2273<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2884-2890\" title=\"원문 2884~2890줄 보기\">L2884-2890<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2990-2990\" title=\"원문 2990~2990줄 보기\">L2990<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3603-3603\" title=\"원문 3603~3603줄 보기\">L3603<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4263-4263\" title=\"원문 4263~4263줄 보기\">L4263<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5384-5384\" title=\"원문 5384~5384줄 보기\">L5384<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5842-5843\" title=\"원문 5842~5843줄 보기\">L5842-5843<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5943-5949\" title=\"원문 5943~5949줄 보기\">L5943-5949<\/a>"],"html":"<h1>음악 만들기<\/h1>\n<div class='tw'><table><thead><tr><th>도구<\/th><th>한 줄 평<\/th><th>페이지<\/th><\/tr><\/thead><tbody><tr><td>수노<\/td><td>품질 좋음. 다운로드·export 불안정, 저작권 필터 과함<\/td><td><a class=\"wl\" href=\"#/page/%EC%88%98%EB%85%B8\">수노<\/a><\/td><\/tr><tr><td>YuE2<\/td><td>오픈소스 대안, 편곡 좋음. 상업 이용 논란<\/td><td><a class=\"wl\" href=\"#/page/YuE2\">YuE2<\/a><\/td><\/tr><tr><td>Flow 뮤직<\/td><td>악기 표현이 좋음 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2884-2890\" title=\"원문 2884~2890줄 보기\">L2884-2890<\/a>)<\/td><td><a class=\"wl\" href=\"#/page/Flow\">Flow<\/a><\/td><\/tr><tr><td>Mureka<\/td><td>올드한 느낌 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4263-4263\" title=\"원문 4263~4263줄 보기\">L4263<\/a>)<\/td><td>–<\/td><\/tr><tr><td>Gemini<\/td><td>음악 생성에 쓴 사례 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5384-5384\" title=\"원문 5384~5384줄 보기\">L5384<\/a>)<\/td><td>–<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>요령<\/h2>\n<ul><li><strong>분위기 따라 하기:<\/strong> 참고곡을 LLM에 주고 수노용 스타일 프롬프트와 가사를 받습니다 (로킹, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2271-2273\" title=\"원문 2271~2273줄 보기\">L2271-2273<\/a>).<\/li><li><strong>Flow + 수노:<\/strong> Flow로 악기 파트를 만든 뒤 수노에 레퍼런스로 올립니다 (라이또, 요약 문서 기준).<\/li><li><strong>MV 작업 (라이또, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5842-5843\" title=\"원문 5842~5843줄 보기\">L5842-5843<\/a>):<\/strong><ol><li>클로드 + 수노 MCP로 곡을 만듭니다.<\/li><li>자작 프로그램으로 마스터링과 업스케일을 합니다.<\/li><li>RunningHub에서 <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스 H3<\/a>로 영상을 만듭니다.<\/li><\/ol><\/li><li><strong>효과음:<\/strong> 작업할 때마다 직접 만들어 보관합니다 (Runa, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2990-2990\" title=\"원문 2990~2990줄 보기\">L2990<\/a>). 유튜브나 구글에서 효과음 모음을 찾을 수도 있습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3603-3603\" title=\"원문 3603~3603줄 보기\">L3603<\/a>).<\/li><li><strong>유입:<\/strong> 커버곡을 가끔 섞습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5943-5949\" title=\"원문 5943~5949줄 보기\">L5943-5949<\/a>). → <a class=\"wl\" href=\"#/page/%EC%87%BC%EC%B8%A0-%EC%97%85%EB%A1%9C%EB%93%9C-%EC%A0%84%EB%9E%B5\">쇼츠-업로드-전략<\/a>
