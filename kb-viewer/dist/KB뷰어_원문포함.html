%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3235-3244\" title=\"원문 3235~3244줄 보기\">L3235-3244<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4185-4186\" title=\"원문 4185~4186줄 보기\">L4185-4186<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4211-4211\" title=\"원문 4211~4211줄 보기\">L4211<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4260-4260\" title=\"원문 4260~4260줄 보기\">L4260<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4359-4359\" title=\"원문 4359~4359줄 보기\">L4359<\/a>"],"html":"<h1>저작권과 라이선스 (방 안 의견)<\/h1>\n<blockquote>아래는 회원들의 <strong>개인 의견<\/strong>입니다. 법률 자문이 아닙니다.<\/blockquote>\n<h2>스타일과 캐릭터<\/h2>\n<ul><li><strong>그림체·작화 스타일<\/strong>을 따라 하는 것은 국내에서 보호 대상이 아니라는 의견입니다.<\/li><li><strong>기존 캐릭터 IP를 생성<\/strong>하는 것은 위험합니다 (사카요리 윤, 9월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2324-2374\" title=\"원문 2324~2374줄 보기\">L2324-2374<\/a>).<\/li><\/ul>\n<h2>플랫폼 필터<\/h2>\n<ul><li><a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a>와 <a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a>는 저작권 캐릭터와 댄스를 막습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=170-178\" title=\"원문 170~178줄 보기\">L170-178<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2789-2793\" title=\"원문 2789~2793줄 보기\">L2789-2793<\/a>).<\/li><li><a class=\"wl\" href=\"#/page/%EC%88%98%EB%85%B8\">수노<\/a>는 저작권 필터가 과하다는 불만이 있습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4260-4260\" title=\"원문 4260~4260줄 보기\">L4260<\/a>).<\/li><\/ul>\n<h2>상업 이용<\/h2>\n<div class='tw'><table><thead><tr><th>대상<\/th><th>방 안 정보<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td><a class=\"wl\" href=\"#/page/Flow\">Flow<\/a> 결과물<\/td><td>유료도 워터마크가 있고, 상업적 사용은 가능하다는 답<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3235-3244\" title=\"원문 3235~3244줄 보기\">L3235-3244<\/a><\/td><\/tr><tr><td><a class=\"wl\" href=\"#/page/YuE2\">YuE2<\/a><\/td><td>가중치는 CC BY-NC(비상업)라는 지적과, 개인 상업 이용이 허용됐다는 주장이 엇갈림 → <strong>직접 확인<\/strong><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4211-4211\" title=\"원문 4211~4211줄 보기\">L4211<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4359-4359\" title=\"원문 4359~4359줄 보기\">L4359<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>입력 데이터<\/h2>\n<ul><li>시댄스가 입력한 프롬프트와 소스를 학습에 쓴다는 주장이 있습니다. 확인되지 않았습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4185-4185\" title=\"원문 4185~4185줄 보기\">L4185<\/a>).<\/li><li><a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a> Enterprise는 입력을 학습에 쓰지 않는다고 합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4186-4186\" title=\"원문 4186~4186줄 보기\">L4186<\/a>).<\/li><li>무료 서비스에는 개인정보를 넣지 마세요 → <a class=\"wl\" href=\"#/page/%EB%AE%A4%EC%A6%88-AI\">뮤즈-AI<\/a><\/li><\/ul>\n<h2>방 안 매너<\/h2>\n<ul><li>남이 공유한 이미지를 쓸 때는 <strong>출처를 밝힙니다<\/strong> (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=680-690\" title=\"원문 680~690줄 보기\">L680-690<\/a>). → <a class=\"wl\" href=\"#/page/AI%EC%98%81%EC%83%81%EB%B0%A9-%EA%B7%9C%EC%B9%99\">AI영상방-규칙<\/a><\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"YuE2","title":"YuE2","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방"}],"outgoing":[{"name":"AI영상방-규칙","title":"AI영상방 규칙과 운영 기록","exists":true},{"name":"Flow","title":"Flow (구글)","exists":true},{"name":"YuE2","title":"YuE2","exists":true},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","exists":true},{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","exists":true},{"name":"수노","title":"수노 (Suno)","exists":true},{"name":"시댄스","title":"시댄스 (Seedance)","exists":true},{"name":"힉스필드","title":"힉스필드 (Higgsfield)","exists":true}]},"캐릭터-시트":{"name":"캐릭터-시트","title":"캐릭터 시트","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/캐릭터-시트.md","fm":{"type":"concept","tags":["이미지","워크플로"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L3768 L5421-5439 L6246-6273"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3768-3768\" title=\"원문 3768~3768줄 보기\">L3768<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5421-5439\" title=\"원문 5421~5439줄 보기\">L5421-5439<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6246-6273\" title=\"원문 6246~6273줄 보기\">L6246-6273<\/a>"],"html":"<h1>캐릭터 시트<\/h1>\n<p>영상에서 같은 인물이 일관되게 나오게 하려고 미리 만들어 두는 인물 설정 이미지입니다.<\/p>\n<h2>요령<\/h2>\n<ul><li><strong>요소를 중복해서 넣지 않습니다.<\/strong> 시트에 얼굴이 2개 있으면 영상에서 얼굴이 왔다 갔다 합니다 (ai공부중1, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5434-5435\" title=\"원문 5434~5435줄 보기\">L5434-5435<\/a>).<\/li><li><strong>3D나 회전이 필요하면:<\/strong> 정면·측면·후면 삼면도를 먼저 만든 뒤 붙입니다 (ai공부중1, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3768-3768\" title=\"원문 3768~3768줄 보기\">L3768<\/a>).<\/li><li><strong>도구 분담:<\/strong> 시트는 <a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT<\/a>, 배경은 <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%93%9C%EC%A0%80%EB%8B%88\">미드저니<\/a>나 <a class=\"wl\" href=\"#/page/%EB%AE%A4%EC%A6%88-AI\">뮤즈<\/a>로 만듭니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6246-6248\" title=\"원문 6246~6248줄 보기\">L6246-6248<\/a>).<ul><li>미드저니는 색감은 좋지만 시트를 잘 못 만듭니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6266-6266\" title=\"원문 6266~6266줄 보기\">L6266<\/a>).<\/li><\/ul><\/li><li><strong>뮤즈에 학습시키기:<\/strong> 좋은 시트 예시를 몇 개 먼저 보여 주고 \"앞으로 이렇게\"라고 합니다 (Mr.HAN, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6269-6269\" title=\"원문 6269~6269줄 보기\">L6269<\/a>).<\/li><li><strong>배경 글자 고정:<\/strong> 한글 간판 같은 배경 글자는 배경 시트로 고정합니다 (Mr.HAN, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5095-5095\" title=\"원문 5095~5095줄 보기\">L5095<\/a>).<\/li><\/ul>\n<h2>용어<\/h2>\n<ul><li><strong>\"인삐\":<\/strong> \"인체 삐꾸\"의 줄임말. 인체 비율이 어색하게 나온 상태를 말합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5424-5429\" title=\"원문 5424~5429줄 보기\">L5424-5429<\/a>).<\/li><\/ul>\n<h2>참고<\/h2>\n<ul><li>캐릭터 시트 만드는 법 영상: <a href=\"https://www.youtube.com/watch?v=mKTADGOSZnY\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=mKTADGOSZnY<\/a> (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5439-5439\" title=\"원문 5439~5439줄 보기\">L5439<\/a>)<\/li><li>방장 영상을 참고하라는 답도 있었습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5425-5425\" title=\"원문 5425~5425줄 보기\">L5425<\/a>).<\/li><li>더 많은 링크는 <a class=\"wl\" href=\"#/page/%EC%93%B8%EB%A7%8C%ED%95%9C-%EB%A7%81%ED%81%AC\">쓸만한-링크<\/a>에 있습니다.<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","folder":"AI영상방"},{"name":"미드저니","title":"미드저니 (Midjourney)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방"}],"outgoing":[{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","exists":true},{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","exists":true},{"name":"미드저니","title":"미드저니 (Midjourney)","exists":true},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","exists":true}]},"크레딧-비용-절약":{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/크레딧-비용-절약.md","fm":{"type":"concept","tags":["비용"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L458-478 L1254-1258 L2554 L5115-5119 L5481-5530"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=458-478\" title=\"원문 458~478줄 보기\">L458-478<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1254-1258\" title=\"원문 1254~1258줄 보기\">L1254-1258<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2554-2554\" title=\"원문 2554~2554줄 보기\">L2554<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5115-5119\" title=\"원문 5115~5119줄 보기\">L5115-5119<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5481-5530\" title=\"원문 5481~5530줄 보기\">L5481-5530<\/a>"],"html":"<h1>크레딧·비용 절약<\/h1>\n<p>방 안에서 나온 <strong>정당한<\/strong> 절약 방법만 모았습니다. 여러 계정으로 무료나 할인을 반복해서 받는 방법은 약관 위반 소지가 있어 넣지 않았습니다.<\/p>\n<h2>원칙<\/h2>\n<ul><li><strong>모델을 먼저 정하고, 그 모델을 싸게 쓰는 플랫폼을 고릅니다<\/strong> (Mr.HAN, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5530-5530\" title=\"원문 5530~5530줄 보기\">L5530<\/a>).<\/li><li>크레딧 총량이 아니라 <strong>생성 1회에 드는 크레딧<\/strong>을 비교합니다 (Mr.HAN, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5119-5119\" title=\"원문 5119~5119줄 보기\">L5119<\/a>).<\/li><li>비싼 <a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a>는 <strong>화려한 액션 컷에만<\/strong> 씁니다 (빌런, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5481-5481\" title=\"원문 5481~5481줄 보기\">L5481<\/a>).<\/li><\/ul>\n<h2>방법<\/h2>\n<div class='tw'><table><thead><tr><th>방법<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>프롬프트는 밖에서<\/td><td>프롬프트 작업은 GPT, Gemini, Codex에서 하고 플랫폼에서는 생성만 함<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=458-458\" title=\"원문 458~458줄 보기\">L458<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=471-471\" title=\"원문 471~471줄 보기\">L471<\/a><\/td><\/tr><tr><td>저화질로 시험<\/td><td>480p로 시험한 뒤 720p로 뽑거나 업스케일<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=478-478\" title=\"원문 478~478줄 보기\">L478<\/a><\/td><\/tr><tr><td>조금씩 사서 비교<\/td><td><a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a>나 OpenArt에서 크레딧을 조금 사서 여러 모델을 저화질로 비교<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5519-5519\" title=\"원문 5519~5519줄 보기\">L5519<\/a><\/td><\/tr><tr><td>해상도 무관 과금<\/td><td>motionmux의 <a class=\"wl\" href=\"#/page/Wan\">Wan<\/a> 3.0은 해상도와 관계없이 초당 15크레딧이라 1080p로 뽑기<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1254-1258\" title=\"원문 1254~1258줄 보기\">L1254-1258<\/a><\/td><\/tr><tr><td>무료 크레딧<\/td><td><a class=\"wl\" href=\"#/page/Flow\">Flow<\/a>는 계정마다 매일 50크레딧 (정상 사용 범위)<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2554-2554\" title=\"원문 2554~2554줄 보기\">L2554<\/a><\/td><\/tr><tr><td>로컬<\/td><td><a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a><\/td><td>–<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>예산 감 잡기 (대화 시점 기준)<\/h2>\n<ul><li><strong>월 10만 원:<\/strong> 시댄스 기준으로 약 2분 30초~3분 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5442-5523\" title=\"원문 5442~5523줄 보기\">L5442-5523<\/a>)<\/li><li><strong>시댄스로만 약 3분:<\/strong> 약 9만~10만 원 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5492-5493\" title=\"원문 5492~5493줄 보기\">L5492-5493<\/a>)<\/li><li><strong>월 500크레딧:<\/strong> 시댄스 2.0 기준으로 약 8분 (8월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=476-476\" title=\"원문 476~476줄 보기\">L476<\/a>)<\/li><li><strong>캡컷 기본 구독:<\/strong> 약 12초 분량 → <a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a><\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"Flow","title":"Flow (구글)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방"},{"name":"힉스필드","title":"힉스필드 (Higgsfield)","folder":"AI영상방"}],"outgoing":[{"name":"Flow","title":"Flow (구글)","exists":true},{"name":"Wan","title":"Wan (완)","exists":true},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","exists":true},{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","exists":true},{"name":"시댄스","title":"시댄스 (Seedance)","exists":true},{"name":"힉스필드","title":"힉스필드 (Higgsfield)","exists":true}]},"클로드-MCP-활용":{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"concepts","path":"AI영상방_KakaoTalk_20261106_0943/wiki/concepts/클로드-MCP-활용.md","fm":{"type":"concept","tags":["LLM","MCP","자동화"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L523-568 L4709-4734 L5034 L5057-5059 L6254-6259"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=523-568\" title=\"원문 523~568줄 보기\">L523-568<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4709-4734\" title=\"원문 4709~4734줄 보기\">L4709-4734<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5034-5034\" title=\"원문 5034~5034줄 보기\">L5034<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5057-5059\" title=\"원문 5057~5059줄 보기\">L5057-5059<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6254-6259\" title=\"원문 6254~6259줄 보기\">L6254-6259<\/a>"],"html":"<h1>클로드 MCP 활용<\/h1>\n<p><a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C\">클로드<\/a>에 외부 도구를 MCP로 연결해 이미지·영상·음악 작업을 시키는 방법입니다.<\/p>\n<h2>연결 사례<\/h2>\n<ul><li><strong><a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a> MCP:<\/strong> 연결은 무료이고 생성에는 크레딧이 듭니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=523-524\" title=\"원문 523~524줄 보기\">L523-524<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5057-5059\" title=\"원문 5057~5059줄 보기\">L5057-5059<\/a>). 무제한 요금제는 MCP에 적용되지 않습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4280-4280\" title=\"원문 4280~4280줄 보기\">L4280<\/a>).<\/li><li><strong><a class=\"wl\" href=\"#/page/%EC%88%98%EB%85%B8\">수노<\/a> MCP:<\/strong> 곡을 만들게 하면 편합니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4709-4734\" title=\"원문 4709~4734줄 보기\">L4709-4734<\/a>).<\/li><li><strong>원격 지휘:<\/strong> PC에 클로드를 켜 두고 휴대폰으로 지시하면, 크롬 디버깅과 MCP로 그림·음악·영상까지 처리합니다 (ai공부중1, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6254-6259\" title=\"원문 6254~6259줄 보기\">L6254-6259<\/a>).<\/li><\/ul>\n<h2>토큰 절약 (카이로스, 8월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=536-568\" title=\"원문 536~568줄 보기\">L536-568<\/a>)<\/h2>\n<ol><li>결과물을 <strong>위젯이 아니라 링크로<\/strong> 받습니다.<\/li><li>스킬 파일은 호출할 때마다 전문을 읽습니다. 그래서 시행착오는 <strong>한 줄씩만<\/strong> 별도 MD 파일에 적습니다.<\/li><li>핸드오프·레지스터 MD는 주기적으로 정리합니다.<\/li><li>스킬을 <strong>코어·마스터·이미지·비디오로 나눠<\/strong> 필요한 것만 읽게 합니다.<\/li><\/ol>\n<h2>대화 관리<\/h2>\n<ul><li>대화가 길어져 품질이 떨어지면 새 채팅으로 옮깁니다 (빌런, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5034-5034\" title=\"원문 5034~5034줄 보기\">L5034<\/a>).<\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%82%AC%EC%9A%A9%EB%9F%89-%EA%B4%80%EB%A6%AC\">사용량-관리<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-개요","title":"개요 — AI영상방 (KakaoTalk_20261106_0943)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"클로드","title":"클로드 (Claude)","folder":"AI영상방"},{"name":"힉스필드","title":"힉스필드 (Higgsfield)","folder":"AI영상방"}],"outgoing":[{"name":"사용량-관리","title":"사용량 관리 (LLM 한도)","exists":true},{"name":"수노","title":"수노 (Suno)","exists":true},{"name":"클로드","title":"클로드 (Claude)","exists":true},{"name":"힉스필드","title":"힉스필드 (Higgsfield)","exists":true}]},"AI영상방":{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/AI영상방.md","fm":{"type":"entity","tags":["대화방"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L1-6369","src-AI영상방-요약"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1-6369\" title=\"원문 1~6369줄 보기\">L1-6369<\/a>","src-AI영상방-요약"],"html":"<h1>AI영상방 (AI아스트라 AI영상 노하우 공유방)<\/h1>\n<blockquote>근거 자료: <a class=\"wl\" href=\"#/page/src-AI%EC%98%81%EC%83%81%EB%B0%A9-%EB%8C%80%ED%99%94\">src-AI영상방-대화<\/a> (원문), <a class=\"wl\" href=\"#/page/src-AI%EC%98%81%EC%83%81%EB%B0%A9-%EC%9A%94%EC%95%BD\">src-AI영상방-요약<\/a> (사람이 만든 요약, 원문과 대조함)<\/blockquote>\n<p>AI로 영상·이미지·음악을 만드는 사람들이 노하우를 나누는 카카오톡 오픈채팅방입니다.<\/p>\n<ul><li><strong>방장:<\/strong> AI Astra. 유튜브에서 AI 영상 강의와 AI 드라마를 운영합니다.<\/li><li><strong>참여자:<\/strong> 155명이 말했습니다.<\/li><\/ul>\n<h2>무엇을 얻을 수 있나<\/h2>\n<div class='tw'><table><thead><tr><th>분야<\/th><th>페이지<\/th><\/tr><\/thead><tbody><tr><td>영상 모델 고르기<\/td><td><a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a>, <a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a>, <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A7%81\">클링<\/a>, <a class=\"wl\" href=\"#/page/Wan\">Wan<\/a>, <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스-H3<\/a>, <a class=\"wl\" href=\"#/page/%ED%83%91%EB%B7%B0-T1\">탑뷰-T1<\/a>, <a class=\"wl\" href=\"#/page/%EA%B7%B8%EB%A1%9D\">그록<\/a><\/td><\/tr><tr><td>어디서 쓰나 (플랫폼)<\/td><td><a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a>, <a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a>, <a class=\"wl\" href=\"#/page/%EB%9F%B0%EC%9B%A8%EC%9D%B4\">런웨이<\/a>, <a class=\"wl\" href=\"#/page/Flow\">Flow<\/a><\/td><\/tr><tr><td>내 PC로 만들기<\/td><td><a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a><\/td><\/tr><tr><td>이미지<\/td><td><a class=\"wl\" href=\"#/page/%EC%8B%A4%EC%82%AC-%EC%9D%B4%EB%AF%B8%EC%A7%80-%EC%A7%80%EC%B9%A8\">실사-이미지-지침<\/a>, <a class=\"wl\" href=\"#/page/%EC%BA%90%EB%A6%AD%ED%84%B0-%EC%8B%9C%ED%8A%B8\">캐릭터-시트<\/a>, <a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT-코덱스<\/a>, <a class=\"wl\" href=\"#/page/%EB%AE%A4%EC%A6%88-AI\">뮤즈-AI<\/a><\/td><\/tr><tr><td>대사·목소리·음악<\/td><td><a class=\"wl\" href=\"#/page/%EB%8C%80%EC%82%AC%EC%99%80-%EB%AA%A9%EC%86%8C%EB%A6%AC\">대사와-목소리<\/a>, <a class=\"wl\" href=\"#/page/%EC%9D%8C%EC%95%85-%EB%A7%8C%EB%93%A4%EA%B8%B0\">음악-만들기<\/a>, <a class=\"wl\" href=\"#/page/%EC%88%98%EB%85%B8\">수노<\/a>, <a class=\"wl\" href=\"#/page/YuE2\">YuE2<\/a><\/td><\/tr><tr><td>LLM 활용<\/td><td><a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT-코덱스<\/a>, <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C\">클로드<\/a>, <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C-MCP-%ED%99%9C%EC%9A%A9\">클로드-MCP-활용<\/a>, <a class=\"wl\" href=\"#/page/%EC%82%AC%EC%9A%A9%EB%9F%89-%EA%B4%80%EB%A6%AC\">사용량-관리<\/a><\/td><\/tr><tr><td>편집<\/td><td><a class=\"wl\" href=\"#/page/%ED%8E%B8%EC%A7%91-%ED%88%B4\">편집-툴<\/a><\/td><\/tr><tr><td>돈 아끼기<\/td><td><a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a><\/td><\/tr><tr><td>유튜브 운영<\/td><td><a class=\"wl\" href=\"#/page/%EC%87%BC%EC%B8%A0-%EC%97%85%EB%A1%9C%EB%93%9C-%EC%A0%84%EB%9E%B5\">쇼츠-업로드-전략<\/a><\/td><\/tr><tr><td>저작권<\/td><td><a class=\"wl\" href=\"#/page/%EC%A0%80%EC%9E%91%EA%B6%8C%EA%B3%BC-%EB%9D%BC%EC%9D%B4%EC%84%A0%EC%8A%A4\">저작권과-라이선스<\/a><\/td><\/tr><tr><td>처음이라면<\/td><td><a class=\"wl\" href=\"#/page/%EC%B4%88%EB%B3%B4-%EC%8B%9C%EC%9E%91-%EA%B0%80%EC%9D%B4%EB%93%9C\">초보-시작-가이드<\/a>, <a class=\"wl\" href=\"#/page/%EC%9E%90%EC%A3%BC-%EB%82%98%EC%98%A8-%EC%A7%88%EB%AC%B8\">자주-나온-질문<\/a>, <a class=\"wl\" href=\"#/page/%EC%93%B8%EB%A7%8C%ED%95%9C-%EB%A7%81%ED%81%AC\">쓸만한-링크<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>방 규칙<\/h2>\n<p>→ <a class=\"wl\" href=\"#/page/AI%EC%98%81%EC%83%81%EB%B0%A9-%EA%B7%9C%EC%B9%99\">AI영상방-규칙<\/a><\/p>\n<h2>주의<\/h2>\n<ul><li>노하우는 <strong>회원들의 의견과 경험담<\/strong>입니다. 위키를 만들면서 직접 검증하지 않았습니다.<\/li><li>가격, 한도, 모델 버전은 자주 바뀝니다. 페이지마다 \"몇 월 대화 기준\"인지 함께 봐야 합니다.<\/li><li>방 이름의 \"아스트라\"는 방장 닉네임입니다.<ul><li>대화에서는 GPT 계열 최신 모델 이름으로도 쓰입니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98 \"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3605-3605\" title=\"원문 3605~3605줄 보기\">L3605<\/a>)<\/p>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>9월<\/td><td>구글 계정마다 <strong>매일 무료 50크레딧<\/strong>, 저화질 영상 1개에 6~7크레딧<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2554-2554\" title=\"원문 2554~2554줄 보기\">L2554<\/a><\/td><\/tr><tr><td>9월<\/td><td>무료 \"옴니 1.1\"도 쓸 만하고 립싱크가 괜찮음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2716-2721\" title=\"원문 2716~2721줄 보기\">L2716-2721<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4485-4485\" title=\"원문 4485~4485줄 보기\">L4485<\/a><\/td><\/tr><tr><td>9월<\/td><td><strong>유료여도 워터마크<\/strong>가 있음. 상업적 사용은 가능하다는 답<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3235-3244\" title=\"원문 3235~3244줄 보기\">L3235-3244<\/a><\/td><\/tr><tr><td>9월<\/td><td>Flow 뮤직은 <a class=\"wl\" href=\"#/page/%EC%88%98%EB%85%B8\">수노<\/a>와 결이 다르고 악기 표현이 더 좋음 → <a class=\"wl\" href=\"#/page/%EC%9D%8C%EC%95%85-%EB%A7%8C%EB%93%A4%EA%B8%B0\">음악-만들기<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2884-2890\" title=\"원문 2884~2890줄 보기\">L2884-2890<\/a><\/td><\/tr><tr><td>9월<\/td><td>Ultra 전용 무크레딧 모델(Veo 3.1 lite)이 공지 없이 사라짐. 구글 클라우드에서 쓸 수 있고, 신규 가입 시 약 $300 크레딧<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4302-4318\" title=\"원문 4302~4318줄 보기\">L4302-4318<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>워터마크 처리 (방 안 의견)<\/h2>\n<ul><li>화면을 확대해서 잘라내거나 채널 로고로 가립니다 (요약 문서 기준).<\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%B4%88%EB%B3%B4-%EC%8B%9C%EC%9E%91-%EA%B0%80%EC%9D%B4%EB%93%9C\">초보-시작-가이드<\/a>, <a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"수노","title":"수노 (Suno)","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방"},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","folder":"AI영상방"}],"outgoing":[{"name":"수노","title":"수노 (Suno)","exists":true},{"name":"음악-만들기","title":"음악 만들기","exists":true},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","exists":true},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","exists":true}]},"GPT-코덱스":{"name":"GPT-코덱스","title":"GPT · 코덱스 (ChatGPT, Codex)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/GPT-코덱스.md","fm":{"type":"entity","tags":["도구","LLM","이미지"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L500-528 L1148-1198 L3505-3553 L3742-3777 L4116-4126 L4472 L4979 L5011-5044 L5090-5107 L5566 L6264-6265 L6340"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=500-528\" title=\"원문 500~528줄 보기\">L500-528<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1148-1198\" title=\"원문 1148~1198줄 보기\">L1148-1198<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3505-3553\" title=\"원문 3505~3553줄 보기\">L3505-3553<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3742-3777\" title=\"원문 3742~3777줄 보기\">L3742-3777<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4116-4126\" title=\"원문 4116~4126줄 보기\">L4116-4126<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4472-4472\" title=\"원문 4472~4472줄 보기\">L4472<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4979-4979\" title=\"원문 4979~4979줄 보기\">L4979<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5011-5044\" title=\"원문 5011~5044줄 보기\">L5011-5044<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5090-5107\" title=\"원문 5090~5107줄 보기\">L5090-5107<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5566-5566\" title=\"원문 5566~5566줄 보기\">L5566<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6264-6265\" title=\"원문 6264~6265줄 보기\">L6264-6265<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6340-6340\" title=\"원문 6340~6340줄 보기\">L6340<\/a>"],"html":"<h1>GPT · 코덱스 (ChatGPT, Codex)<\/h1>\n<p>OpenAI의 채팅 서비스(GPT)와 코딩 에이전트(Codex)입니다. 방에서는 <strong>이미지 품질이 가장 좋다<\/strong>는 평이 일관됩니다.<\/p>\n<h2>잘하는 것<\/h2>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>이미지 품질은 지금 최고<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=502-502\" title=\"원문 502~502줄 보기\">L502<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=528-528\" title=\"원문 528~528줄 보기\">L528<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1172-1172\" title=\"원문 1172~1172줄 보기\">L1172<\/a><\/td><\/tr><tr><td>11월<\/td><td>그리기와 그림 분석이 강함. 수정도 클로드보다 나음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5013-5013\" title=\"원문 5013~5013줄 보기\">L5013<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5041-5041\" title=\"원문 5041~5041줄 보기\">L5041<\/a><\/td><\/tr><tr><td>11월<\/td><td>캐릭터 시트를 잘 만듦 → <a class=\"wl\" href=\"#/page/%EC%BA%90%EB%A6%AD%ED%84%B0-%EC%8B%9C%ED%8A%B8\">캐릭터-시트<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6264-6265\" title=\"원문 6264~6265줄 보기\">L6264-6265<\/a><\/td><\/tr><tr><td>11월<\/td><td>GIF·프레임 애니메이션, 카톡 이모티콘 → <a class=\"wl\" href=\"#/page/%EC%8B%A4%EC%82%AC-%EC%9D%B4%EB%AF%B8%EC%A7%80-%EC%A7%80%EC%B9%A8\">실사-이미지-지침<\/a> 아래 GIF 항목<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5566-5610\" title=\"원문 5566~5610줄 보기\">L5566-5610<\/a><\/td><\/tr><tr><td>11월<\/td><td>움직임이 적은 영상은 어느 정도 고칠 수 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4979-4979\" title=\"원문 4979~4979줄 보기\">L4979<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>약한 것<\/h2>\n<ul><li>그림이 깨지는 경우가 많습니다. 손가락 같은 오류가 납니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6264-6265\" title=\"원문 6264~6265줄 보기\">L6264-6265<\/a>).<\/li><li>자막 작업 중 일부를 빠뜨립니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6340-6340\" title=\"원문 6340~6340줄 보기\">L6340<\/a>).<\/li><li>\"고쳤다\"고 해 놓고 안 고친 경우가 있습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3765-3765\" title=\"원문 3765~3765줄 보기\">L3765<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4482-4484\" title=\"원문 4482~4484줄 보기\">L4482-4484<\/a>).<\/li><li>Blender 3D 모델링을 시켰다가 사용량 70%를 쓰고 뭉개진 결과만 얻은 사례가 있습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3742-3777\" title=\"원문 3742~3777줄 보기\">L3742-3777<\/a>).<\/li><\/ul>\n<h2>요금·한도 (대화 시점 기준)<\/h2>\n<div class='tw'><table><thead><tr><th>시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>Go 약 1.3만 원, Plus 약 2.9만 원. Plus는 3시간에 이미지 약 50장<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1193-1198\" title=\"원문 1193~1198줄 보기\">L1193-1198<\/a><\/td><\/tr><tr><td>9월<\/td><td>Pro는 x5($100, 약 15.9만 원)와 x20이 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3540-3553\" title=\"원문 3540~3553줄 보기\">L3540-3553<\/a><\/td><\/tr><tr><td>9월<\/td><td>Plus의 5시간 한도가 몇 분 만에 소진된다는 보고<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3519-3519\" title=\"원문 3519~3519줄 보기\">L3519<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3524-3524\" title=\"원문 3524~3524줄 보기\">L3524<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4472-4472\" title=\"원문 4472~4472줄 보기\">L4472<\/a><\/td><\/tr><tr><td>8월·11월<\/td><td><strong>Codex와 일반 채팅은 한도가 따로<\/strong>. 이미지 결과는 차이 없음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1149-1149\" title=\"원문 1149~1149줄 보기\">L1149<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5082-5104\" title=\"원문 5082~5104줄 보기\">L5082-5104<\/a><\/td><\/tr><tr><td>11월<\/td><td>GPT 요금제와 Codex 한도가 통합될까 우려<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4994-5013\" title=\"원문 4994~5013줄 보기\">L4994-5013<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>모델 자동 교체 주의:<\/strong> 5.6 Sol은 10/14에 중단되고 6으로 자동 전환된다는 말이 있었습니다. 쓸 때마다 모델을 확인하세요 (9월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4116-4126\" title=\"원문 4116~4126줄 보기\">L4116-4126<\/a>).<\/li><li><strong>9월 사용량 리셋 소동:<\/strong> <a class=\"wl\" href=\"#/page/%EC%82%AC%EC%9A%A9%EB%9F%89-%EA%B4%80%EB%A6%AC\">사용량-관리<\/a>에 있습니다.<\/li><\/ul>\n<h2>클로드와의 역할 분담<\/h2>\n<ul><li><strong>이미지와 사용량은 GPT, 스토리와 코드 Talk_20261106_0943?l=4015-4018\" title=\"원문 4015~4018줄 보기\">L4015-4018<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5269-5270\" title=\"원문 5269~5270줄 보기\">L5269-5270<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5342-5342\" title=\"원문 5342~5342줄 보기\">L5342<\/a>"],"html":"<h1>Wan (완)<\/h1>\n<p>가성비가 좋은 영상 생성 모델입니다. 오픈 모델로 로컬에서도 돌아갑니다 → <a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a><\/p>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>Wan 3.0은 <a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a>보다 조금 부족하지만 가격 대비 쓸 만하고, <strong>30초를 한 번에 생성<\/strong>할 수 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1240-1240\" title=\"원문 1240~1240줄 보기\">L1240<\/a><\/td><\/tr><tr><td>8월<\/td><td>motionmux.com에서 Wan 3.0 공모전용 모델을 제공. <strong>해상도와 관계없이 초당 15크레딧<\/strong>이라 1080p로 뽑는 게 이득. 승인까지 약 6시간<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1247-1258\" title=\"원문 1247~1258줄 보기\">L1247-1258<\/a><\/td><\/tr><tr><td>9월<\/td><td>Wan2GP(로컬 실행 도구)의 LTX2.5로 콘서트 영상을 만들었는데 뭉개짐이 있었음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4015-4018\" title=\"원문 4015~4018줄 보기\">L4015-4018<\/a><\/td><\/tr><tr><td>11월<\/td><td><strong>애니메이션에 강함<\/strong>. \"Wan 3.0 프라임\" 언급<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5269-5270\" title=\"원문 5269~5270줄 보기\">L5269-5270<\/a><\/td><\/tr><tr><td>11월<\/td><td>시도했다가 실패한 사례<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5342-5342\" title=\"원문 5342~5342줄 보기\">L5342<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","folder":"AI영상방"}],"outgoing":[{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","exists":true},{"name":"시댄스","title":"시댄스 (Seedance)","exists":true},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","exists":true}]},"YuE2":{"name":"YuE2","title":"YuE2","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/YuE2.md","fm":{"type":"entity","tags":["도구","음악","오픈소스","로컬"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L4049-4062 L4199-4398 L4211-4227 L4331 L4359 L4366 L4378-4390"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4049-4062\" title=\"원문 4049~4062줄 보기\">L4049-4062<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4199-4398\" title=\"원문 4199~4398줄 보기\">L4199-4398<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4211-4227\" title=\"원문 4211~4227줄 보기\">L4211-4227<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4331-4331\" title=\"원문 4331~4331줄 보기\">L4331<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4359-4359\" title=\"원문 4359~4359줄 보기\">L4359<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4366-4366\" title=\"원문 4366~4366줄 보기\">L4366<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4378-4390\" title=\"원문 4378~4390줄 보기\">L4378-4390<\/a>"],"html":"<h1>YuE2<\/h1>\n<p><a class=\"wl\" href=\"#/page/%EC%88%98%EB%85%B8\">수노<\/a>의 대안으로 9월에 주목받은 <strong>오픈소스 음악 생성 모델<\/strong>입니다.<\/p>\n<h2>평가 (9월)<\/h2>\n<ul><li>거의 수노급 음질이고, <strong>편곡은 수노보다 낫다<\/strong>는 평입니다 (Mr.HAN, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4331-4331\" title=\"원문 4331~4331줄 보기\">L4331<\/a>).<\/li><li>참조곡 제한이 없고 커스텀할 수 있습니다. 다만 10곡쯤은 뽑아야 마음에 드는 게 나온다고 합니다 (두따, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4057-4060\" title=\"원문 4057~4060줄 보기\">L4057-4060<\/a>).<\/li><li>커버곡도 만들 수 있습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4251-4254\" title=\"원문 4251~4254줄 보기\">L4251-4254<\/a>).<\/li><li>특정 가사를 씹는(발음이 뭉개지는) 문제가 있습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4382-4382\" title=\"원문 4382~4382줄 보기\">L4382<\/a>).<\/li><\/ul>\n<h2>실행 방법<\/h2>\n<div class='tw'><table><thead><tr><th>방법<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>Q8 모델<\/td><td>약 8GB VRAM에서 돌아감<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4211-4211\" title=\"원문 4211~4211줄 보기\">L4211<\/a><\/td><\/tr><tr><td>yue2-studio (Windows exe)<\/td><td>VRAM 24GB 이상이면 설정 없이 실행. 자막 플러그인, 보컬 캐릭터 고정 기능<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4221-4227\" title=\"원문 4221~4227줄 보기\">L4221-4227<\/a><\/td><\/tr><tr><td>Kaggle 노트북<\/td><td>사양이 낮을 때<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4211-4211\" title=\"원문 4211~4211줄 보기\">L4211<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4378-4378\" title=\"원문 4378~4378줄 보기\">L4378<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>기본 배포판은 UI 없이 터미널에 JSON을 넣는 방식입니다. WebUI 버전인지 확인하세요 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4217-4217\" title=\"원문 4217~4217줄 보기\">L4217<\/a>).<\/li><li>길이는 원곡보다 넉넉히 잡습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4390-4390\" title=\"원문 4390~4390줄 보기\">L4390<\/a>).<\/li><\/ul>\n<h2>상업 이용: 논란 있음<\/h2>\n<ul><li><strong>판도라고:<\/strong> 모델 가중치 라이선스가 <strong>CC BY-NC 4.0(비상업)<\/strong>이라고 지적했습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4359-4359\" title=\"원문 4359~4359줄 보기\">L4359<\/a>).<\/li><li><strong>Mr.HAN:<\/strong> 9/16 개발팀 공지로 <strong>사업자가 아닌 개인<\/strong>은 상업적 이용이 허용됐다고 했습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4211-4211\" title=\"원문 4211~4211줄 보기\">L4211<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4366-4366\" title=\"원문 4366~4366줄 보기\">L4366<\/a>).<\/li><li><strong>위키 판단:<\/strong> 두 말이 다릅니다. 쓰기 전에 공식 저장소의 라이선스를 직접 확인하세요. → <a class=\"wl\" href=\"#/page/%EC%A0%80%EC%9E%91%EA%B6%8C%EA%B3%BC-%EB%9D%BC%EC%9D%B4%EC%84%A0%EC%8A%A4\">저작권과-라이선스<\/a><\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%9D%8C%EC%95%85-%EB%A7%8C%EB%93%A4%EA%B8%B0\">음악-만들기<\/a>, <a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"수노","title":"수노 (Suno)","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방"},{"name":"src-AI영상방-대화","title":"자료 요약: AI영상방 대화 내보내기","folder":"AI영상방"},{"name":"AI영상방-기록","title":"작업 기록 (log) — AI영상방","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"}],"outgoing":[{"name":"로컬-영상-생성","title":"로 1106_0943?l=6159-6160\" title=\"원문 6159~6160줄 보기\">L6159-6160<\/a><\/td><\/tr><tr><td>11월<\/td><td>드래프트 모드도 1080p로 나옴. 태그 방식이 불편함<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6168-6168\" title=\"원문 6168~6168줄 보기\">L6168<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6192-6192\" title=\"원문 6192~6192줄 보기\">L6192<\/a><\/td><\/tr><tr><td>11월<\/td><td>15초에 550크레딧. 캡컷 기본 구독은 월 700포인트라 <strong>약 12초 분량밖에 못 만듦<\/strong><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6199-6202\" title=\"원문 6199~6202줄 보기\">L6199-6202<\/a><\/td><\/tr><tr><td>11월<\/td><td>서버가 느려 생성에 하루 종일 걸렸다는 보고<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6197-6197\" title=\"원문 6197~6197줄 보기\">L6197<\/a><\/td><\/tr><tr><td>11월<\/td><td>\"스토리 스튜디오\"로 대본과 에셋 이미지를 만드는 파이프라인 → <a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6191-6194\" title=\"원문 6191~6194줄 보기\">L6191-6194<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a>, <a class=\"wl\" href=\"#/page/%ED%8E%B8%EC%A7%91-%ED%88%B4\">편집-툴<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","folder":"AI영상방"},{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"크레딧-비용-절약","title":"크레딧·비용 \">L80-81<\/a>).<\/li><li>런웨이 안의 <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스<\/a>는 결과가 처참했다는 평입니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=107-107\" title=\"원문 107~107줄 보기\">L107<\/a>).<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","folder":"AI영상방"},{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"}],"outgoing":[{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","exists":true},{"name":"시댄스","title":"시댄스 (Seedance)","exists":true}]},"뮤즈-AI":{"name":"뮤즈-AI","title":"뮤즈 AI (Meta Muse)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/뮤즈-AI.md","fm":{"type":"entity","tags":["도구","이미지","영상모델","무료"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L3009-3041 L3525-3527 L4576-4607 L5100-5101 L6193 L6263-6290"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3009-3041\" title=\"원문 3009~3041줄 보기\">L3009-3041<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3525-3527\" title=\"원문 3525~3527줄 보기\">L3525-3527<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4576-4607\" title=\"원문 4576~4607줄 보기\">L4576-4607<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5100-5101\" title=\"원문 5100~5101줄 보기\">L5100-5101<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6193-6193\" title=\"원문 6193~6193줄 보기\">L6193<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6263-6290\" title=\"원문 6263~6290줄 보기\">L6263-6290<\/a>"],"html":"<h1>뮤즈 AI (Meta Muse)<\/h1>\n<p>메타의 이미지·영상 생성 서비스입니다. <strong>무료<\/strong>라서 9월부터 화제가 됐습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3009-3041\" title=\"원문 3009~3041줄 보기\">L3009-3041<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4576-4607\" title=\"원문 4576~4607줄 보기\">L4576-4607<\/a>).<\/p>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>9월<\/td><td>Muse Spark 1.3은 OpenCode에서 무료로 쓸 수 있지만 데이터를 수집하므로 <strong>개인정보를 넣지 말 것<\/strong><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3525-3527\" title=\"원문 3525~3527줄 보기\">L3525-3527<\/a><\/td><\/tr><tr><td>11월<\/td><td>무료이지만 프롬프트 가이드와 모델 사양 정보가 없어 세밀하게 제어하기 어려움<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5100-5101\" title=\"원문 5100~5101줄 보기\">L5100-5101<\/a><\/td><\/tr><tr><td>11월<\/td><td>4K를 지원하고 미드저니 같은 색감<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6263-6273\" title=\"원문 6263~6273줄 보기\">L6263-6273<\/a><\/td><\/tr><tr><td>11월<\/td><td>좋은 시트 예시를 몇 개 먼저 주면 그 방식을 학습함 → <a class=\"wl\" href=\"#/page/%EC%BA%90%EB%A6%AD%ED%84%B0-%EC%8B%9C%ED%8A%B8\">캐릭터-시트<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6269-6269\" title=\"원문 6269~6269줄 보기\">L6269<\/a><\/td><\/tr><tr><td>11월<\/td><td><strong>영상은 디지털 느낌이 강하고 통제가 어려움.<\/strong> 눈 색이 바뀌는 등<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6283-6290\" title=\"원문 6283~6290줄 보기\">L6283-6290<\/a><\/td><\/tr><tr><td>11월<\/td><td>지역 제한으로 영상 기능을 못 쓰는 사람이 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6277-6280\" title=\"원문 6277~6280줄 보기\">L6277-6280<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>쓰임새:<\/strong> Mr.HAN의 파이프라인에서 프롬프트를 <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%8B%88%EB%A7%A5%EC%8A%A4-H3\">미니맥스<\/a>용으로 바꾸는 데 씁니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6193-6193\" title=\"원문 6193~6193줄 보기\">L6193<\/a>).<\/li><li><strong>배경 이미지:<\/strong> <a class=\"wl\" href=\"#/page/%EB%AF%B8%EB%93%9C%EC%A0%80%EB%8B%88\">미드저니<\/a>와 함께 배경용으로 추천됩니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6246-6248\" title=\"원문 6246~6248줄 보기\">L6246-6248<\/a>).<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"로컬-영상-생성","title":"로컬 영상 생성 (내 PC로 만들기)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"미드저니","title":"미드저니 (Midjourney)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"src-AI영상방-대화","title":"자료 요약: AI영상방 대화 내보내기","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"캐릭터-시트","title":"캐릭터 시트","folder":"AI영상방"}],"outgoing":[{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","exists":true},{"name":"미드저니","title":"미드저니 (Midjourney)","exists":true},{"name":"캐릭터-시트","title":"캐릭터 시트","exists":true}]},"미니맥스-H3":{"name":"미니맥스-H3","title":"미니맥스 H3 (MiniMax H3)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/미니맥스-H3.md","fm":{"type":"entity","tags":["도구","영상모델","로컬"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L104-128 L415-417 L1347-1400 L2777-2805 L3216 L5096-5102 L5274-5281 L5840"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=104-128\" title=\"원문 104~128줄 보기\">L104-128<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=415-417\" title=\"원문 415~417줄 보기\">L415-417<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1347-1400\" title=\"원문 1347~1400줄 보기\">L1347-1400<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2777-2805\" title=\"원문 2777~2805줄 보기\">L2777-2805<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3216-3216\" title=\"원문 3216~3216줄 보기\">L3216<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5096-5102\" title=\"원문 5096~5102줄 보기\">L5096-5102<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5274-5281\" title=\"원문 5274~5281줄 보기\">L5274-5281<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5840-5840\" title=\"원문 5840~5840줄 보기\">L5840<\/a>"],"html":"<h1>미니맥스 H3 (MiniMax H3)<\/h1>\n<p><strong>가장 싸고<\/strong>, 내 PC에서도 돌릴 수 있는 영상 모델입니다. 뮤직비디오와 세로 숏폼에 많이 씁니다.<\/p>\n<h2>방 안 평가<\/h2>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>빠른 동작에 약하고 번짐이 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=119-128\" title=\"원문 119~128줄 보기\">L119-128<\/a><\/td><\/tr><tr><td>8월<\/td><td>2D와 디자인 쪽에 강함<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=415-417\" title=\"원문 415~417줄 보기\">L415-417<\/a><\/td><\/tr><tr><td>8월<\/td><td>공식 프롬프트 가이드가 있으니 LLM에게 <strong>먼저 학습시킨 뒤<\/strong> 프롬프트를 물어볼 것<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=103-105\" title=\"원문 103~105줄 보기\">L103-105<\/a><\/td><\/tr><tr><td>8월<\/td><td><a class=\"wl\" href=\"#/page/%EB%9F%B0%EC%9B%A8%EC%9D%B4\">런웨이<\/a> 안에서 쓴 미니맥스는 결과가 처참했다는 평<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=107-107\" title=\"원문 107~107줄 보기\">L107<\/a><\/td><\/tr><tr><td>9월<\/td><td>H3 Turbo는 크레딧이 매우 싸고 30초 안에 생성<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2777-2777\" title=\"원문 2777~2777줄 보기\">L2777<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2897-2897\" title=\"원문 2897~2897줄 보기\">L2897<\/a><\/td><\/tr><tr><td>9월<\/td><td>특유의 지글거림, 액션·멀티 레퍼런스에 약함. 이미지→프레임 방식은 괜찮음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2796-2805\" title=\"원문 2796~2805줄 보기\">L2796-2805<\/a><\/td><\/tr><tr><td>9월<\/td><td><a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a>에도 들어옴<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3216-3217\" title=\"원문 3216~3217줄 보기\">L3216-3217<\/a><\/td><\/tr><tr><td>11월<\/td><td><strong>H3가 표준 모델이고 가장 쌈.<\/strong> Max는 속도만 빠름<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5278-5281\" title=\"원문 5278~5281줄 보기\">L5278-5281<\/a><\/td><\/tr><tr><td>11월<\/td><td>뮤비에 좋음. Blender 프리비즈를 넣어 카메라 무빙을 줄 수 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5274-5274\" title=\"원문 5274~5274줄 보기\">L5274<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5096-5096\" title=\"원문 5096~5096줄 보기\">L5096<\/a><\/td><\/tr><tr><td>11월<\/td><td>MV 한 편에 RunningHub 약 8천 코인 (재생성 포함)<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5840-5840\" title=\"원문 5840~5840줄 보기\">L5840<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>약점<\/h2>\n<ul><li>액션 장면<\/li><li>한글 글자 출력 (복불복, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=26-38\" title=\"원문 26~38줄 보기\">L26-38<\/a>)<\/li><li>작은 얼굴은 뭉개짐 → <a class=\"wl\" href=\"#/page/%EB%A1%9C%EC%BB%AC-%EC%98%81%EC%83%81-%EC%83%9D%EC%84%B1\">로컬-영상-생성<\/a>의 FaceDetailer<\/li><\/ul>\n<h2>로컬 실행<\/h2>\n<ul><li>가속 LoRA(MiniMax-H3-Acc-LoRAs 61106_0943?l=2964-2964\" title=\"원문 2964~2964줄 보기\">L2964<\/a><\/td><\/tr><tr><td>9월<\/td><td>저작권 필터가 과하다는 불만<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4260-4260\" title=\"원문 4260~4260줄 보기\">L4260<\/a><\/td><\/tr><tr><td>11월<\/td><td><strong>클로드에 수노 MCP를 연결<\/strong>해 곡을 만들면 편함. 너무 길면 짧게 다시 만들게 함<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4709-4734\" title=\"원문 4709~4734줄 보기\">L4709-4734<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>요령<\/h2>\n<ul><li><strong>원하는 분위기 따라 하기:<\/strong> 참고곡을 LLM에 주고 수노용 스타일 프롬프트와 가사를 추천받습니다 (로킹, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2271-2273\" title=\"원문 2271~2273줄 보기\">L2271-2273<\/a>).<\/li><li><strong>유튜브 유입:<\/strong> 오리지널만 올리면 잘 안 봅니다. 커버곡을 가끔 섞으면 도움이 됩니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5943-5949\" title=\"원문 5943~5949줄 보기\">L5943-5949<\/a>).<\/li><\/ul>\n<h2>대안<\/h2>\n<ul><li><a class=\"wl\" href=\"#/page/YuE2\">YuE2<\/a>: 오픈소스<\/li><li><a class=\"wl\" href=\"#/page/Flow\">Flow<\/a> 뮤직<\/li><li>자세한 내용은 <a class=\"wl\" href=\"#/page/%EC%9D%8C%EC%95%85-%EB%A7%8C%EB%93%A4%EA%B8%B0\">음악-만들기<\/a>에 있습니다.<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"Flow","title":"Flow (구글)","folder":"AI영상방"},{"name":"YuE2","title":"YuE2","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"음악-만들기","title":"음악 만들기","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","folder":"AI영상방"}],"outgoing":[{"name":"Flow","title":"Flow (구글)","exists":true},{"name":"YuE2","title":"YuE2","exists":true},{"name":"음악-만들기","title":"음악 만들기","exists":true}]},"시댄스":{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","pat ass='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>2.5가 더 부드럽고 사실적<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=299-299\" title=\"원문 299~299줄 보기\">L299<\/a><\/td><\/tr><tr><td>8월<\/td><td><strong>2D 애니는 2.0이 더 깔끔<\/strong>. 각각 3번씩 뽑아 3번 다 2.0 선택. 애니엔 2.0 mini도 괜찮음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=317-326\" title=\"원문 317~326줄 보기\">L317-326<\/a><\/td><\/tr><tr><td>8월<\/td><td>2.5는 영상 속 특정 부분 수정에 쓸 수 있다는 말 (전해 들은 정보)<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=1263-1263\" title=\"원문 1263~1263줄 보기\">L1263<\/a><\/td><\/tr><tr><td>9월<\/td><td>저작권 필터가 엄격해서 외주 작업을 미니맥스로 대체<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2789-2793\" title=\"원문 2789~2793줄 보기\">L2789-2793<\/a><\/td><\/tr><tr><td>9월<\/td><td>2.5는 \"BGM 금지\"라고 적어도 음악이 섞여 나옴<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4446-4447\" title=\"원문 4446~4447줄 보기\">L4446-4447<\/a><\/td><\/tr><tr><td>11월<\/td><td>대사에 한계가 있음 → <a class=\"wl\" href=\"#/page/%EB%8C%80%EC%82%AC%EC%99%80-%EB%AA%A9%EC%86%8C%EB%A6%AC\">대사와-목소리<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5145-5145\" title=\"원문 5145~5145줄 보기\">L5145<\/a><\/td><\/tr><tr><td>11월<\/td><td>액션은 최강이지만 캐릭터 일관성은 약하고, 매우 비쌈<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5499-5501\" title=\"원문 5499~5501줄 보기\">L5499-5501<\/a><\/td><\/tr><tr><td>11월<\/td><td>사고(이상한 결과)가 가장 적음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5355-5355\" title=\"원문 5355~5355줄 보기\">L5355<\/a><\/td><\/tr><tr><td>11월<\/td><td>실사는 2.5, 애니는 2.0. 둘의 색감이 다름<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6246-6246\" title=\"원문 6246~6246줄 보기\">L6246<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6261-6261\" title=\"원문 6261~6261줄 보기\">L6261<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>비용 (대화 시점 기준)<\/h2>\n<ul><li>15초 생성: 2.5가 18크레딧. <a class=\"wl\" href=\"#/page/%ED%83%91%EB%B7%B0-T1\">탑뷰-T1<\/a>은 15크레딧입니다 (11월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5284-5284\" title=\"원문 5284~5284줄 보기\">L5284<\/a>).<\/li><li>시댄스만으로 약 3분 분량을 만드는 데 약 9만~10만 원이 들었습니다 (11월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5492-5493\" title=\"원문 5492~5493줄 보기\">L5492-5493<\/a>).<\/li><li>2.5는 2.0보다 2배 넘게 비쌉니다 (<a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a> 기준, 8월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=83-83\" title=\"원문 83~83줄 보기\">L83<\/a>).<\/li><\/ul>\n<h2>쓰는 요령<\/h2>\n<ul><li>비싸므로 <strong>화려한 액션 컷에만<\/strong> 씁니다 → <a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a><\/li><li>대사 발음은 소리 나는 대로 적습니다 → <a class=\"wl\" href=\"#/page/%EB%8C%80%EC%82%AC%EC%99%80-%EB%AA%A9%EC%86%8C%EB%A6%AC\">대사와-목소리<\/a><\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"CLAUDE","title":"CLAUDE.md — docs/kb LLM Wiki 스키마","folder":"볼트"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"Wan","title":"Wan (완)","folder":"AI영상방"},{"name":"대사와-목소리","title":"대사와 목소리","folder":"AI영상방"},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","folder":"AI영상방"},{"name":"런웨이","title":"런웨이 (Runway)","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"영상-모델-비 ef=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4295-4300\" title=\"원문 4295~4300줄 보기\">L4295-4300<\/a><\/td><\/tr><tr><td>11월<\/td><td>편집 스킬, 대본 정리, 프리비즈를 잘 만듦. 이미지 해석은 엉뚱할 때가 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4956-4961\" title=\"원문 4956~4961줄 보기\">L4956-4961<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5012-5015\" title=\"원문 5012~5015줄 보기\">L5012-5015<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5043-5043\" title=\"원문 5043~5043줄 보기\">L5043<\/a><\/td><\/tr><tr><td>11월<\/td><td>Opus는 사용량이 빨리 닳는다는 체감<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5126-5131\" title=\"원문 5126~5131줄 보기\">L5126-5131<\/a><\/td><\/tr><tr><td>11월<\/td><td>PC에 켜 두고 휴대폰으로 지시하면 MCP로 그림·음악·영상까지 처리<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6254-6259\" title=\"원문 6254~6259줄 보기\">L6254-6259<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>모델 소식<\/h2>\n<ul><li><strong>9/21:<\/strong> 방장이 Opus 5.5 출시설을 전했습니다. 가격은 루머라고 밝혔습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2247-2260\" title=\"원문 2247~2260줄 보기\">L2247-2260<\/a>).<\/li><li><strong>9/23:<\/strong> 방장이 \"Opus 5.5 vs 아스트라\" 비교 영상을 올렸습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4648-4653\" title=\"원문 4648~4653줄 보기\">L4648-4653<\/a>). → <a class=\"wl\" href=\"#/page/%EC%93%B8%EB%A7%8C%ED%95%9C-%EB%A7%81%ED%81%AC\">쓸만한-링크<\/a><\/li><\/ul>\n<h2>활용<\/h2>\n<ul><li>MCP 연결과 토큰 절약 요령은 <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C-MCP-%ED%99%9C%EC%9A%A9\">클로드-MCP-활용<\/a>에 있습니다.<\/li><li><a class=\"wl\" href=\"#/page/GPT-%EC%BD%94%EB%8D%B1%EC%8A%A4\">GPT-코덱스<\/a>와의 역할 분담도 참고하세요.<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"n %81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5267-5267\" title=\"원문 5267~5267줄 보기\">L5267<\/a>). 실제 버전은 확인되지 않았습니다.<\/li><li>플랫폼을 고를 때 \"클링 = 단일 툴, <a class=\"wl\" href=\"#/page/%ED%9E%89%EC%8A%A4%ED%95%84%EB%93%9C\">힉스필드<\/a> = 여러 모델 모음\"으로 비교됩니다.<\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"}],"outgoing":[{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","exists":true},{"name":"힉스필드","title":"힉스필드 (Higgsfield)","exists":true}]},"탑뷰-T1":{"name":"탑뷰-T1","title":"탑뷰 T1 (Topview T1)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/탑뷰-T1.md","fm":{"type":"entity","tags":["도구","영상모델"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L5272-5300"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5272-5300\" title=\"원문 5272~5300줄 보기\">L5272-5300<\/a>"],"html":"<h1>탑뷰 T1 (Topview T1)<\/h1>\n<p>Topview에서만 쓸 수 있는 영상 모델입니다.<\/p>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>11월<\/td><td>방장: \"탑뷰 T1 좋습니다.\" <a class=\"wl\" href=\"#/page/%EC%8B%9C%EB%8C%84%EC%8A%A4\">시댄스<\/a> 2.5를 증류한 것 같고 품질이 거의 비슷함<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5272-5282\" title=\"원문 5272~5282줄 보기\">L5272-5282<\/a><\/td><\/tr><tr><td>11월<\/td><td>15초에 T1은 15크레딧, 시댄스 2.5는 18크레딧. <strong>차이가 작아 그냥 2.5를 쓴다<\/strong>는 의견<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5284-5284\" title=\"원문 5284~5284줄 보기\">L5284<\ > <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4952-4952\" title=\"원문 4952~4952줄 보기\">L4952<\/a>"],"html":"<h1>편집 툴<\/h1>\n<p>11/4에 자막 가독성 이야기에서 시작해 편집 툴을 비교했습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4779-4972\" title=\"원문 4779~4972줄 보기\">L4779-4972<\/a>).<\/p>\n<div class='tw'><table><thead><tr><th>툴<\/th><th>평가<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td><strong>캡컷 (CapCut)<\/strong><\/td><td>가장 무난하고 쓰기 쉬움. 입문용 추천<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3601-3601\" title=\"원문 3601~3601줄 보기\">L3601<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4902-4902\" title=\"원문 4902~4902줄 보기\">L4902<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4950-4950\" title=\"원문 4950~4950줄 보기\">L4950<\/a><\/td><\/tr><tr><td>프리미어 (Premiere)<\/td><td>유료 로컬 앱<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4802-4805\" title=\"원문 4802~4805줄 보기\">L4802-4805<\/a><\/td><\/tr><tr><td>파워디렉터<\/td><td>무겁고, 5분 넘게 편집하면 블루스크린이 잦음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4926-4928\" title=\"원문 4926~4928줄 보기\">L4926-4928<\/a><\/td><\/tr><tr><td>다빈치 리졸브<\/td><td>MCP를 붙일 수 있다는 소식 (불확실). 시댄스 2.0과 2.5의 색감을 맞출 때 쓴다는 말<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4941-4941\" title=\"원문 4941~4941줄 보기\">L4941<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=6248-6248\" title=\"원문 6248~6248줄 보기\">L6248<\/a><\/td><\/tr><tr><td>쌤컷<\/td><td>캡컷보다 간단한 무료 컷 편집기. <a href=\"https://ssamtool.com/tool/cut/\" target=\"_blank\" rel=\"noopener\">https://ssamtool.com/tool/cut/<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4952-4952\" title=\"원문 4952~4952줄 보기\">L4952<\/a><\/td><\/tr><tr><td>아트크래프트<\/td><td>오픈소스 로컬 편집 툴, 완성도는 아직 부족. <a href=\"https://getartcraft.com/\" target=\"_blank\" rel=\"noopener\">https://getartcraft.com/<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4815-4833\" title=\"원문 4815~4833줄 보기\">L4815-4833<\/a><\/td><\/tr><tr><td>클로드·GPT<\/td><td>편집 스킬을 만들어 맡기는 방식 → <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C\">클로드<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4956-4961\" title=\"원문 4956~4961줄 보기\">L4956-4961<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>꼭 알아 둘 요령: 캡컷 울렁임<\/h2>\n<ul><li>AI 영상은 보통 <strong>24fps<\/strong>인데 캡컷 기본 내보내기는 30fps입니다.<\/li><li><strong>24fps로 맞춰 내보내면<\/strong> 울렁임이 사라집니다 (카이로스, 8월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=302-306\" title=\"원문 302~306줄 보기\">L302-306<\/a>).<\/li><\/ul>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","folder":"AI영상방"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"쓸만한-링크","title":"쓸만한 링크 (AI영상방에서 공유)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"초보-시작-가이드","title":"초보 시작 가이드 (방 안 답변 종합)","folder":"AI영상방"}],"outgoing":[{"name":"클로드","title":"클로드 (Claude)","exists":true}]},"힉스필드":{"name":"힉스필드","title":"힉스필드 (Higgsfield)","folder":"AI영상방_KakaoTalk_20261106_0943","folderLabel":"AI영상방","section":"entities","path":"AI영상방_KakaoTalk_20261106_0943/wiki/entities/힉스필드.md","fm":{"type":"entity","tags":["도구","플랫폼"],"rooms":["AI영상방"],"sources":["src-AI영상방-대화 L442-496 L523-524 L2414-2416 L3132 L4186 L4280 L5057-5059 L5113-5120 L5443-5519 L5888-5892 L5978-5981"],"updated":"2026-11-06"},"sourcesHtml":["src-AI영상방-대화 <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=442-496\" title=\"원문 442~496줄 보기\">L442-496<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=523-524\" title=\"원문 523~524줄 보기\">L523-524<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2414-2416\" title=\"원문 2414~2416줄 보기\">L2414-2416<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3132-3132\" title=\"원문 3132~3132줄 보기\">L3132<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4186-4186\" title=\"원문 4186~4186줄 보기\">L4186<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4280-4280\" title=\"원문 4280~4280줄 보기\">L4280<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5057-5059\" title=\"원문 5057~5059줄 보기\">L5057-5059<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5113-5120\" title=\"원문 5113~5120줄 보기\">L5113-5120<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5443-5519\" title=\"원문 5443~5519줄 보기\">L5443-5519<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5888-5892\" title=\"원문 5888~5892줄 보기\">L5888-5892<\/a> <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5978-5981\" title=\"원문 5978~5981줄 보기\">L5978-5981<\/a>"],"html":"<h1>힉스필드 (Higgsfield)<\/h1>\n<p>여러 영상·이미지 모델을 한곳에 모은 <strong>\"스튜디오\"형 플랫폼<\/strong>입니다.<\/p>\n<h2>방 안 평가<\/h2>\n<div class='tw'><table><thead><tr><th>대화 시점<\/th><th>내용<\/th><th>줄<\/th><\/tr><\/thead><tbody><tr><td>8월<\/td><td>무제한 요금제여도 동시 대기는 6개가 한계. 6개를 다 걸면 무료 생성은 안 되고 크레딧으로만 됨<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=442-451\" title=\"원문 442~451줄 보기\">L442-451<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=485-496\" title=\"원문 485~496줄 보기\">L485-496<\/a><\/td><\/tr><tr><td>8월<\/td><td>에이전트 기능(Opus), 작가도우미는 크레딧을 많이 씀<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=454-454\" title=\"원문 454~454줄 보기\">L454<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=465-469\" title=\"원문 465~469줄 보기\">L465-469<\/a><\/td><\/tr><tr><td>8월<\/td><td>클로드와 MCP로 연결할 수 있음 → <a class=\"wl\" href=\"#/page/%ED%81%B4%EB%A1%9C%EB%93%9C-MCP-%ED%99%9C%EC%9A%A9\">클로드-MCP-활용<\/a><\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=523-524\" title=\"원문 523~524줄 보기\">L523-524<\/a><\/td><\/tr><tr><td>9월<\/td><td>Genjutsu: 참고 영상의 춤을 따라 하는 기능<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=2414-2416\" title=\"원문 2414~2416줄 보기\">L2414-2416<\/a><\/td><\/tr><tr><td>9월<\/td><td>크레딧으로 쓰면 매우 비쌈. 무제한 요금제는 MCP 연결에 적용되지 않음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=3132-3132\" title=\"원문 3132~3132줄 보기\">L3132<\/a>, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4280-4280\" title=\"원문 4280~4280줄 보기\">L4280<\/a><\/td><\/tr><tr><td>9월<\/td><td>Enterprise는 입력을 학습에 쓰지 않지만 매우 비쌈<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=4186-4186\" title=\"원문 4186~4186줄 보기\">L4186<\/a><\/td><\/tr><tr><td>11월<\/td><td><strong>MCP 연결 자체는 무료<\/strong>, 생성에는 크레딧이 듦<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5057-5059\" title=\"원문 5057~5059줄 보기\">L5057-5059<\/a><\/td><\/tr><tr><td>11월<\/td><td>애니메이션 플랫폼으로 추천됨. <a class=\"wl\" href=\"#/page/%EB%93%9C%EB%A6%AC%EB%AF%B8%EB%82%98\">드리미나<\/a>는 시댄스만 있고 힉스필드에는 다 있음<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5444-5445\" title=\"원문 5444~5445줄 보기\">L5444-5445<\/a><\/td><\/tr><tr><td>11월<\/td><td>작년엔 80%까지 할인했고 올해는 할인이 적다. 블랙프라이데이 할인을 기다리는 분위기<\/td><td><a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5888-5892\" title=\"원문 5888~5892줄 보기\">L5888-5892<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<h2>주의: 피싱 의심 메일<\/h2>\n<ul><li>홈페이지에 없는 'Pro 요금제'를 안내하는 메일이 왔다는 보고가 있습니다 (11월, <a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5978-5981\" title=\"원문 5978~5981줄 보기\">L5978-5981<\/a>).<\/li><li>방 안 결론은 사기로 의심된다는 것이었습니다.<\/li><\/ul>\n<h2>비교<\/h2>\n<ul><li>Zcre는 1만 원에 1천 크레딧입니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5115-5115\" title=\"원문 5115~5115줄 보기\">L5115<\/a>).<\/li><li>같은 돈이면 Zcre가 약 30초 더 만든다는 계산이 나왔지만, GPT가 계산한 것이고 검증되지 않았습니다 (<a class=\"lref\" href=\"#/raw/AI%EC%98%81%EC%83%81%EB%B0%A9_KakaoTalk_20261106_0943?l=5348-5348\" title=\"원문 5348~5348줄 보기\">L5348<\/a>).<\/li><\/ul>\n<p>관련: <a class=\"wl\" href=\"#/page/%ED%81%AC%EB%A0%88%EB%94%A7-%EB%B9%84%EC%9A%A9-%EC%A0%88%EC%95%BD\">크레딧-비용-절약<\/a>, <a class=\"wl\" href=\"#/page/%EC%98%81%EC%83%81-%EB%AA%A8%EB%8D%B8-%EB%B9%84%EA%B5%90\">영상-모델-비교<\/a><\/p>","backlinks":[{"name":"AI영상방","title":"AI영상방 (AI아스트라 AI영상 노하우 공유방)","folder":"AI영상방"},{"name":"index","title":"KB 홈 (index)","folder":"볼트"},{"name":"AI영상방-목차","title":"목차 (index) — AI영상방","folder":"AI영상방"},{"name":"시댄스","title":"시댄스 (Seedance)","folder":"AI영상방"},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","folder":"AI영상방"},{"name":"자주-나온-질문","title":"자주 나온 질문 (AI영상방)","folder":"AI영상방"},{"name":"저작권과-라이선스","title":"저작권과 라이선스 (방 안 의견)","folder":"AI영상방"},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","folder":"AI영상방"},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","folder":"AI영상방"},{"name":"클링","title":"클링 (Kling)","folder":"AI영상방"}],"outgoing":[{"name":"드리미나","title":"드리미나 (Dreamina) · 캡컷","exists":true},{"name":"영상-모델-비교","title":"영상 모델 비교 (2026년 11월 대화 기준)","exists":true},{"name":"크레딧-비용-절약","title":"크레딧·비용 절약","exists":true},{"name":"클로드-MCP-활용","title":"클로드 MCP 활용","exi
